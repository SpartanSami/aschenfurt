<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07060a" />
  <title>BLOODMOON – Das Erbe der Finsternis</title>
  <meta name="description" content="BLOODMOON – Das Erbe der Finsternis. Ein First-Person-Gothic-Fantasy-Horrorspiel für den Browser." />
  <style>
    html, body { margin: 0; height: 100%; background: #030204; overflow: hidden; }
    #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 45%, rgba(40,4,8,.55), #030204 70%); color: #d9cfc0; cursor: pointer; transition: opacity 1.2s;
      font-family: "Cormorant Garamond", Georgia, serif; text-align: center; }
    #splash .t { font-family: "Cinzel Decorative", "Cinzel", Georgia, serif; font-size: clamp(42px, 7vw, 84px); letter-spacing: .14em; color: #e8e0d0; text-shadow: 0 0 34px rgba(160,10,20,.6); }
    #splash .s { margin-top: 18px; font-size: 20px; font-style: italic; color: #8a8076; line-height: 1.6; max-width: 640px; padding: 0 20px; }
    #splash .c { margin-top: 48px; font-family: "Cinzel", Georgia, serif; font-size: 14px; letter-spacing: .4em; text-transform: uppercase; color: #b0915a; opacity: 0; transition: opacity 1s; }
    #splash.ready .c { opacity: 1; animation: bmPulse 2.4s infinite; }
    #splash .l { position: absolute; bottom: 40px; font-size: 15px; color: #5a524c; letter-spacing: .1em; }
    @keyframes bmPulse { 0%,100% { opacity: .4 } 50% { opacity: 1 } }
  </style>
</head>
<body>
  <div id="rotateHint">Bitte das Gerät quer halten.<br />Linke Hälfte: gehen · rechte Hälfte: umschauen</div>
  <div id="app"></div>
  <div id="ui"></div>
  <div id="splash">
    <div class="t">BLOODMOON</div>
    <div class="s">Das Erbe der Finsternis</div>
    <div class="c">Klicken oder tippen, um zu erwachen</div>
    <div class="l">Kopfhörer empfohlen · Maus &amp; Tastatur · Chrome / Edge</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
