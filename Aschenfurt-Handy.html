<style>
/* ============================================================
   ASCHENFURT – Akte Nachtgrau · Noir Urban-Fantasy Detektivspiel
   ============================================================ */

:root{
  --bg:#14161a;
  --bg2:#1b1e24;
  --bg3:#23272f;
  --bg4:#2b303a;
  --linie:#343a46;
  --text:#d6d9de;
  --text2:#9aa1ac;
  --text3:#6c7380;
  --akzent:#d4a24e;       /* Bernstein */
  --akzent2:#5fb3b3;      /* kaltes Petrol */
  --rot:#c25b5b;
  --gruen:#7ba974;
  --lila:#9a7fc9;
  --ich:#2e4a5a;
  --npc:#262b33;
  --schatten:0 6px 24px rgba(0,0,0,.45);
  --radius:14px;
  --fs:16px;
}
[data-theme="hell"]{
  --bg:#efece5; --bg2:#f7f4ee; --bg3:#e7e2d8; --bg4:#ddd6c9;
  --linie:#cfc7b8; --text:#2a2c30; --text2:#5a5e66; --text3:#8a8e96;
  --akzent:#a3742a; --akzent2:#2e7d7d; --ich:#cfe2ec; --npc:#e9e4da;
  --schatten:0 6px 20px rgba(60,50,30,.18);
}
[data-textsize="s"]{ --fs:14px; }
[data-textsize="m"]{ --fs:16px; }
[data-textsize="l"]{ --fs:18px; }
[data-textsize="xl"]{ --fs:21px; }

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
  font-size:var(--fs); line-height:1.55;
  overflow:hidden;
}
body[data-anim="aus"] *{ transition:none!important; animation:none!important; }

h1,h2,h3,h4,.serif{ font-family:Georgia, "Times New Roman", serif; }
button{ font-family:inherit; font-size:inherit; color:inherit; background:none; border:none; cursor:pointer; }
input,select,textarea{
  font-family:inherit; font-size:inherit; color:var(--text);
  background:var(--bg3); border:1px solid var(--linie); border-radius:10px;
  padding:9px 12px; width:100%;
}
input:focus,select:focus,textarea:focus{ outline:2px solid var(--akzent); outline-offset:1px; }
::placeholder{ color:var(--text3); }
a{ color:var(--akzent2); }

#app{ height:100%; display:flex; flex-direction:column; }
.screen{ display:none; height:100%; }
.screen.aktiv{ display:flex; flex-direction:column; }
.versteckt{ display:none!important; }

/* ---------- Titel ---------- */
#screen-title{ align-items:center; justify-content:center; text-align:center;
  background:radial-gradient(ellipse at 50% 18%, #232a36 0%, var(--bg) 62%); overflow-y:auto; }
.title-inner{ padding:40px 20px; max-width:560px; margin:auto; }
.title-logo{ font-size:64px; filter:drop-shadow(0 0 22px rgba(212,162,78,.4)); }
.title-haupt{ font-size:46px; letter-spacing:12px; margin-top:10px; color:var(--text); }
.title-sub{ font-family:Georgia,serif; font-size:20px; color:var(--akzent); letter-spacing:4px; margin-top:4px; }
.title-tag{ color:var(--text2); margin:22px 0 30px; }
.title-buttons{ display:flex; flex-direction:column; gap:12px; align-items:center; }
.title-frei{ margin-top:34px; font-size:.78em; color:var(--text3); letter-spacing:.5px; }

.btn{
  background:var(--bg3); border:1px solid var(--linie); border-radius:12px;
  padding:12px 26px; transition:all .15s; min-width:240px; text-align:center;
}
.btn:hover{ border-color:var(--akzent); transform:translateY(-1px); }
.btn-primary{ background:linear-gradient(160deg,#3a3122,#2a2419); border-color:var(--akzent); color:var(--akzent); font-weight:600; }
.btn-klein{ min-width:0; padding:7px 14px; font-size:.9em; border-radius:9px; }
.btn-gefahr{ border-color:var(--rot); color:var(--rot); }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }

/* ---------- Charaktererstellung ---------- */
#screen-create{ overflow-y:auto; }
.create-inner{ max-width:760px; margin:0 auto; padding:28px 18px 60px; width:100%; }
.create-schritt{ color:var(--akzent2); font-size:.85em; letter-spacing:2px; text-transform:uppercase; }
.create-titel{ font-size:1.7em; margin:6px 0 4px; }
.create-sub{ color:var(--text2); margin-bottom:22px; }
.karten{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; }
.karte{
  background:var(--bg2); border:1px solid var(--linie); border-radius:var(--radius);
  padding:16px; text-align:left; transition:all .15s; position:relative;
}
.karte:hover{ border-color:var(--akzent2); }
.karte.gewaehlt{ border-color:var(--akzent); background:var(--bg3); box-shadow:0 0 0 1px var(--akzent); }
.karte h3{ font-size:1.06em; margin-bottom:6px; color:var(--text); }
.karte .k-icon{ float:right; font-size:1.5em; margin-left:8px; }
.karte p{ color:var(--text2); font-size:.92em; }
.karte ul{ margin:8px 0 0 18px; color:var(--text2); font-size:.86em; }
.karte ul li.plus{ color:var(--gruen); } .karte ul li.minus{ color:var(--rot); }
.create-nav{ display:flex; justify-content:space-between; margin-top:26px; gap:12px; }
.zusammenfassung{ background:var(--bg2); border:1px solid var(--linie); border-radius:var(--radius); padding:20px; }
.zusammenfassung dt{ color:var(--akzent2); font-size:.82em; text-transform:uppercase; letter-spacing:1.5px; margin-top:14px; }
.zusammenfassung dd{ margin:2px 0 0; }

/* ---------- Hauptlayout ---------- */
#screen-game{ }
#topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; background:var(--bg2); border-bottom:1px solid var(--linie); flex:0 0 auto;
}
#topbar-fall{ font-family:Georgia,serif; color:var(--akzent); font-size:.95em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#topbar-rechts{ display:flex; gap:6px; }
.tb-btn{ font-size:1.15em; padding:4px 10px; border-radius:8px; }
.tb-btn:hover{ background:var(--bg3); }

#view{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.view-inner{ max-width:860px; margin:0 auto; padding:18px 16px 90px; }

#tabbar{
  flex:0 0 auto; display:flex; background:var(--bg2); border-top:1px solid var(--linie);
  overflow-x:auto; scrollbar-width:none;
}
#tabbar::-webkit-scrollbar{ display:none; }
.tab{
  flex:1 0 auto; min-width:72px; padding:9px 6px 11px; text-align:center;
  color:var(--text3); font-size:.72em; display:flex; flex-direction:column; gap:2px; position:relative;
}
.tab .t-icon{ font-size:1.55em; line-height:1.15; }
.tab.aktiv{ color:var(--akzent); }
.tab .badge{
  position:absolute; top:4px; right:14px; background:var(--rot); color:#fff;

#modal-wrap{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; }

@media (min-width:880px){

/* ============================================================
   util.js – Hilfsfunktionen & globale Namensräume
   ============================================================ */
"use strict";

window.GameData = { cases: {}, welt: null, npcs: null };

const U = {
  el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  },
  esc(s) {
    return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  },
  // einfache Normalisierung für Suche / Freitext
  norm(s) {
    return String(s ?? "").toLowerCase()
      .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
      .replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
  },
  enthaeltWort(text, woerter) {
    const t = " " + U.norm(text) + " ";
    return woerter.some(w => t.includes(" " + U.norm(w)) || t.includes(U.norm(w)));
  },
  klemm(v, min, max) { return Math.max(min, Math.min(max, v)); },
  kopie(o) { return JSON.parse(JSON.stringify(o)); },
  mischArr(a) { return a; }, // bewusst deterministisch – Canon bleibt Canon
  zeitStempel() {
    const d = new Date();
    return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
  }
};

      titel: "Das Gift kam aus dem Hämatek-Labor",
      text: "Etorphin im Blut des Opfers – und eine vertuschte Fehlmenge im Hämatek-Bestand, gegengezeichnet von Dr. Sasse. Die Mordwaffe stammt aus ihrem eigenen Giftschrank." },
    { id: "i1_motiv", a: "c1_akte", b: "c1_dienstplan",
      titel: "Wer die Meldung fürchtete",
      text: "Jonas wollte die Blut-Abzweigung an die Morgenstern-Stiftung melden. Die Person, die ihre Spuren im Zugangssystem löschte, hatte allen Grund, genau das zu verhindern: E. Sasse." },
    { id: "i1_sasse_basar", a: "c1_handschuh", b: "c1_sichtung",
      titel: "Die Frau mit der Sporttasche",
      text: "Die Käuferin des Fenris-Handschuhs: schlank, ruhig, Laborhandschuhe. Die Gestalt am Tatort: schmal, Sporttasche, kontrolliert. Dasselbe Profil – und es passt auf Dr. Elif Sasse." },
    { id: "i1_kalender", a: "c1_becher", b: "c1_etorphin",
      titel: "Der Kaffee um neun",
      text: "Jonas traf um 21:00 Uhr ein „E.“ im Park – mit Kaffee. Im Kaffee: Etorphin. Das Treffen war die Tatwaffe." },
  ],

  timelineBasis: [
    { zeit: "Sa, 19:55", sortier: 1955, text: "Jonas verlässt Hämatek (letzte reguläre Ausgangsbuchung).", quelle: "Zugangslog", clue: "c1_dienstplan" },
    { zeit: "Sa, 20:40", sortier: 2040, text: "Jonas' Handy zum letzten Mal aktiv – Funkzelle Stadtpark.", quelle: "Provider-Auskunft" },

    { zeit: "Sa, 21:00–21:30", sortier: 2100, text: "Todeszeitfenster laut Obduktion.", quelle: "Rechtsmedizin", clue: "c1_todeszeit" },

  /* ---------------- Chats / Sequenzen ---------------- */
  beimStart(api) {
    api.log("Fall 1 angenommen: Ein Toter im Stadtpark, inszeniert wie ein Werwolfangriff.");
    api.frage("f1_warum_werwolf", "Warum sollte der Mord wie ein Werwolfangriff aussehen?");
    if (Engine.H().beruf("exkrimineller")) api.flag("basar_zugang");
    Engine.spieleSequenz("f1_intro");
  },

  sequenzen: {
    f1_intro: {
      chat: "ada",
      schritte: [
        { von: "ada", text: "Aufwachen. Wir haben einen Toten im Stadtpark, direkt an der Reviergrenze. Sieht aus wie ein Wolfsangriff. Vollmondnacht. Die Presse wird durchdrehen." },
        { von: "ada", text: "Das Rathaus sitzt mir schon im Nacken: ‚Schnell, leise, und bitte kein Fraktionenkrieg.‘ Deshalb du. Du bist offiziell ‚beratender Ermittler‘ – inoffiziell bist du mein bester Zugriff auf diesen Sumpf." },
        { von: "ada", text: "David Roth ist dir zugeteilt, der Junge ist fleißig. Dr. Marek macht die Leiche. Tatort ist gesichert. Fang an, wo du willst – aber fang an." },
        { wahl: [
          { label: "Ich fahre zuerst zum Tatort.", antwort: [{ von: "ada", text: "Gute Wahl. Die Spurensicherung ist noch vor Ort. Und hör auf das, was die Leiche dir sagt, nicht auf das, was die Schlagzeile dir sagen will." }] },
          { label: "Was wissen wir über das Opfer?", antwort: [{ von: "ada", text: "Jonas Brandt, 34, Logistiker bei Hämatek – die Blutbank mit den Konvent-Verträgen. Kein Vorstrafenregister, keine Feinde. Bis auf eine Anzeige, die er vor drei Wochen gegen ein Rudelmitglied gestellt hat: Bruno Falk. Bedrohung. Verfahren eingestellt." }, { von: "ada", text: "Und bevor du fragst: Ja, das Rathaus hätte gern, dass es Falk war. Schön einfach. Genau deshalb will ich, dass du es ordentlich machst." }] },
          { label: "Warum übernimmt das nicht die Mordkommission?", antwort: [{ von: "ada", text: "Weil auf dem Toten Wolfshaare liegen und in drei Stunden Vollmond-Kernnacht zwei ist. Sowas landet bei Dezernat 13, und Dezernat 13 – das sind im Moment im Wesentlichen ich, du, ein Praktikantenbudget und ein Kaffeeautomat mit Aggressionsproblem." }] },
        ] },
        { von: "ada", text: "Noch was: Wenn du draußen auf Konvent, Rudel oder Zirkel triffst – sei klug. Der Pakt der Stillen Stadt ist älter als wir beide, und er reißt schneller, als man ihn flickt." },
        { gedanke: "Ein Toter an der Reviergrenze, in der Nacht vor Vollmond. Entweder war es das dümmste Monster der Stadt – oder das klügste." },
      ],
    },

    f1_david_start: {
      chat: "david",
      schritte: [
        { von: "david", text: "Hey! David hier. Ada hat mich dir zugeteilt – ich besorg dir alles: Akten, Abfragen, Kaffee. Bin echt froh, dass ich bei was Großem dabei sein darf." },
        { von: "david", text: "Erste Infos: Opfer ist Jonas Brandt, Hämatek. Anzeige gegen Bruno Falk liegt im System, schick ich dir. Sag einfach, was du brauchst." },
        { wahl: [
          { label: "Besorg mir Jonas' Handydaten.", antwort: [{ von: "david", text: "Schon angefragt! Provider sagt: letzte Aktivität Samstag 20:40, Funkzelle Stadtpark. Danach nichts mehr. Trag ich dir in die Timeline ein." }] },
          { label: "Danke, David. Schön, dich dabei zu haben.", tu: (api) => api.npc("david", { vertrauen: 5, zuneigung: 5 }), antwort: [{ von: "david", text: "Ehrlich? Danke. Die meisten behandeln mich wie ein Faxgerät mit Beinen. 😅 Ich geb alles, versprochen." }] },
          { label: "Halt dich an die Vorschriften, dann kommen wir klar.", antwort: [{ von: "david", text: "Verstanden. Alles nach Vorschrift. Bin schon an den Akten." }] },
        ] },
      ],
    },

    f1_laptop_hilfe: {
      chat: "david",
      schritte: [
        { von: "david", text: "Hab den Laptop vom Opfer durch die IT-Forensik gejagt. Passwort war der Hund vom Betriebsausflug, klassiker. 😄" },
        { von: "david", text: "Im Entwurfsordner liegt was Heißes: eine interne Meldung, nie abgeschickt. Jonas wollte ‚Chargenabgänge ohne Empfängernachweis‘ melden – Verdacht auf Abzweigung an einen ‚Drittmittelpartner (M-Stiftung)‘. Schick dir den Scan.", anhang: { titel: "Scan: Compliance-Entwurf (J. Brandt)" } },
        { clue: "c1_akte" },
        { tu: (api) => api.frageWeg("f1_was_wusste_jonas") },
        { gedanke: "M-Stiftung. Morgenstern. Auf deren Schildern steht ‚Zukunft‘. Auf Jonas' Entwurf stand offenbar zu viel Gegenwart." },
      ],
    },

    f1_selene_bericht: {
      chat: "selene",
      schritte: [
        { von: "selene", text: "Marek hier, Rechtsmedizin. Ihr Werwolfopfer ist faszinierend – und zwar im Sinne von: Ihr Werwolf war keiner." },
        { von: "selene", text: "Erstens: Todeszeit zwischen 21:00 und 21:30 Uhr, da bin ich sicher – Leichenstarre, Temperatur, Mageninhalt, alles singt im Chor." },
        { clue: "c1_todeszeit" },
        { von: "selene", text: "Zweitens: Die Krallenwunden zeigen keinerlei vitale Reaktion. Keine Blutung, keine Ödeme. Die wurden gesetzt, als Herr Brandt schon tot war. Jemand hat eine Leiche dekoriert.", anhang: { titel: "Vorläufiger Obduktionsbericht" } },
        { clue: "c1_wunde_postmortem" },
        { von: "selene", text: "Toxikologie läuft noch, das Labor braucht ein, zwei Tage. Wetten nehme ich trotzdem schon an: Ich tippe auf etwas Feines, Leises. Der Mann hat sich nicht gewehrt." },
        { gedanke: "Tot um Viertel nach neun. Zerkratzt nach Mitternacht. Irgendwer wollte, dass ich einen Wolf jage statt eines Menschen." },
      ],
    },

    f1_selene_tox: {
      chat: "selene",
      schritte: [
        { von: "selene", text: "Toxikologie ist da. Halten Sie sich fest, ohne sich aufzuregen: Etorphin. Hochpotentes Betäubungsmittel, Veterinär- und Laborbereich, in der Dosis sicher tödlich. Im Kaffee verabreicht, würde ich sagen – der Mageninhalt passt zum Becher vom Fundort." },
        { clue: "c1_etorphin" },
        { von: "selene", text: "Etorphin kriegt man nicht an der Tankstelle. Lizenzierte Bezugsstellen sind in der Datenbank gelistet, falls Sie suchen mögen. Und: Grüßen Sie den Werwolf von mir, falls Sie ihn doch noch finden – er müsste der erste sein, der sein Opfer fachgerecht prämediziert." },
        { gedanke: "Gift im Kaffee um neun. Krallen um Mitternacht. Der Mörder hatte einen Plan – und der Plan hatte ein Kostüm." },
      ],
    },

    f1_pix_intro: {
      chat: "pix",
      schritte: [
        { von: "pix", text: "Psst. Ja, du. Der mit dem toten Blutbank-Boten. Ganz Aschenfurt redet, und wo geredet wird, verdiene ich mit." },
        { von: "pix", text: "Pix mein Name, Information mein Geschäft. Wenn du wissen willst, was der Park nicht erzählt: Der Basar hat Ohren. Komm vorbei – unter dem alten Schlachthof, frag nach niemandem, geh einfach durch die dritte Tür." },
        { wahl: [
          { label: "Woher weißt du, dass ich ermittle?", antwort: [{ von: "pix", text: "Schätzchen, ich wusste es, bevor du zugesagt hast. Komm vorbei, dann reden wir über Dinge, die du noch nicht weißt. Das ist der interessantere Teil." }], tu: (api) => api.flag("basar_zugang") },
          { label: "Ich komme. Aber ich zahle nur für Brauchbares.", tu: (api) => { api.flag("basar_zugang"); api.npc("pix", { respekt: 5 }); }, antwort: [{ von: "pix", text: "Brauchbar ist mein zweiter Vorname. Der erste ist unaussprechlich. Bis gleich." }] },
          { label: "Ich verhandle nicht mit Schwarzmarkthändlern.", kodexFuer: ["gesetz"], tu: (api) => { api.flag("basar_zugang"); api.npc("pix", { vertrauen: -10 }); }, antwort: [{ von: "pix", text: "Ts. Alle sagen sie das. Und alle stehen sie früher oder später vor meiner Tür. Die Adresse hast du ja jetzt. 😏" }] },
        ] },
      ],
    },

    f1_pix_handel: {
      chat: "pix",
      schritte: [
        { von: "pix", text: "So, Geschäft. Du suchst ein Krallen-Spielzeug, ich hab da was gehört. Aber Information ist Ware, und Ware hat 'nen Preis. Such dir was aus:" },
        { wahl: [
          { label: "Ich zahle bar. Sag deinen Preis.", tu: (api) => { api.clue("c1_handschuh"); api.npc("pix", { vertrauen: 5 }); api.log("Pix' Information bar bezahlt: Fenris-Handschuh-Verkauf an eine Frau mit Laborhandschuhen."); }, antwort: [
            { von: "pix", text: "Bar ist Kultur. Also: Vor zwei Wochen ging hier ein Fenris-Handschuh über den Tisch. Käuferin: Frau, schlank, dunkler Mantel, sehr ruhig – und sie trug Laborhandschuhe bei der Übergabe. Bezahlt mit fabrikneuen Scheinen, fortlaufende Nummern. Bankfrisch." },
            { von: "pix", text: "Mehr hab ich nicht. Aber unter uns: Leute, die beim Artefaktkauf an Hygiene denken, planen keine Hochzeit." } ] },
          { label: "Ich schulde dir einen Gefallen. Einen echten.", tu: (api) => { api.clue("c1_handschuh"); api.flag("pix_gefallen_offen"); api.npc("pix", { vertrauen: 12 }); api.erinnert("pix", "Du stehst bei Pix im Wort – ein offener Gefallen."); api.log("Pix' Information gegen einen offenen Gefallen eingetauscht."); }, antwort: [
            { von: "pix", text: "Ohh, ein Gefallen vom Dezernat. Das ist besser als Gold, das ist Zins. Abgemacht." },
            { von: "pix", text: "Fenris-Handschuh, verkauft vor zwei Wochen. Käuferin: Frau, ruhig wie ein Operationssaal, Laborhandschuhe, neue Scheine. Falls du mal eine Laborratte suchst, die einkaufen war: bitte sehr." } ] },
          { label: "[Druck] Du sagst es mir sofort, oder das Dezernat nimmt den Basar auseinander.", kodexGegen: ["zweite_chance"], tu: (api) => { api.npc("pix", { vertrauen: -15, angst: 10 }); api.ruf("unterwelt", -10); api.erinnert("pix", "Du hast Pix mit einer Razzia gedroht."); }, antwort: [
            { von: "pix", text: "Oha. Muskeln. Weißt du, was der Basar mit Drohungen macht? Er wird still. Ganz, ganz still." },
            { von: "pix", text: "Heute kriegst du gar nichts, Schätzchen. Komm wieder, wenn du Manieren gefunden hast – oder Geld." },
            { system: "Pix gibt dir die Information (noch) nicht. Du kannst später zurückkommen und zahlen – oder einen Gefallen anbieten." } ] },
        ] },
      ],
    },

    f1_bruno_lena: {
      chat: "bruno",
      schritte: [
        { von: "bruno", text: "Hier ist Bruno Falk. Runa sagt, du wärst vielleicht keiner von den ganz Schlimmen. Ich… ich muss dir was sagen. Aber nicht am Telefon, nicht aufm Revier." },
        { von: "bruno", text: "Samstagabend. Ich war nicht allein laufen. Ich war bei jemandem. Bis zehn. Aber wenn das rauskommt, verlier ich mehr als meine Freiheit." },
        { wahl: [
          { label: "Was du mir sagst, bleibt unter uns, bis es nicht mehr anders geht. Versprochen.", kodexGegen: ["gesetz"], kodexFuer: ["unschuldige", "zweite_chance"], tu: (api) => { api.clue("c1_lena"); api.flag("f1_lena_versprechen"); api.npc("bruno", { vertrauen: 25 }); api.erinnert("bruno", "Du hast versprochen, sein Geheimnis zu schützen."); api.ruf("werwoelfe", 5); api.frageWeg("f1_bruno_alibi"); api.log("Bruno hat dir sein Alibi anvertraut: Er war bei Lena Hartwig – das Rudel darf es nicht erfahren."); }, antwort: [
            { von: "bruno", text: "Ihr Name ist Lena. Lena Hartwig. Ein Mensch. Wir sind… zusammen, seit einem Jahr. Das Rudel verbietet das. Wenn Runa das erfährt, bin ich raus. Für immer." },
            { von: "bruno", text: "Ich war bis 22:00 Uhr bei ihr. Sie kann's bestätigen. Aber bitte – frag sie leise. Sie hat mit alldem nichts zu tun." } ] },
          { label: "Ich kann dir nichts versprechen. Aber ich verspreche, fair zu bleiben.", tu: (api) => { api.clue("c1_lena"); api.npc("bruno", { vertrauen: 10 }); api.frageWeg("f1_bruno_alibi"); api.log("Bruno hat sein Alibi offenbart: Er war bei Lena Hartwig."); }, antwort: [
            { von: "bruno", text: "…Fair. Okay. Mehr verlangt ja keiner." },
            { von: "bruno", text: "Lena Hartwig. Ein Mensch. Ich war bei ihr, bis zehn. Das Rudel weiß nichts davon, und wenn's nach mir geht, bleibt das so. Mach damit, was du machen musst. Aber mach's vorsichtig." } ] },
          { label: "[Druck] Sag mir sofort, wo du warst, oder ich hole dich offiziell ab.", kodexGegen: ["unschuldige", "zweite_chance"], tu: (api) => { api.npc("bruno", { vertrauen: -20, angst: 15 }); api.erinnert("bruno", "Du hast ihn bedroht, als er sich dir öffnen wollte."); }, antwort: [
            { von: "bruno", text: "…Weißt du was? Vergiss es. Vergiss, dass ich geschrieben hab." },
            { system: "Bruno bricht den Kontakt ab. Sein Alibi bleibt vorerst im Dunkeln – vielleicht erreichst du es über Runa oder Lena selbst." } ] },
        ] },
      ],
    },

    f1_lena_direkt: {
      chat: "bruno",
      schritte: [
        { system: "Eine unbekannte Nummer schreibt dir – über Brunos Chat-Kontakt verknüpft." },
        { von: "bruno", text: "(Lena Hartwig): Sie kennen mich nicht. Ich bin… eine Freundin von Bruno Falk. Er würde mich umbringen, wenn er wüsste, dass ich schreibe. Aber er würde eher ins Gefängnis gehen, als mich zu erwähnen, und das macht mir Angst." },
        { von: "bruno", text: "(Lena Hartwig): Bruno war Samstagabend bei mir. Bis 22:00 Uhr. Ich schwöre es, ich habe Fotos mit Zeitstempel vom Abendessen, falls es sein muss. Bitte. Er hat niemanden getötet – er bringt ja Spinnen einzeln nach draußen." },
        { clue: "c1_lena" },
        { tu: (api) => { api.frageWeg("f1_bruno_alibi"); api.log("Lena Hartwig hat sich selbst gemeldet und Brunos Alibi bestätigt."); } },
        { gedanke: "Ein Werwolf, der Spinnen rettet, und ein Mensch, der ihn deckt. Die Stadt ist voller Geheimnisse – die wenigsten davon sind Verbrechen." },
      ],
    },

    f1_ada_quelle: {
      chat: "ada",
      schritte: [
        { von: "ada", text: "Deine Basar-Spur mit dem Fenris-Handschuh – stark. Damit kriegen wir die Inszenierung wasserdicht. Eine Frage noch, und du weißt, dass ich sie stellen muss: Woher hast du das?" },
        { wahl: [
          { label: "Von einem Informanten im Basar. Name: Pix.", kodexFuer: ["gesetz"], tu: (api) => { api.flag("pix_verraten"); api.ruf("polizei", 8); api.npc("ada", { vertrauen: 5 }); api.log("Du hast Ada Pix' Namen genannt – die Quelle ist aktenkundig."); }, antwort: [
            { von: "ada", text: "Pix. Der Name ist hier nicht unbekannt. Gut – damit ist die Spur gerichtsfest dokumentiert. Ich vermerk's in der Akte." },
            { gedanke: "Aktenkundig. Im Basar gibt es für dieses Wort eine eigene Übersetzung: vogelfrei." } ] },
          { label: "Eine vertrauliche Quelle. Mehr sage ich nicht.", kodexGegen: ["gesetz"], tu: (api) => { api.ruf("polizei", -4); api.npc("ada", { vertrauen: -3 }); api.npc("pix", { vertrauen: 10 }); api.erinnert("pix", "Du hast Pix' Namen geschützt, als die Polizei fragte."); api.log("Du hast deine Quelle gegenüber Ada geschützt."); }, antwort: [
            { von: "ada", text: "Quellenschutz. Großartig. Weißt du, wie das vor Gericht heißt? ‚Vom Hörensagen.‘ Na schön – dann brauchen wir eben andere Beweise, die die Spur tragen. Mach mir die Arbeit nicht noch mal so schwer." } ] },
        ] },
      ],
    },

    f1_sasse_flucht_warnung: {
      chat: "ada",
      schritte: [
        { von: "ada", text: "Information für dich: Dr. Sasse hat heute Vormittag einen Anwalt eingeschaltet – und ihre Assistentin hat für Freitag einen Flug nach Lissabon angefragt. Einfache Strecke." },
        { von: "ada", text: "Ich kann sie ohne tragfähige Theorie nicht festsetzen. Wenn du sie für die Richtige hältst: Bau deinen Fall. Bald." },
        { tu: (api) => { api.timeline("Fr (geplant)", 9000, "Dr. Sasse: gebuchter Flug nach Lissabon (einfache Strecke).", "Hinweis Ada"); api.frage("f1_zeitdruck", "Dr. Sasse plant das Land zu verlassen – was hält sie hier noch?"); } },
      ],
    },

    f1_elias_gruss: {
      chat: "elias",
      schritte: [
        { von: "elias", text: "Man erzählt sich, du stehst über einem Toten mit Krallenspuren. Der Orden hat Augen, auch wenn er offiziell nur noch Stadtgeschichte betreibt." },
        { wenn: (H) => H.beruf("monsterjaeger") || H.geheimnis("jaegerorden"),
          dann: [
            { von: "elias", text: "Und man erzählt sich, der Ermittler sei ein alter Bekannter. Die Kammer hätte noch Silber für dich, falls der Wolf echt ist. Falls nicht – nun. Dann jagt diesmal jemand mit Krallen aus dem Katalog, und das wäre fast die schlimmere Sorte." },
          ],
          sonst: [
            { von: "elias", text: "Ein Rat von einem alten Mann, umsonst und damit verdächtig: Echte Wölfe reißen. Falsche Wölfe dekorieren. Lies die Wunden, nicht die Schlagzeilen." },
          ] },
        { wahl: [
          { label: "Danke für den Rat. Ich melde mich, wenn ich den Orden brauche.", tu: (api) => api.npc("elias", { respekt: 5 }), antwort: [{ von: "elias", text: "Das sagen alle. Die Klugen meinen es. Gott schütze dich – und falls nicht er, dann wenigstens gutes Schuhwerk." }] },
          { label: "Halt den Orden aus meinem Fall raus.", tu: (api) => { api.npc("elias", { respekt: -5 }); api.ruf("jaeger", -5); }, antwort: [{ von: "elias", text: "Wie du wünschst. Aber merk dir: Wir waren nie ‚raus‘, Junge. Wir sind nur leiser geworden." }] },
        ] },
      ],
    },
  },

  /* ---------------- Verhöre ---------------- */
  verhoere: {
    bruno: {
      name: "Bruno Falk", ort: "Vernehmungsraum 2, Dezernat 13",
      intro: "Bruno Falk füllt den Stuhl aus wie ein Kleiderschrank den Flur. Seine Hände liegen flach auf dem Tisch – jemand hat ihm mal gesagt, dass das harmloser wirkt. Es funktioniert nicht.",
      tonarten: ["freundlich", "empathisch", "sachlich", "druck"],
      druckLimit: 3,
      beiBlock: "Bruno schiebt den Stuhl zurück, ganz ruhig, was es schlimmer macht. „Ich kenn das Spiel. Der Wolf ist's gewesen, ne? Der Wolf ist's immer gewesen.“ Er sagt kein Wort mehr.",
      themen: [
        { id: "anzeige", label: "Die Anzeige von Jonas Brandt", worte: ["anzeige", "drohung", "streit", "brandt"],
          antworten: {
            sachlich: "„Er hat mich angezeigt, ja. Ich hab ihn angebrüllt, das stimmt auch. Er hat ständig am Reviersaum rumgeschnüffelt, nachts, mit Taschenlampe. Wir mögen das nicht.“ Er knetet die Knöchel. „Anbrüllen ist nicht töten.“",
            freundlich: "„Hören Sie… der Mann hat mich angezeigt, und ich war stinksauer. Aber wissen Sie, was er am Reviersaum gemacht hat? Fotos. Von unseren Höfen. Ich wollte wissen, für wen. Er hat nie geantwortet.“",
            empathisch: { text: "Er sieht zum ersten Mal hoch. „Sie fragen, wie's mir damit geht? …Beschissen. Der Typ ist tot, alle gucken mich an, und das Schlimmste: Ich hab ihn nicht mal gehasst. Ich wollte nur wissen, warum er uns fotografiert.“", tu: (api) => api.npc("bruno", { vertrauen: 8 }) },
            druck: "„Ja, ich hab den Zettel geschrieben! Ja, ich war wütend!“ Seine Stimme kippt ins Raue. „Und nein, ich hab ihn nicht angerührt. Schreiben Sie's auf, dann hab ich's auch amtlich gesagt.“",
          },
          tu: (api) => api.frage("f1_fotos", "Warum fotografierte Jonas die Höfe des Rudels?") },
        { id: "alibi", label: "Wo warst du Samstagabend?", worte: ["alibi", "samstag", "wo warst", "tatzeit"],
          antworten: {
            sachlich: "„Laufen. Allein. Vor der Kernnacht muss ich raus, sonst platz ich.“ Er sagt es zu schnell, wie auswendig gelernt. Sein Blick geht zur Wand.",
            freundlich: "„Laufen, allein, wie immer vor der Kernnacht.“ Er reibt sich den Nacken. Da ist etwas, das er nicht sagt – aber es sieht nicht nach Mordversteck aus. Eher nach… Scham?",
            empathisch: { text: "„Laufen. Allein.“ Pause. Er sieht dich lange an, und in dem Blick ringt etwas. „…Sie sind anders als die anderen Bullen, hm? Vielleicht. Vielleicht erzähl ich Ihnen irgendwann mehr. Nicht hier. Nicht mit der Kamera da oben.“", tu: (api) => { api.flag("f1_bruno_zoegert"); api.npc("bruno", { vertrauen: 10 }); } },
            druck: { text: "„LAUFEN. ALLEIN.“ Der Tisch knirscht unter seinen Handflächen. „Und jetzt hören Sie auf zu bohren, da ist nichts.“ Da ist offensichtlich etwas. Aber so kommst du nicht ran.", tu: (api) => api.npc("bruno", { vertrauen: -8 }) },
          } },
        { id: "vollmond", label: "Die Vollmondnacht und das Mondgesetz", worte: ["vollmond", "mond", "verwandlung"],
          antworten: {
            sachlich: "„Kernnacht war Sonntag auf Montag. Samstag war Anlaufnacht – Mondaufgang war erst kurz vor elf. Vorher verwandelt sich keiner von uns, das geht physisch nicht. Steht in jedem Register. Fragen Sie Ihre eigene Datenbank.“",
            default: "„Samstag ging der Mond erst kurz vor elf auf. Vorher läuft bei uns gar nichts – kein Fell, keine Krallen, nichts. Wer auch immer Ihnen einen Wolf um neun verkaufen will, verkauft Ihnen Mist.“",
          },
          tu: (api) => api.frage("f1_mond_pruefen", "Stimmt Brunos Aussage zum Mondaufgang? (Datenbank: Mondphasen)") },
        { id: "rudel", label: "Das Rudel und die Reviergrenze", worte: ["rudel", "revier", "runa", "grenze"],
          antworten: {
            sachlich: "„Die Grenze ist uns heilig, kapiert das mal einer? Wir gehen nicht rüber, ihr kommt nicht rein, dafür gab's den Pakt. Die Leiche lag einen Schritt außerhalb. Einen Schritt! Wer's drauf anlegt, dass wir's waren, kennt die Grenze verdammt genau.“",
            druck: "„Lasst das Rudel da raus!“ Zum ersten Mal klingt er gefährlich. „Runa hat euch geduldet, weil sie an Recht und Ordnung glaubt. Strapazier das nicht.“",
            default: "„Wir halten die Grenze. Immer. Das ist kein Stolz, das ist Überleben.“",
          } },
      ],
      beweisReaktionen: {
        c1_drohbrief: { text: "Er erkennt den Zettel sofort, und die Ohren werden rot. „Ja. Meiner. Ich war wütend und dumm, in der Reihenfolge.“ Er schiebt ihn zurück, als würde er brennen. „Wenn ich jeden umbringen würde, dem ich so einen Zettel schreibe, wär die Heide leer.“", tu: (api) => api.npc("bruno", { angst: 5 }) },
        c1_silberkette: { text: "„Der trug Silber?“ Bruno beugt sich vor, plötzlich hellwach. „Dann fasst das mal an, na los – ich kann nicht mal den Beweisbeutel halten, ohne dass die Haut aufgeht. Und euer ‚Wolf‘ hat ihn zerfleischt, ohne die Kette zu berühren? Werdet mal wach.“" },
        c1_lena: { text: "Er wird bleich, dann rot, dann sehr leise. „…Wer hat Ihnen das gesagt?“ Er presst die Handballen gegen die Augen. „Bitte. Sie hat damit nichts zu tun. Wenn das Rudel davon erfährt, ist alles aus. Alles.“", tu: (api) => api.npc("bruno", { angst: 15, vertrauen: 5 }) },
      },
      widerspruchReaktionen: {
        i1_mondluege: { text: "„Na endlich!“ Er klatscht mit der flachen Hand auf den Tisch, fast erleichtert. „Tot um neun, Mond um Viertel vor elf. Sagen Sie's laut, sagen Sie's Ihrer Chefin, sagen Sie's der Zeitung: Es. War. Kein. Wolf.“" },
      },
      beweisStandard: "Bruno betrachtet es stumpf. „Papierkram. Ihr und euer Papierkram.“",
    },

    viktor: {
      name: "Viktor Calvera", ort: "Hämatek, Büro des Nachtmanagers",
      intro: "Viktor Calvera empfängt dich um 21 Uhr – ‚Tagsüber bin ich indisponiert, Sie verstehen.‘ Sein Büro ist fensterlos und makellos. Auf dem Schreibtisch: drei Stempel, ausgerichtet wie Soldaten.",
      tonarten: ["freundlich", "sachlich", "druck"],
      druckLimit: 2,
      beiBlock: "Calvera erhebt sich mit der Geduld von Jahrhunderten. „Ich habe Verträge überdauert, Kriege und vier Currywurstbuden vor diesem Gebäude. Ich überdauere auch Ihre Unhöflichkeit – aber nicht in diesem Gespräch.“ Er öffnet dir die Tür.",
      themen: [
        { id: "jonas", label: "Jonas Brandt und seine Meldung", worte: ["jonas", "brandt", "meldung", "compliance"],
          antworten: {
            sachlich: "„Ein gewissenhafter Mitarbeiter. Zu gewissenhaft für manche, vermute ich.“ Er faltet die Hände. „Er bat mich vor einer Woche um ein Gespräch ‚über die Forschungs-Chargen‘. Ich verwies ihn an die Compliance – das ist der Dienstweg. Der Termin kam nie zustande.“",
            freundlich: { text: "„Sie sind höflich. Das ist heutzutage selten genug, dass ich es belohne.“ Er senkt die Stimme. „Jonas zählte nach. Die Drittmittel-Chargen für die Morgenstern-Stiftung – die Zahlen gingen nicht auf, sagte er. Ich habe es selbst nie geprüft. Das Labor zeichnet ab, nicht ich. Frau Dr. Sasse zeichnet ab.“", tu: (api) => api.frage("f1_chargen", "Wohin gehen die ‚Forschungs‘-Chargen von Hämatek?") },
            druck: "„Drohen Sie einem Konvent-Bürgen, in seinem eigenen Haus?“ Die Temperatur im Raum scheint zu fallen. „Stellen Sie Fragen oder gehen Sie.“",
          } },
        { id: "alibi", label: "Wo waren Sie Samstagabend?", worte: ["alibi", "samstag", "konzil", "sitzung"],
          antworten: {
            sachlich: "„In einer Sitzung des Konvents, von Sonnenuntergang bis weit nach Mitternacht. Inhalte sind versiegelt, Anwesenheit bezeugbar – durch Personen, deren Wort vor jedem Gericht der Nacht gilt. Vor Ihrem leider nicht, ich weiß.“",
            freundlich: "„Konvent-Sitzung, die ganze Nacht. Ich kann Ihnen die Anwesenheit durch den Gesandten Adler bestätigen lassen, wenn Sie diskret damit umgehen. Der Konvent schätzt es nicht, in Mordakten aufzutauchen – auch nicht als Alibi.“",
            druck: "„Mein Aufenthaltsort untersteht dem Konvent. Beantragen Sie es formell und warten Sie die üblichen vierzig Jahre.“",
          },
          tu: (api) => api.flag("f1_viktor_alibi_genannt") },
        { id: "biss", label: "Könnte ein Vampir die Wunden verursacht haben?", worte: ["biss", "vampir", "wunden", "blut"],
          antworten: {
            default: "Er lacht trocken, ein Geräusch wie Pergament. „Haben Sie die Leiche gesehen? Krallen. Wir sind Ästheten, kein Mähdrescher. Und kein Vampir lässt vier Liter Blut im Gras liegen – das wäre, verzeihen Sie, Verschwendung.“",
          } },
        { id: "sasse", label: "Was halten Sie von Dr. Sasse?", worte: ["sasse", "elif", "labor"],
          antworten: {
            sachlich: "„Korrekt bis zur Schmerzgrenze. Erste im Labor, Letzte draußen. Wobei…“ Er hält inne, abwägend. „In letzter Zeit war sie oft die Letzte. Sehr oft. Ich nahm an: Ehrgeiz. Vielleicht war es Buchhaltung.“",
            default: "„Eine exzellente Wissenschaftlerin. Mehr fällt mir nicht ein, und das ist vielleicht selbst ein Befund.“",
          } },
      ],
      beweisReaktionen: {
        c1_akte: { text: "Er liest Jonas' Entwurf zweimal, sehr still. „‚Abzweigung an Drittmittelpartner.‘ In meinem Haus.“ Etwas Altes und Kaltes huscht über sein Gesicht. „Der Konvent bezahlt für jede dieser Konserven. Wenn jemand sie weiterverkauft hat, wurde nicht nur Ihr Opfer betrogen.“ Er greift zum Telefon. „Sie bekommen die Zugangslogs und die Bestandslisten. Jetzt sofort. Dienstweg ist für Lebende.“", tu: (api) => { api.clue("c1_dienstplan"); api.clue("c1_etorphin_quelle"); api.ruf("vampire", 8); api.log("Viktor Calvera hat dir Zugangslogs und Bestandslisten geöffnet."); } },
        c1_etorphin: { text: "„Etorphin?“ Er spricht das Wort aus wie eine Beleidigung. „Das führt bei uns nur das Labor. Giftschrank, Doppelschloss, Signaturpflicht. Zwei Schlüssel existieren: einer im Safe der Geschäftsführung. Der andere…“ Er sieht dich an. „…hängt am Bund von Frau Dr. Sasse.“" },
      },
      widerspruchReaktionen: {
        i1_mondluege: { text: "„Tod vor Mondaufgang.“ Er nickt langsam, beinahe anerkennend. „Dann suchen Sie kein Tier, sondern einen Verstand. Mein Beileid – Tiere sind die angenehmeren Gegner.“" },
      },
      beweisStandard: "Calvera wirft einen Blick darauf und schiebt es mit einem Finger zurück. „Interessant. Irrelevant. Suchen Sie weiter.“",
    },

    sasse: {
      name: "Dr. Elif Sasse", ort: "Hämatek, Laborbüro",
      intro: "Dr. Sasse bittet dich herein, räumt einen Stuhl frei, bietet Kaffee an. Du lehnst ab. Irgendetwas in dir lehnt sehr entschieden ab. Sie lächelt verbindlich und wartet auf deine Fragen, die Hände ruhig im Schoß.",
      tonarten: ["freundlich", "sachlich", "druck"],
      druckLimit: 3,
      beiBlock: "Das Lächeln bleibt, aber dahinter klappt etwas zu. „Ich glaube, ab hier sollte mein Anwalt dabei sein. Sie verstehen – man hört ja, wie schnell man heutzutage in etwas hineingezogen wird.“ Sie öffnet dir die Tür. Höflich. Endgültig.",
      themen: [
        { id: "jonas", label: "Ihr Eindruck von Jonas Brandt", worte: ["jonas", "brandt", "kollege"],
          antworten: {
            sachlich: "„Zuverlässig, freundlich, still.“ Sie senkt den Blick im exakt richtigen Moment. „Er hatte in letzter Zeit Angst, wissen Sie. Dieser Werwolf, der ihn bedroht hat – Falk? Jonas hat mir den Zettel gezeigt. Ich habe ihm gesagt, er soll zur Polizei gehen. Hätte ich mehr getan…“",
            freundlich: "„Wir waren keine engen Freunde, aber man arbeitet jahrelang Tür an Tür…“ Sie reibt die Daumen aneinander. „Er hatte zuletzt Angst vor diesem Falk. Das Rudel, die Drohungen. Ich mache mir Vorwürfe, dass ich ihn nie begleitet habe, abends.“",
            druck: "„Ich verbitte mir den Ton. Ich habe einen Kollegen verloren.“ Die Stimme bleibt glatt. Zu glatt – wie ein See, unter dem etwas schwimmt.",
          } },
        { id: "samstag", label: "Wo waren Sie Samstagabend?", worte: ["samstag", "alibi", "abend"],
          antworten: {
            sachlich: "„Zu Hause. Allein. Ich habe gelesen und früh geschlafen – das Wochenende davor war lang.“ Sie sagt es flüssig, ohne Pause, ohne Nachdenken. Menschen, die sich wirklich erinnern müssen, zögern irgendwo.",
            freundlich: "„Zu Hause, allein, mit einem Buch. Nicht sehr glamourös, ich weiß.“ Ein kleines Lachen, exakt dosiert.",
            druck: { text: "„Zu Hause. Allein. Möchten Sie meine Leseliste?“ Zum ersten Mal ein Hauch Schärfe. Notiert.", tu: (api) => api.npc("sasse", { angst: 5 }) },
          },
          tu: (api) => api.flag("f1_sasse_alibi_genannt") },
        { id: "labor", label: "Etorphin-Bestände im Labor", braucht: "c1_etorphin", worte: ["etorphin", "gift", "bestand", "giftschrank"],
          antworten: {
            sachlich: { text: "„Etorphin? Im Blut von Jonas?“ Die Augenbrauen heben sich um exakt die richtigen Millimeter. „Unsere Bestände sind vollständig, ich habe die Liste erst letzte Woche gegengezeichnet. Kein Gramm fehlt. Sie können das gern prüfen lassen – über die Geschäftsführung, der Dienstweg, Sie verstehen.“", tu: (api) => api.flag("f1_sasse_bestand_luege") },
            druck: { text: "„Wollen Sie andeuten, mein Labor sei undicht? Die Bestände stimmen. Punkt.“ Ihre Finger liegen still. Zu still – als hielte sie sie bewusst fest.", tu: (api) => { api.flag("f1_sasse_bestand_luege"); api.npc("sasse", { angst: 8 }); } },
            default: "„Unsere Bestände sind dokumentiert und vollständig.“",
          } },
        { id: "haare", label: "Die Wolfshaare am Opfer", worte: ["haare", "wolf", "fell"],
          antworten: {
            sachlich: "„Ich habe davon gehört. Wissen Sie…“ Sie zögert kunstvoll. „Wir führen Vergleichsproben übernatürlicher Marker im Labor – auch Fellproben der registrierten Rudel. Ich könnte einen Abgleich anbieten. Wenn die Haare zur Aschenheide passen, hätten Sie Ihre Antwort, nicht wahr?“ Hilfsbereit. Sehr hilfsbereit.",
            default: "„Ein Abgleich mit den registrierten Rudelproben wäre möglich. Ich helfe gern.“",
          },
          tu: (api) => api.frage("f1_zu_hilfsbereit", "Warum drängt Dr. Sasse so auf den Rudel-Abgleich?") },
        { id: "chargen", label: "Die Forschungs-Chargen für die M-Stiftung", braucht: "c1_akte", worte: ["chargen", "morgenstern", "stiftung", "abzweigung", "forschung"],
          antworten: {
            sachlich: { text: "Eine Mikropause. Wer nicht darauf achtet, verpasst sie. „Das Drittmittelprogramm ist vertraglich geregelt und auditiert. Jonas hat das… missverstanden. Logistiker sehen Zahlen, keine Zusammenhänge.“ Sie lächelt wieder. Das Lächeln erreicht die Augen nicht mehr ganz.", tu: (api) => api.npc("sasse", { angst: 10 }) },
            druck: { text: "„Diese Unterstellung ist absurd, und sie ist gefährlich – für Sie.“ Einen Atemzug später hat sie sich wieder. „Verzeihung. Es ist… eine schwere Woche.“ Der Riss war kurz. Aber du hast ihn gesehen.", tu: (api) => api.npc("sasse", { angst: 15 }) },
            default: "„Das Programm ist auditiert. Mehr kann ich dazu nicht sagen.“",
          } },
      ],
      beweisReaktionen: {
        c1_etorphin_quelle: { text: (H) => H.flag("f1_sasse_bestand_luege")
            ? "Du legst die Bestandsliste mit der Fehlmenge neben ihre Aussage: ‚Kein Gramm fehlt.‘ Sie sieht lange darauf. „Dann hat jemand die Liste manipuliert“, sagt sie schließlich. Ruhig. Aber die Daumen reiben jetzt wieder aneinander, schneller als vorhin. „Ich möchte ab jetzt einen Anwalt hinzuziehen.“"
            : "Sie betrachtet die Fehlmenge in der Liste, die sie selbst als vollständig gegengezeichnet hat. „Inventurfehler kommen vor.“ Bei 4 ml Etorphin. In der Woche eines Etorphin-Mordes. Sie weiß, wie das klingt – du siehst es ihr an.",
          tu: (api) => { api.npc("sasse", { angst: 15 }); api.flag("f1_sasse_konfrontiert"); } },
        c1_handschuh: { text: "„Ein… was? Krallen-Handschuh?“ Sie lacht, einen halben Ton zu hoch. „Und das soll ich gewesen sein, weil die Käuferin Laborhandschuhe trug? Wissen Sie, wie viele Labore diese Stadt hat?“ Du hast nicht gesagt, dass die Käuferin aus einem Labor kam. Nur, dass sie Handschuhe trug.", tu: (api) => { api.npc("sasse", { angst: 12 }); api.flag("f1_sasse_verplappert"); api.log("Sasse hat sich verplappert: Sie wusste Details über die Käuferin, die du nie genannt hast."); } },
        c1_dienstplan: { text: "„Systemfehler. Die Software ist alt, Buchungen verschwinden ständig.“ – „Gelöscht am Sonntagmorgen um 07:50 Uhr, mit Ihrer Kennung“, sagst du. Sie antwortet nicht sofort. Das ist die längste Pause dieses Gesprächs. „…Mein Anwalt wird sich melden.“", tu: (api) => { api.npc("sasse", { angst: 15 }); api.flag("f1_sasse_konfrontiert"); } },
      },
      widerspruchReaktionen: {
        i1_mondluege: { text: "„Vor Mondaufgang nicht möglich? Das… wusste ich nicht.“ Doch. Das wusste sie. Jeder bei Hämatek kennt die Mondtabellen – sie hängen im Flur, gleich neben dem Dienstplan. Du hast sie dort selbst gesehen.", tu: (api) => api.npc("sasse", { angst: 10 }) },
        i1_sasse_basar: { text: "Du beschreibst die Frau aus dem Basar und die Gestalt vom Parkrand und legst beide Beschreibungen nebeneinander auf ihren Schreibtisch. Sie sieht nicht hin. Sie sieht dich an, und zum ersten Mal ist da gar nichts mehr im Gesicht – kein Lächeln, keine Trauer, nichts. „Sie haben keine Ahnung, in was Sie da hineinstochern“, sagt sie sehr leise. „Gehen Sie nach Hause.“", tu: (api) => { api.npc("sasse", { angst: 20 }); api.flag("f1_sasse_maske_gefallen"); api.log("Sasses Maske ist gefallen – sie hat dich gewarnt, nicht geleugnet."); } },
      },
      beweisStandard: "Sie betrachtet es höflich interessiert, wie ein Urlaubsfoto. „Faszinierend. Was bedeutet es?“",
    },
  },

  /* ---------------- Storylets (Drama-Layer) ---------------- */
  storylets: [
    { id: "f1_david_kontakt", wenn: (H) => H.kapitelAlter() >= 1, dann: (api) => Engine.spieleSequenz("f1_david_start") },
    { id: "f1_selene_meldet", wenn: (H) => H.flag("ort_betreten_park") && H.flagAlter("ort_betreten_park") >= 2, dann: (api) => Engine.spieleSequenz("f1_selene_bericht") },
    { id: "f1_selene_tox_st", wenn: (H) => H.flag("storylet_f1_selene_meldet") && H.flagAlter("storylet_f1_selene_meldet") >= 6, dann: (api) => Engine.spieleSequenz("f1_selene_tox") },
    { id: "f1_pix_meldet", wenn: (H) => H.kapitelAlter() >= 4 && !H.beruf("exkrimineller"), dann: (api) => Engine.spieleSequenz("f1_pix_intro") },
    { id: "f1_pix_meldet_exkrim", wenn: (H) => H.kapitelAlter() >= 2 && H.beruf("exkrimineller"), dann: (api) => {
        api.nachricht("pix", "pix", "Sieh an, sieh an. Du. Auf der RICHTIGEN Seite vom Flatterband diesmal. Die alten Türen unten stehen dir noch offen – komm vorbei, Schätzchen, der Basar vergisst seine Leute nicht.");
        api.flag("basar_zugang");
      } },
    { id: "f1_pix_handel_st", wenn: (H) => H.flag("f1_pix_getroffen") && H.flag("f1_artefakt"), dann: (api) => Engine.spieleSequenz("f1_pix_handel") },
    { id: "f1_pix_handel_direkt", wenn: (H) => H.flag("f1_pix_getroffen") && (H.hat("c1_wunde_postmortem") || H.insight("i1_inszenierung")) && !H.flag("storylet_f1_pix_handel_st"), dann: (api) => Engine.spieleSequenz("f1_pix_handel") },
    { id: "f1_laptop_st", wenn: (H) => H.flag("f1_laptop_angefordert") && H.flagAlter("f1_laptop_angefordert") >= 4, dann: (api) => Engine.spieleSequenz("f1_laptop_hilfe") },
    { id: "f1_bruno_meldet", wenn: (H) => (H.flag("f1_bruno_zoegert") && H.npc("bruno", "vertrauen") >= 35) || (H.flag("f1_runa_getroffen") && H.npc("bruno", "vertrauen") >= 45), dann: (api) => Engine.spieleSequenz("f1_bruno_lena") },
    { id: "f1_lena_selbst", wenn: (H) => !H.hat("c1_lena") && H.flag("verhoer_bruno_gefragt") && H.flagAlter("verhoer_bruno_gefragt") >= 8 && !H.npc("bruno", "blockiert"), dann: (api) => Engine.spieleSequenz("f1_lena_direkt") },
    { id: "f1_ada_quelle_st", wenn: (H) => H.hat("c1_handschuh") && H.flagAlter("clue_c1_handschuh") !== -1, dann: (api) => Engine.spieleSequenz("f1_ada_quelle") },
    { id: "f1_sasse_flucht", wenn: (H) => (H.flag("f1_sasse_konfrontiert") || H.flag("f1_sasse_verplappert") || H.flag("f1_sasse_maske_gefallen")) && H.flagAlter("f1_sasse_konfrontiert") >= 3, dann: (api) => Engine.spieleSequenz("f1_sasse_flucht_warnung") },
    { id: "f1_elias_st", wenn: (H) => H.kapitelAlter() >= 8, dann: (api) => Engine.spieleSequenz("f1_elias_gruss") },
    { id: "f1_geheimnis_blut", wenn: (H) => H.geheimnis("magisches_blut") && H.flag("ort_betreten_basar"), dann: (api) => {
        api.nachricht("pix", "system", "Beim Verlassen des Basars bleibt eine alte Händlerin stehen und sieht dich an – zu lange. „Komisches Blut läuft durch die Stadt heutzutage“, murmelt sie. „Deins zum Beispiel. Pass auf, dass es keiner abfüllt, Kindchen.“ Dann ist sie weg.");
        api.log("Eine Händlerin im Basar hat etwas in deinem Blut ‚gewittert‘.");
      } },
    { id: "f1_geheimnis_vampir", wenn: (H) => H.geheimnis("vampirschuld") && H.flag("f1_viktor_alibi_genannt"), dann: (api) => {
        api.nachricht("lucian", "lucian", "Verzeihen Sie die Störung zu später Stunde. Lucian Adler, Gesandter des Konvents. Sie haben mit Herrn Calvera gesprochen – korrekt und höflich, wie man mir berichtet. Das honoriert der Konvent.");
        api.nachricht("lucian", "lucian", "Und… eine persönliche Bemerkung: Es gibt in unseren Annalen eine alte Notiz über eine Lebensschuld. Ihr Name steht darin. Die Nacht vergisst nicht – aber sie ist auch nicht undankbar. Vielleicht sprechen wir eines Tages darüber.");
        api.log("Lucian Adler hat deine alte Blutschuld erwähnt – der Konvent kennt sie.");
      } },
  ],

  /* ---------------- Hinweise (5 Stufen, spoilerfrei eskalierend) ---------------- */
  hinweise(H) {
    return [
      "Bleib bei der Leiche, bevor du beim Verdächtigen bleibst: Was würde ein ECHTER Werwolfangriff hinterlassen – und was davon fehlt hier? Das Regelbuch (Wundbild, Silber, Mondgesetz) ist dein Werkzeug.",
      "Zwei Uhrzeiten vertragen sich nicht: die aus der Rechtsmedizin und die vom Himmel. Sprich mit Dr. Marek und durchsuche die Datenbank nach „Mond“. Verbinde beides auf der Beweiswand.",
      "Frag dich, wer alle drei Dinge hat: Zugang zu Etorphin, Zugang zu Wolfshaar-Proben – und einen Grund, Jonas' Meldung zu fürchten. Der Laptop des Opfers und die Hämatek-Logs führen dorthin. Und der Basar weiß, wer Krallen kauft.",
      "Der zentrale Widerspruch: Jonas starb 21:00–21:30, der Mond ging erst 22:41 auf – kein Werwolf kann es in Wolfsform gewesen sein. Die Krallenwunden entstanden nach dem Tod. Es ist eine Inszenierung, und sie zeigt mit dem Finger aufs Rudel.",
      "Die Lösung: Dr. Elif Sasse vergiftete Jonas mit Etorphin aus dem eigenen Labor (Treffen „E.“, 21:00, Park) und inszenierte den Wolfsangriff mit Fenris-Handschuh und Konserven-Haaren – um Jonas' Meldung über die Blut-Abzweigung an die Morgenstern-Stiftung zu verhindern. Für eine saubere Anklage: Mond-Widerspruch, Post-mortem-Wunden, Etorphin-Quelle, Basar-Spur und das Motiv (Compliance-Entwurf + Zugangslog).",
    ];
  },

  /* ---------------- Theorie ---------------- */
  theorie: {
    frage: "Wer hat Jonas Brandt getötet – und kannst du es beweisen?",
    taeterOptionen: [
      { id: "bruno", label: "Bruno Falk (Werwolf)" },
      { id: "viktor", label: "Viktor Calvera (Vampir)" },

          clues: ["c2_kamera", "c2_tuer"],
