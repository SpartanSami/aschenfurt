  sequenzen: {
    f3_intro: {
      chat: "ada",
      schritte: [
        { von: "ada", text: "Schlechte Nachrichten in Serie: Henrike Stein ist tot. DIE Henrike Stein – Älteste des Zirkels, Mitarchitektin des Pakts. Gefunden in der Weidenbibliothek, mitten in einem Beschwörungskreis." },
        { von: "ada", text: "Die Boulevardblätter titeln schon ‚DÄMONEN-MORD‘, das Rathaus will einen Exorzisten einfliegen – einen EXORZISTEN, ich könnte schreien. Und der Zirkel? Der Zirkel ist still. Diese Stille gefällt mir am wenigsten." },
        { wenn: (H) => H.flag("f2_story_veroeffentlicht"),
          dann: [ { von: "ada", text: "Und das alles drei Wochen nach Carlas CHIMÄRA-Titelseite. Wenn du an Zufälle glaubst, hast du den falschen Beruf. Pass auf dich auf da draußen – wir treten inzwischen sehr großen Leuten auf sehr empfindliche Füße." } ],
          sonst: [ { von: "ada", text: "Und noch was, unter uns: Mir gefällt die Häufung nicht. Blutbank, Journalistin, jetzt der Zirkel. Entweder hat die Stadt eine Pechsträhne – oder jemand arbeitet eine Liste ab." } ] },
        { wahl: [
          { label: "Ich fahre zur Bibliothek. Kein Exorzist betritt den Tatort vor mir.", antwort: [{ von: "ada", text: "So will ich das hören. Der Tatort ist gesichert, Frau Olm – die Bibliothekarin – ist ansprechbar. Sie ist die einzige Zeugin. Und sie erzählt eine Geschichte, die… na, hör sie dir selbst an. Zweimal. Du wirst verstehen, was ich meine." }] },
          { label: "Was sagt der Zirkel selbst dazu?", antwort: [{ von: "ada", text: "Offiziell: Trauer und ‚volles Vertrauen in die Ermittlungen‘. Inoffiziell hat Mira Vogel nach DIR gefragt. Namentlich. Die Hexen wollen dich am Tatort, nicht irgendeinen Beamten mit Weihwasser im Handschuhfach. Mach was draus." }] },
        ] },
        { gedanke: "Eine Hexe, die angeblich an ihrem eigenen Ritual starb. In einer Stadt, in der zuletzt nichts das war, wonach es aussah. Warum sollte ausgerechnet das hier echt sein?" },
      ],
    },

    f3_selene3: {
      chat: "selene",
      schritte: [
        { von: "selene", text: "Marek. Ihr ‚Dämonenopfer‘ liegt vor mir, und ich sage Ihnen was: Wenn das ein Dämon war, hat er an einer Eliteakademie für Nahkampf graduiert." },
        { von: "selene", text: "C2-Fraktur. Ein einziger Griff, perfekt angesetzt, Drehbruch gegen die Halsachse. Keine Abwehrverletzungen – sie hat ihn nicht mal kommen hören. Kein Sturz, keine Verbrennungen, keine ‚magische Einwirkung‘, was immer das in meinen Formularen heißen soll.", anhang: { titel: "Obduktionsbericht H. Stein" } },
        { clue: "c3_genick" },
        { von: "selene", text: "Ich habe so eine Fraktur exakt zweimal gesehen, beide Male Altfälle aus den Neunzigern, beide Male stand am Ende ein Wort in der Akte, das ich nie vergessen habe: ‚Ordenstechnik‘. Machen Sie damit, was Sie müssen. Und seien Sie vorsichtig – wer SO tötet, tötet nicht zum ersten Mal." },
        { gedanke: "Ein Profi bricht ein Genick und malt danach einen Dämonenkreis. Er versteckt den Mord nicht – er verkleidet ihn. Die Frage ist: Für welches Publikum?" },
      ],
    },

    f3_mira_gutachten: {
      chat: "mira",
      schritte: [
        { von: "mira", text: "Ich habe den Kreis geprüft, wie du wolltest. Und jetzt halte dich fest, denn ich bin gleichzeitig erleichtert und wütender als je zuvor in meinem Leben." },
        { von: "mira", text: "Der Kreis ist FALSCH. Offen an zwei Stellen, Fantasie-Runen, keine Brandzeichen, nichts. Henrike hat dieses Ding nie gezogen – das hätte ihre Hand gar nicht fertiggebracht, das wäre wie ein Konzertpianist, der absichtlich daneben greift. Jemand hat unsere Älteste ermordet und ihr dann DAS als Grabstein hingemalt. Eine Beleidigung. Eine kalkulierte Beleidigung.", anhang: { titel: "Gutachten: Ritualkreis Weidenbibliothek" } },
        { clue: "c3_kreis_falsch" },
        { von: "mira", text: "Und noch etwas, das du wissen musst: Frau Olms Aussage. ‚Henrike zog den Kreis selbst.‘ Das ist unmöglich – und Frau Olm lügt nicht. Beides zugleich geht nur, wenn… prüf ihre Erinnerung, Detektiv. Prüf, ob sie noch ihre eigene ist. Das Regelbuch sagt dir, woran man es erkennt – und wonach du suchen musst: einem Anker." },
        { tu: (api) => api.frage("f3_olm_anker", "Trägt Frau Olm ein Ankerobjekt? (Regelbuch: Erinnerungsfälschung)") },
      ],
    },

    f3_brosche_hinweis: {
      chat: "mira",
      schritte: [
        { von: "mira", text: "Du suchst noch nach dem Anker? Denk praktisch: Er muss NAH an ihr sein, dauerhaft, unauffällig. Schmuck ist der Klassiker – etwas, das sie plötzlich trägt und nicht mehr ablegt. Sieh dir an, was Frau Olm am Kragen hat. Und frag sie, von wem es ist. Wenn sie es nicht mehr weiß: Da ist dein Anker." },
        { clue: "c3_brosche" },
      ],
    },

    f3_raub: {
      chat: "ada",
      schritte: [
        { von: "ada", text: "🚨 Komm sofort ins Dezernat. Sofort." },
        { von: "ada", text: "Das Depot wurde geleert. Heute Nacht, 03:12 Uhr. Keine Gewalt, kein Alarm – die sind mit einem gültigen Code durch die Vordertür spaziert wie Stammkunden. Das Grimoire ist weg." },
        { wenn: (H) => H.flag("f3_grimoire_gesichert"),
          dann: [
            { von: "ada", text: "Korrektur, und ich brauche einen Schnaps: Das Grimoire ist NICHT weg. Es war gar nicht mehr da – du hattest es zum Zirkel zurückbringen lassen, du paranoides, wunderbares Genie. Die Diebe haben einen leeren Asservatenbeutel erbeutet. Ich könnte dich küssen, und das Protokoll vermerkt, dass ich das nie gesagt habe." },
          ],
          sonst: [] },
        { von: "ada", text: "Aber jetzt der Teil, der wehtut. Der Zugangscode, mit dem sie reinkamen… Komm einfach her. Sieh dir das Log selbst an. Ich will, dass du es selbst liest, bevor ich es ausspreche." },
        { tu: (api) => { api.flag("f3_raub_passiert"); api.ortFrei("depot"); api.log("Das Dezernat-Depot wurde mit einem gültigen Zugangscode ausgeräumt."); } },
        { gedanke: "Ein Innentäter. Im Dezernat. Du denkst an eine zu teure Uhr, an einen Kopierer spätabends, an ein Lächeln, das eine Sekunde zu spät kam – und hoffst mit allem, was du hast, dass du dich irrst." },
      ],
    },

    f3_david_konfrontation: {
      chat: "david",
      schritte: [
        { von: "david", text: "Du hast das Log gesehen. Ich weiß, dass du es gesehen hast." },
        { von: "david", text: "Bitte. Bevor du irgendwas meldest – fünf Minuten. Nicht im Dezernat. Der Parkplatz am Fluss. Ich erzähl dir alles, und dann machst du, was du machen musst. Fünf Minuten. Das ist alles, worum ich dich je gebeten hab." },
        { wahl: [
          { label: "Ich komme. Fünf Minuten.", kodexFuer: ["zweite_chance"], weiter: "f3_david_treffen",
            antwort: [
              { system: "Parkplatz am Fluss, Nieselregen. David sieht aus wie achtzehn und achtzig gleichzeitig. Er redet, bevor du fragst – als hätte er den Text seit Wochen im Kopf und Angst, ihn zu vergessen." },
              { von: "david", text: "Hanna. Meine Schwester. Sie ist krank – richtig krank, die Sorte, bei der normale Kassen einen Brief mit ‚bedauerlicherweise‘ schicken. Vor acht Monaten kam die Morgenstern-Klinik: Experimentalprogramm, voller Platz, alles bezahlt. Ich dachte, wir hätten im Lotto gewonnen." },
              { von: "david", text: "Dann kamen die ‚kleinen Bitten‘. Erst Aktenkopien – nur Verwaltungskram, dachte ich. Dann mehr. Und letzte Woche: der Depot-Code. Ich hab NEIN gesagt, ich schwör's dir. Am nächsten Tag stand in Hannas Behandlungsplan plötzlich das Wort ‚Neubewertung‘. NEUBEWERTUNG. Sie haben nicht mal gedroht. Sie mussten nicht." },
              { clue: "c3_hanna" },
              { von: "david", text: "Ich hab den Code eingegeben und bin nach Hause gefahren und hab gekotzt. Das ist alles. Das ist die ganze erbärmliche Geschichte. Was… was passiert jetzt mit Hanna?" } ] },
          { label: "Keine Treffen. Ich melde es Ada – jetzt.", kodexFuer: ["gesetz"], kodexGegen: ["zweite_chance"],
            tu: (api) => { api.flag("f3_david_sofort_gemeldet"); api.flag("f3_david_verhaftet"); api.npc("david", { vertrauen: -30, angst: 30 }); api.npc("ada", { respekt: 5 }); api.ruf("polizei", 8); api.erinnert("david", "Du hast ihn gemeldet, ohne ihn anzuhören."); api.log("David sofort gemeldet – er wurde im Dezernat festgenommen, ohne dass du seine Geschichte kanntest."); },
            antwort: [
              { system: "Du meldest es. Zwanzig Minuten später wird David Roth an seinem Schreibtisch festgenommen – vor allen Kollegen. Er wehrt sich nicht. Er sieht dich durch die Glasscheibe an, nickt einmal, ganz langsam, und lässt sich abführen.\n\nIn der Vernehmung schweigt er. Zu allem. Erst Tage später erfährst du von seiner Schwester in der Morgenstern-Klinik – aus seiner Personalakte, Rubrik ‚Härtefallantrag, abgelehnt‘." },
              { tu: (api) => api.clue("c3_hanna") },
              { gedanke: "Sauber gelöst, sagt das Protokoll. Warum fühlt es sich dann an, als hättest du eine Geisel erschossen, um die Geiselnahme zu beenden?" } ] },
        ] },
      ],
    },

    f3_david_treffen: {
      chat: "david",
      schritte: [
        { wahl: [
          { label: "Sag gegen Aaron und die Stiftung aus – ich sorge dafür, dass Hanna geschützt wird.", kodexFuer: ["zweite_chance", "unschuldige"],
            tu: (api) => { api.flag("f3_david_kronzeuge"); api.npc("david", { vertrauen: 25, zuneigung: 15 }); api.npc("ada", { vertrauen: 5 }); api.erinnert("david", "Du hast ihm einen Weg zurück gegeben, als er keinen mehr sah."); api.ruf("polizei", 5); api.log("Deal mit David: Kronzeuge gegen Aaron und die Stiftung – im Gegenzug wird Hannas Behandlung gesichert (Ada organisiert die Verlegung in die Uniklinik)."); },
            antwort: [
              { von: "david", text: "Du… würdest das tun? Nach allem?" },
              { von: "david", text: "Okay. Okay. Ich sag alles aus – die Kontaktleute, die Übergaben, die Nummern, ALLES. Da war ein Name, den die nie laut gesagt haben, aber einmal stand er auf einem Umschlag: VEY. Und ich unterschreib jede Aussage, vor jedem Gericht. Nur… lass Hanna nicht fallen. Versprich mir das." },
              { system: "Ada tobt eine Stunde lang, dann telefoniert sie zwei Stunden – und am Abend ist Hanna Roth Patientin der Uniklinik, Härtefallfonds, kein Morgenstern-Logo weit und breit. David wird suspendiert, bleibt aber auf freiem Fuß: Kronzeugenregelung. Sein Name im Log wird zur stärksten Waffe, die du je gegen die Stiftung hattest." } ] },
          { label: "Es tut mir leid, David. Aber es geht nur über Handschellen – danach helfe ich, wo ich kann.", kodexFuer: ["gesetz"],
            tu: (api) => { api.flag("f3_david_verhaftet_fair"); api.flag("f3_david_verhaftet"); api.npc("david", { vertrauen: -5, respekt: 10 }); api.erinnert("david", "Du hast ihn verhaftet – aber fair, mit offenen Karten, und dich danach um Hanna gekümmert."); api.ruf("polizei", 8); api.log("David festgenommen – fair und mit Vorwarnung. Du hast dich danach für Hannas Verlegung eingesetzt."); },
            antwort: [
              { von: "david", text: "…Ich weiß. Ich wusste es, als ich den Code eingetippt hab." },
              { von: "david", text: "Mach's offiziell. Aber eine Bitte: Lass MICH es Ada sagen. Sie hat mich eingestellt, als niemand einen verschuldeten Streifenpolizisten wollte. Sie verdient es, es von mir zu hören." },
              { system: "David stellt sich am Abend selbst. Ada hört ihm zu, ohne ein einziges Mal zu unterbrechen, und sieht danach zehn Jahre älter aus. Auf deinen Druck hin prüft die Staatsanwaltschaft Hannas Fall als Erpressungsopfer-Härtefall – die Verlegung in die Uniklinik läuft." } ] },
        ] },
      ],
    },

    f3_grimoire_entscheidung: {
      chat: "mira",
      schritte: [
        { von: "mira", text: "Du hast das Leihregister gesehen, nicht wahr? Dann weißt du, was ich weiß: Das Grimoire liegt in eurem Depot. Henrike hat es dorthin gebracht, weil sie niemandem mehr traute – nicht mal uns. Vielleicht hatte sie recht." },
        { von: "mira", text: "Aber jetzt frage ich dich, als Freundin und als Hexe: Ist es dort sicher? Wirklich? Ein Polizeikeller, von dem jeder Dienstplan weiß? Ich kann es zurückholen und unter Schwesternschutz stellen – sieben Wächterinnen, rund um die Uhr. Oder du sagst mir, euer Depot hält. Deine Entscheidung. Du kennst dein Haus besser als ich." },
        { wahl: [
          { label: "Hol es zurück. Heute noch. Ich traue meinem eigenen Haus gerade nicht.", kodexFuer: ["niemandem"],
            tu: (api) => { api.flag("f3_grimoire_gesichert"); api.npc("mira", { vertrauen: 15 }); api.ruf("hexen", 12); api.erinnert("mira", "Du hast dem Zirkel das Grimoire anvertraut – gegen die eigene Behörde."); api.log("Das Grimoire wurde aus dem Depot zum Zirkel zurückverlegt – unter Schwesternschutz."); },
            antwort: [
              { von: "mira", text: "Ich schicke die Schwestern sofort los, mit Siegelkoffer und allem Drum und Dran. Und, Detektiv… danke. Für das Vertrauen. Es ist dieser Tage das seltenste Artefakt der Stadt." } ] },
          { label: "Es bleibt im Depot. Asservatenkette, Beweismittelschutz – das ist der sicherste Keller der Stadt.", kodexFuer: ["gesetz"],
            tu: (api) => { api.flag("f3_grimoire_im_depot"); api.log("Das Grimoire bleibt als Beweismittel im Dezernat-Depot."); },
            antwort: [
              { von: "mira", text: "Der sicherste Keller der Stadt. Gut. Ich vertraue dir – nicht dem Keller, dir. Aber tu mir einen Gefallen: Schlaf nicht zu fest in nächster Zeit." } ] },
        ] },
      ],
    },

    f3_ivy_nachspiel: {
      chat: "mira",
      schritte: [
        { von: "mira", text: "Ivy hat mir alles erzählt. Alles. Die Blutmagie, die Erpressung, den Kreis, die Brosche. Sie sitzt seit Stunden im Kräuterzimmer und wartet auf ihr Urteil wie auf ein Fallbeil." },
        { von: "mira", text: "Nach Zirkelrecht steht auf unregistrierte Blutmagie der Ausschluss. Lebenslang. Aber sie ist neunzehn, sie wurde erpresst, und sie hat keinen Menschen getötet. Der Zirkel wird auf meine Stimme hören – und ich werde auf deine hören. Du hast den Fall getragen. Was geschieht mit Ivy?" },
        { wahl: [
          { label: "Zweite Chance: Aussage gegen Aaron, Registrierung, Aufsicht – aber kein Ausschluss.", kodexFuer: ["zweite_chance", "unschuldige"], kodexGegen: ["gesetz"],
            tu: (api) => { api.flag("f3_ivy_gerettet"); api.npc("mira", { vertrauen: 15, zuneigung: 10 }); api.npc("ivy", { vertrauen: 40 }); api.ruf("hexen", 10); api.erinnert("mira", "Du hast für Ivys zweite Chance gesprochen."); api.log("Ivy bleibt im Zirkel: registriert, unter Aufsicht – und als Zeugin gegen Aaron."); },
            antwort: [
              { von: "mira", text: "Dann sind wir uns einig. Registrierung, drei Jahre Aufsicht, und ihre Aussage geht zu Protokoll. Henrike hätte es übrigens genauso entschieden – sie hat Talente nie weggeworfen, nur weil sie beschädigt waren. Vielleicht bist du dem Zirkel ähnlicher, als dir lieb ist." } ] },
          { label: "Das Zirkelrecht gilt: Ausschluss. Aber ich setze mich dafür ein, dass die Justiz ihre Erpressung anerkennt.", kodexFuer: ["gesetz"],
            tu: (api) => { api.flag("f3_ivy_ausgeschlossen"); api.npc("mira", { vertrauen: -8 }); api.npc("ivy", { vertrauen: -20, angst: 20 }); api.ruf("hexen", -5); api.log("Ivy wurde aus dem Zirkel ausgeschlossen – juristisch gilt sie als Erpressungsopfer, magisch ist sie heimatlos."); },
            antwort: [
              { von: "mira", text: "…Das Recht ist das Recht, und du hast es nicht gemacht. Ich auch nicht. Trotzdem werde ich heute Nacht schlecht schlafen, und ich hoffe, du auch ein bisschen. Sie wird die Aussage trotzdem machen, sagt sie. ‚Damit es wenigstens irgendwas wert war.‘ Neunzehn Jahre alt, Detektiv. Neunzehn." } ] },
        ] },
      ],
    },

    f3_geheimnis_ritualmord: {
      chat: "mira",
      schritte: [
        { von: "mira", text: "Beim Aufräumen von Henrikes Arbeitszimmer habe ich etwas gefunden, das du sehen musst. Eine Mappe. Dein Name steht darauf. Dein NAME, Detektiv." },
        { von: "mira", text: "Es sind Notizen zu einem alten Ritualmord – zwölf Jahre her. Eine Verschwundene. Henrike hat den Fall all die Jahre weiterverfolgt, still, allein. Auf der letzten Seite stehen zwei Sätze: ‚Kein Zirkelritual. Die Zeichen waren Käuferware – wie aus einem Katalog. Wer kauft Rituale? Wer VERKAUFT sie?‘ Und darunter, rot unterstrichen: ‚Dieselbe Handschrift wie bei den neuen Vorfällen. Es hat nie aufgehört.‘" },
        { tu: (api) => { api.flag("geheimnis_spur_ritualmord"); api.log("Henrike Stein hat den Ritualmord an deiner Schwester all die Jahre weiterverfolgt – ihre Notizen sprechen von ‚Käuferware‘ und davon, dass es nie aufgehört hat."); api.frage("f3_schwester", "Henrikes Notizen: Der Ritualmord von damals war gekaufte Inszenierung – von wem?"); },
        },
        { gedanke: "Zwölf Jahre lang hast du geglaubt, du jagst einen Kult. Henrikes Handschrift sagt: Du jagst einen Markt. Und Märkte haben Betreiber." },
      ],
    },

    f3_geheimnis_jaeger: {
      chat: "elias",
      schritte: [
        { von: "elias", text: "Bevor du fragst, was du fragen willst: Ja, ich weiß, wer du warst. Die Akte des Ordens vergisst niemanden – auch die Ausgestiegenen nicht. Gerade die nicht." },
        { von: "elias", text: "Aaron ist gegangen, weil ihm das Töten zu leicht fiel. Du bist gegangen, weil es dir zu schwer wurde. Die Welt verwechselt das gern – ich nicht. Wenn du ihn jagst, jagst du mit meinem Segen. Aber merk dir: Er war der Beste, den ich je ausgebildet habe. Nach dir." },
        { tu: (api) => { api.npc("elias", { vertrauen: 15, respekt: 10 }); api.log("Elias kennt deine Ordensvergangenheit – und stellt sich auf deine Seite gegen Aaron."); } },
      ],
    },
  },

  verhoere: {
    olm: {
      name: "Frau Olm", ort: "Weidenbibliothek, Teeküche",
      intro: "Frau Olm gießt Tee ein, ohne zu fragen, ob du welchen willst. Vierzig Jahre Bibliothek stecken in jeder ihrer Bewegungen. Nur ihre Augen wirken seltsam – wie Fenster, hinter denen jemand die Möbel verrückt hat.",
      tonarten: ["freundlich", "empathisch", "sachlich"],
      druckLimit: 2,
      beiBlock: "Ihre Hände beginnen zu zittern, der Tee schwappt. „Ich… ich weiß doch, was ich gesehen habe. Ich WEISS es doch…“ Es klingt, als bettele sie – nicht dich an. Etwas in ihrem eigenen Kopf.",
      themen: [
        { id: "aussage", label: "Ihre Aussage – noch einmal, bitte", worte: ["aussage", "gesehen", "erzaehlen"],
          antworten: {
            sachlich: "„Henrike zog den Kreis selbst, mit grauer Kreide, dreimal, gegen den Uhrzeigersinn. Dann sprach sie Worte, die ich nicht kannte, und dann fiel sie.“ – Dieselben Worte. Dieselbe Reihenfolge. Dieselben Pausen. Du könntest mitsprechen.",
            empathisch: { text: "„Henrike zog den Kreis selbst, mit grauer Kreide…“ Du fragst sanft: Wonach hat es gerochen? Sie stockt. „Gerochen?“ Wie warm war es? „Ich…“ Ihre Finger suchen die Brosche am Kragen, ganz automatisch, wie ein Kind den Schnuller. „Es… sie zog den Kreis selbst. Mit grauer Kreide. Dreimal.“ Die Platte springt zurück an den Anfang.", tu: (api) => api.flag("f3_olm_greift_brosche") },
            freundlich: "Sie erzählt es wieder. Wort für Wort. Als du lächelst und sagst, sie habe ein bemerkenswertes Gedächtnis, strahlt sie: „Vierzig Jahre Bibliothek!“ – Aber echte Bibliothekarinnen-Erinnerungen haben Eselsohren und Randnotizen. Diese hier ist druckfrisch. Zu druckfrisch.",
          } },
        { id: "brosche_thema", label: "Die Brosche an ihrem Kragen", braucht: "c3_brosche", worte: ["brosche", "schmuck", "geschenk"],
          antworten: {
            sachlich: "„Die? Ein Geschenk. Von…“ Stille. Ihre Hand legt sich schützend darüber. „Von jemandem. Neulich. Ich trage sie gern.“ Seit wann genau? „Seit…“ Die Augen flackern. „Ich trage sie gern“, wiederholt sie, und es klingt wie auswendig gelernt. Weil es das ist.",
            empathisch: { text: "„Ein Geschenk“, sagt sie, und ihre Finger schließen sich darum. Du fragst, ob sie sie dir einmal zeigen mag – nur ansehen. Ein langer Kampf hinter ihren Augen. „Ich… sollte sie nicht abnehmen.“ Wer hat das gesagt? „…Niemand?“ Sie sieht dich an, und zum ersten Mal ist da echte Angst: „Warum weiß ich nicht mehr, wer mir die geschenkt hat? Ich vergesse NIE, wer mir etwas schenkt. Nie.“", tu: (api) => { api.npc("olm", { vertrauen: 10 }); api.flag("f3_olm_zweifelt"); } },
            freundlich: "„Hübsch, nicht wahr? Weidenkätzchen, passend zur Bibliothek.“ Von wem sie ist? Sie lacht – eine Sekunde zu spät. „Ach, von… na, Sie wissen ja, wie das ist im Alter.“ Frau Olm katalogisiert seit vierzig Jahren jede Postkarte. Sie weiß immer, von wem etwas ist.",
          } },
        { id: "anker_zerstoeren", label: "Die Brosche zerstören (Anker brechen)", braucht: "i3_falsche_erinnerung", worte: ["anker", "zerstoeren", "brosche zerstoeren", "brechen"],
          antworten: {
            default: { text: "Du erklärst es ihr, so behutsam du kannst: die Erinnerung, die nicht ihre ist, der Anker, der sie hält. Frau Olm hört zu, vierzig Jahre Bibliothek im Rücken und Tränen in den Augen. Dann nimmt sie die Brosche ab – ihre Hand zittert, als würde sie sich gegen einen Sturm stemmen – und legt sie auf den Tisch. „Dann machen Sie es. Ich will meine eigenen Bilder zurück. Auch die schlimmen. GERADE die schlimmen, verstehen Sie? Henrike hat es verdient, dass sich jemand richtig erinnert.“\n\nDu zerschlägst die Brosche mit dem Briefbeschwerer. Ein Geruch wie verbranntes Haar – dann sackt Frau Olm zusammen, und die Bilder kommen, in Scherben, zwischen Schluchzern:\n\n„Ein Mann… Handschuhe… so LEISE, niemand ist so leise… Henrike sagte: ‚SIE sind das also‘ – sie kannte ihn, oder sie wusste, wer ihn schickt… dann ein Geräusch wie ein brechender Ast… und später, viel später, die kleine Ivy. Weinend. Mit Kreide an den Händen. Sie hat sich dreimal übergeben, das arme Kind, und immer weiter gemalt.“",
              tu: (api) => { api.clue("c3_olm_wahr"); api.npc("olm", { vertrauen: 15 }); api.frageWeg("f3_olm_anker"); api.frageWeg("f3_daemon"); api.log("Anker zerstört: Frau Olms wahre Erinnerung ist zurück – ein leiser Mann mit Handschuhen tötete Henrike, Ivy inszenierte danach weinend den Kreis."); } },
          } },
      ],
      beweisReaktionen: {},
      widerspruchReaktionen: {
        i3_falsche_erinnerung: { text: "Du legst es ihr dar – sanft: die wortgleiche Geschichte, die fehlenden Gerüche, die Brosche ohne Absender. Frau Olm wird sehr still. „Sie meinen… in meinem Kopf hat jemand…“ Sie greift zur Brosche, hält mitten in der Bewegung inne und sieht ihre eigene Hand an wie eine Fremde. „Vierzig Jahre passe ich auf Bücher auf, damit niemand Seiten herausreißt. Und jetzt hat jemand in MIR Seiten herausgerissen?“" },
      },
      beweisStandard: "Sie betrachtet es höflich und nippt am Tee. „Ich bin nur die Bibliothekarin, wissen Sie.“",
    },

    ivy: {
      name: "Ivy", ort: "Haus des Zirkels, Kräuterzimmer",
      intro: "Ivy sitzt dir gegenüber wie vor einem Tribunal, die verbrannten Handflächen nach unten gedreht, damit du sie nicht siehst. Du hast Verdächtige gesehen, die Angst vor der Strafe hatten. Ivys Angst ist anders: Sie hat Angst vor der Wahrheit selbst.",
      tonarten: ["freundlich", "empathisch", "sachlich", "druck"],
      druckLimit: 2,
      beiBlock: "Ivy steht so schnell auf, dass der Stuhl umfällt. „Ich muss… die Kräuter…“ Sie ist aus dem Raum, bevor der Stuhl liegt. Mit Druck erreichst du bei diesem Mädchen genau eines: Flucht.",
      themen: [
        { id: "henrike_ivy", label: "Ihr Verhältnis zu Henrike", worte: ["henrike", "aelteste", "verhaeltnis"],
          antworten: {
            empathisch: { text: "„Sie hat mich aufgenommen, als keiner mich wollte.“ Ivys Stimme bricht beim ersten Satz. „Ich bin aus einem Heim, wissen Sie. Henrike hat gesagt: ‚Talent ist Talent, Herkunft ist Wetter.‘ Sie war…“ Sie presst die Handballen auf die Augen. „Sie war das Einzige, was ich je an Familie hatte. Und jetzt denken alle, ich… denken SIE, dass ich…“", tu: (api) => api.npc("ivy", { vertrauen: 12 }) },
            sachlich: "„Sie war meine Mentorin. Die beste. Streng, aber…“ Ivy schluckt. „Fragen Sie, was Sie fragen wollen. Alle fragen es mit den Augen, seit Tagen.“",
            druck: { text: "Bei der ersten scharfen Frage zuckt sie zusammen wie unter einem Schlag, und ihre Augen suchen die Tür. So bekommst du von diesem Mädchen nichts – so hat schon ein anderer mit ihr geredet. Das siehst du jetzt ganz deutlich.", tu: (api) => api.npc("ivy", { angst: 15 }) },
          } },
        { id: "blutmagie_thema", label: "Die Blutmagie-Spuren an ihren Händen", braucht: "c3_ivy_blut", worte: ["blutmagie", "haende", "verbrennung", "magie"],
          antworten: {
            sachlich: { text: "Sie versteckt die Hände unterm Tisch. „Kräuterarbeit. Brennnesseln.“ Brennnesseln machen keine Mikroverbrennungen in Sigillenform, sagst du. Ivy wird weiß wie das Kräuterpapier. „Bitte“, flüstert sie. „Bitte nicht. Wenn das Register das erfährt, bin ich raus. Für immer. Der Zirkel ist alles, was ich habe. ALLES.“", tu: (api) => { api.npc("ivy", { angst: 15 }); api.flag("f3_ivy_unter_druck"); } },
            empathisch: { text: "Du sagst es leise, ohne Vorwurf: Du kennst die Spuren, und du willst verstehen, nicht bestrafen. Ivy sieht dich lange an – wägt, ob Erwachsene, die so reden, eine Falle sind. „Wenn ich es sage“, flüstert sie schließlich, „verliere ich den Zirkel. Wenn ich es nicht sage…“ Sie bricht ab und sieht zur Tür. „…hat ER gewonnen. Schon wieder.“ Wer, Ivy? Sie schüttelt nur den Kopf, die Augen voller Wasser. Noch nicht. Aber bald. Sie ist so nah dran.", tu: (api) => { api.npc("ivy", { vertrauen: 15 }); api.flag("f3_ivy_fast_bereit") } },
            druck: { text: "„BRENNNESSELN!“, schreit sie fast, und dann ist sie aus dem Raum. Du hast es gehört: die Panik einer Erpressten, nicht der Trotz einer Täterin. Aber gehört ist nicht bewiesen – und verschreckt ist verschreckt.", tu: (api) => api.npc("ivy", { angst: 20, vertrauen: -10 }) },
          } },
      ],
      beweisReaktionen: {
        c3_olm_wahr: { text: "Du erzählst ihr, was Frau Olm jetzt wieder weiß: der leise Mann, der brechende Ast – und danach ein weinendes Mädchen mit Kreide an den Händen, das sich dreimal übergab und weitermalte.\n\nIvy sitzt ganz still. Dann bricht es aus ihr heraus, alles auf einmal, ein Damm nach drei Tagen Dauerdruck:\n\n„Er hatte FOTOS. Von meiner Blutmagie, von allem – er wusste Sachen, die nur das Register wissen kann. Er sagte: Zieh den Kreis, leg der Alten die Erinnerung, und niemand stirbt. NIEMAND STIRBT, hat er gesagt!“ Sie zeigt ihre verbrannten Handflächen, als wären sie Beweisstücke gegen sie selbst. „Als ich kam, war Henrike schon… ich hab sie LIEGEN sehen und er stand daneben, ruhig wie ein Möbelstück, und sagte: ‚Plan B. Der Kreis. Jetzt.‘ Und ich… ich hab den Kreis gezogen. Um meine tote Mentorin herum. Weil ich solche Angst hatte. Was bin ich für ein Mensch, dass ich das konnte?“\n\nSie beschreibt ihn, stockend: groß, militärischer Gang, sprach vom Orden ‚als wäre er mal einer gewesen‘. Und Stiefel. Schwere, taktische Stiefel.",
          tu: (api) => { api.clue("c3_ivy_erpresst"); api.npc("ivy", { vertrauen: 20, angst: -10 }); api.frageWeg("f3_ivy"); api.flag("f3_ivy_gestanden"); api.log("Ivy hat gestanden: Sie wurde erpresst – den Tatort inszenierte sie NACH dem Mord. Ihre Beschreibung passt auf einen Ex-Ordensjäger."); } },
        c3_ivy_blut: { text: "Du legst die Analyse auf den Tisch. Ivy sieht sie nicht mal an – sie kennt ihre eigenen Hände. „Sie haben es dokumentiert. Natürlich.“ Sie lacht, klein und kaputt. „Wissen Sie, was das Lustigste ist? Ich hab die Blutmagie damals gelernt, um Albträume zu bannen. ALBTRÄUME. Und jetzt lebe ich in einem.“", tu: (api) => api.npc("ivy", { angst: 10 }) },
      },
      widerspruchReaktionen: {
        i3_ivy_opfer: { text: "„Ihre Magie reicht für eine Erinnerungsfälschung“, sagst du. „Nicht für einen Genickbruch. Ich weiß, dass Sie nicht die Mörderin sind, Ivy. Ich will den Mann mit den Stiefeln.“ Sie sieht auf, und in ihrem Blick ringt Hoffnung mit Todesangst. „Wenn ich rede… schützt mich dann jemand? Ehrlich? Er hat gesagt, er findet jeden. Er hat es so gesagt, wie andere Leute ‚Guten Tag‘ sagen.“", tu: (api) => api.flag("f3_ivy_fast_bereit") },
      },
      beweisStandard: "Sie sieht es kaum an. Ihre Augen sind woanders – bei einer Tür, durch die jederzeit jemand kommen könnte.",
    },

    elias: {
      name: "Pater Elias", ort: "Kapelle des Ordenshauses",
      intro: "Elias sitzt in der ersten Bank, das Gesicht halb im Kerzenlicht. „Eine tote Hexe, und der alte Jäger ist verdächtig“, sagt er, ohne sich umzudrehen. „Die Dramaturgie ist nicht neu. Setz dich. Lass uns sie trotzdem ernst nehmen.“",
      tonarten: ["freundlich", "sachlich", "druck"],
      druckLimit: 3,
      beiBlock: "Elias erhebt sich, plötzlich ganz der Mann, der er vor dreißig Jahren war. „Ich habe Dämonen angeschrien, Junge. Du beeindruckst mich nicht. Komm wieder, wenn dein Ton zu deiner Klugheit passt.“",
      themen: [
        { id: "henrike_elias", label: "Sein Verhältnis zu Henrike Stein", worte: ["henrike", "hexe", "verhaeltnis", "feind"],
          antworten: {
            sachlich: { text: "„Vierzig Jahre lang waren wir Feinde nach Vorschrift – sie Hexe, ich Jäger, beide zu alt für den Hass und zu stur fürs Aufhören.“ Er lächelt dünn. „Und seit einem Jahr waren wir… Verbündete. Heimlich. Zwei alte Wachhunde, die dasselbe Knurren gehört haben: Jemand kauft diese Stadt auf – Blut, Wissen, Seelen, alles. Henrike wusste, hinter WAS sie her sind. Deshalb ist sie tot.“", tu: (api) => api.frage("f3_buendnis", "Wovor hatten Henrike und Elias gemeinsam Angst?") },
            freundlich: "„Sie hat mich ‚alten Fanatiker‘ genannt, ich sie ‚gefährliche Buchhalterin der Hölle‘. Es war das Höflichste, was wir füreinander hatten – bis wir merkten, dass wir denselben Feind beschnüffelten. Dann wurde aus Beschimpfung Briefwechsel. Ich werde diese Briefe vermissen, Detektiv. Mehr, als der Orden je erfahren darf.“",
            druck: "„Ob ICH sie getötet habe, willst du fragen? Frag laut. Frag wie ein Mann.“ Er wartet, bis du es aussprichst. „Nein. Und jetzt frag besser: Warum war ich dort? Denn DAS ist die Frage, die dich weiterbringt.“",
          } },
        { id: "tatabend_elias", label: "Was tat er am Tatabend dort?", worte: ["tatabend", "abend", "bibliothek", "warum dort"],
          antworten: {
            sachlich: (H) => H.npc("elias", "respekt") >= 40 || H.beruf("monsterjaeger") || H.geheimnis("jaegerorden")
              ? { text: "Er sieht dich lange an, dann nickt er, als hätte er eine Prüfung abgenommen. „Ich kam, um sie zu warnen. Wir wussten beide, dass jemand das Grimoire holen würde – bald. Ich war um Punkt neun da. Eine Viertelstunde zu spät.“ Seine Faust ballt sich auf dem Kirchenholz. „In der Seitengasse stand ein dunkler Wagen, M-Sec-Plakette am Spiegel. Und am Hoffenster, im Schatten: eine große Gestalt. Taktische Stiefel. Ich kenne den Gang, Detektiv. Ich habe diesen Gang AUSGEBILDET.“", clue: "c3_elias_zeuge" }
              : "„Ein Spaziergang alter Männer führt manchmal an Bibliotheken vorbei.“ Er sieht dich prüfend an. „Den Rest erzähle ich jemandem, der versteht, was es einen alten Jäger kostet, einer Hexe helfen zu wollen. So weit bist du noch nicht. Vielleicht wirst du es.“ – Sein Respekt will verdient sein: durch Haltung, nicht durch Hartnäckigkeit.",
            druck: "„Ich war dort, ja. Notiere es, unterstreich es, mal ein Ausrufezeichen daneben.“ Er beugt sich vor. „Und während du das tust, läuft der Mann mit den Stiefeln frei herum. Priorisiere, Junge.“",
            default: "„Ich war dort. Warum, das gehört zu den Dingen, die ich nicht jedem erzähle.“",
          } },
        { id: "aaron_thema", label: "Aaron Vey", braucht: "c3_jaegertechnik", worte: ["aaron", "vey", "schueler", "ausgestossen"],
          antworten: {
            sachlich: { text: "Bei dem Namen wird sein Gesicht zu Stein. „Aaron Vey. Mein bester Schüler. Mein größter Fehler.“ Er steht auf, geht zum Altar, zurück. „Begabt wie keiner, schnell wie keiner – und irgendwann habe ich begriffen, dass ihm das Töten nicht schwerfiel. Es fiel ihm LEICHT. Wir haben ihn ausgestoßen, 2021. Tribunal, Urteil, Archiv.“ Er sieht dich an. „Ein Jäger, dem es leichtfällt, ist kein Jäger mehr. Er ist eine Waffe, die einen Käufer sucht. Und sie hat einen gefunden, nicht wahr? Sag mir, wer ihn bezahlt.“", clue: "c3_aaron_ausgestossen", tu: (api) => api.flag("f3_aaron_bekannt") },
            default: { text: "„Aaron.“ Mehr sagt er erst mal nicht. Dann, leise: „Wenn seine Technik an dieser Toten klebt, dann ist aus meinem Versagen ein Mord geworden. Frag mich alles. Ich antworte. Das bin ich ihr schuldig – und ihm die Wahrheit.“", clue: "c3_aaron_ausgestossen", tu: (api) => api.flag("f3_aaron_bekannt") },
          } },
      ],
      beweisReaktionen: {
        c3_genick: { text: "Er liest den Obduktionsbericht zweimal, und seine Hände – ruhige, alte Jägerhände – zittern beim zweiten Mal. „C2, einhändig, Drehung gegen die Achse. ‚Stille Neutralisierung.‘“ Er legt den Bericht ab wie etwas Verbranntes. „Ich habe diese Technik drei Männern beigebracht. Zwei liegen auf dem Ordensfriedhof. Der dritte…“ Er schließt kurz die Augen. „Der dritte trägt heute Anzüge und nennt sich Sicherheitsberater. Aaron Vey. Schreib den Namen auf, Detektiv. Und dann lass uns beide beten, dass ich mich irre – beten kann ich besser als hoffen.“",
          tu: (api) => { api.clue("c3_jaegertechnik"); api.flag("f3_aaron_bekannt"); api.log("Elias hat die Tötungstechnik identifiziert: ‚Stille Neutralisierung‘ – und sie führt zu seinem verstoßenen Schüler Aaron Vey."); } },
        c3_chimaera: { text: "Er studiert das CHIMÄRA-Dokument lange. „‚Replikation der Stillen Schwelle.‘“ Seine Stimme wird ganz leise, und das ist furchteinflößender als jedes Donnern. „Weißt du, was das heißt, Junge? Wer dieses Ritual kontrolliert, entscheidet, WER in dieser Stadt verborgen bleibt – und wer sichtbar wird. Über Nacht. Alle Vampire, alle Wölfe, alle Hexen: sichtbar, erpressbar, sortierbar.“ Er sieht zum Kreuz hinauf. „Ich habe mein Leben lang Monster gejagt. Und jetzt baut sich eines aus Fördergeldern und Anwälten zusammen, und meine Silberklingen sind dagegen Spielzeug. Du brauchst keine Klinge, Detektiv. Du brauchst Beweise. Hol sie dir. Der Orden steht hinter dir – zum ersten Mal seit 1962 hinter einem Polizisten.“",
          tu: (api) => { api.ruf("jaeger", 15); api.npc("elias", { vertrauen: 15, respekt: 10 }); api.log("Elias und der Orden stellen sich offen hinter deine Ermittlung gegen die Stiftung."); } },
      },
      widerspruchReaktionen: {},
      beweisStandard: "Er wirft einen kurzen Blick darauf. „Papier. Bring mir etwas, das atmet oder blutet, dann reden wir.“",
    },

    aaron: {
      name: "Aaron Vey", ort: "M-Sec-Container, Morgenstern-Campus",
      intro: "Aaron Vey empfängt dich in einem Büro, das so aufgeräumt ist, dass es wie unbewohnt wirkt. Kaffee steht bereit, exakt zwei Tassen. „Fragen Sie“, sagt er und lächelt das Lächeln eines Mannes, der Verhöre von der anderen Seite kennt. „Ich bin der kooperativste Mensch, den Sie diese Woche treffen werden.“",
      tonarten: ["freundlich", "sachlich", "druck"],
      druckLimit: 5,
      beiBlock: "Er sieht auf die Uhr, bedauernd. „Ich fürchte, meine Kooperationszeit ist erschöpft – die Stiftung bezahlt mich für Sicherheit, nicht für Konversation. Der Werkschutz begleitet Sie hinaus. Es war mir ein aufrichtiges Vergnügen.“ Das Schlimmste daran: Er meint es vermutlich ernst.",
      themen: [
        { id: "stiftung_thema", label: "Seine Arbeit für die Stiftung", worte: ["stiftung", "msec", "arbeit", "morgenstern"],
          antworten: {
            sachlich: "„Objektschutz, Personenschutz, Risikoanalyse. Langweiliger, als es klingt.“ Er nippt am Kaffee. „Die Stiftung heilt Menschen, Detektiv. Meine Aufgabe ist, dass sie das ungestört tun kann. Es gibt schlechtere Lebensinhalte.“ Es klingt einstudiert. Es klingt alles einstudiert – aber perfekt einstudiert.",
            druck: "„Sie versuchen, mich zu provozieren.“ Er lächelt breiter. „Ich habe Verhörtraining gegeben, wissen Sie. Lektion eins: Wer provoziert, hat keine Beweise. Danke für die Auskunft.“",
            default: "„Sicherheit. Im weitesten Sinne.“",
          } },
        { id: "tatabend_aaron", label: "Wo war er am Tatabend?", worte: ["tatabend", "alibi", "abend"],
          antworten: {
            sachlich: { text: "„Sicherheitsrundgang auf dem Campus, 19 bis 23 Uhr, lückenlos geloggt.“ Er schiebt dir einen Ausdruck hin, ungefragt – er hatte ihn bereitliegen. Die Logs stammen aus dem M-Sec-eigenen System. Das System, das er selbst verwaltet. Ein Alibi aus der eigenen Druckerpatrone.", tu: (api) => api.frage("f3_aaron_alibi", "Aarons Alibi stammt aus dem System, das er selbst kontrolliert – wer kann es unabhängig prüfen?") },
            druck: "„Campus-Rundgang, geloggt, bezeugt.“ Er beugt sich leicht vor, und für einen Hauch eines Moments ist da etwas anderes hinter dem Lächeln – etwas sehr Ruhiges, sehr Kaltes, das dich abschätzt wie eine Distanz. „Sie waren nie beim Militär, oder? Man erkennt es daran, wie Leute Drohungen dosieren. Ihre sind zu groß für Ihre Deckung.“",
            default: "„Auf dem Campus. Geloggt. Der Ausdruck liegt vor Ihnen.“",
          } },
        { id: "orden_thema", label: "Seine Vergangenheit im Orden", braucht: "c3_aaron_ausgestossen", worte: ["orden", "jaeger", "tribunal", "vergangenheit"],
          antworten: {
            sachlich: "„Ah. Sie haben mit Elias gesprochen.“ Zum ersten Mal verändert sich etwas in seinem Gesicht – nicht viel, ein Grad vielleicht. „Der Orden und ich hatten… unterschiedliche Auffassungen von Effizienz. Ich respektiere den alten Mann. Er hat mir alles beigebracht, was ich kann.“ Eine Pause, fein dosiert. „Alles.“",
            druck: "„Das Tribunal? Geschichte.“ Er richtet einen Stift auf seinem Schreibtisch parallel aus, eine Bewegung wie ein Reflex. „Der Orden wirft Waffen weg, die er nicht mehr kontrollieren kann, und nennt es Moral. Die Wirtschaft nennt es Abwerbung. Ich habe nur den Arbeitgeber gewechselt, Detektiv. Genau wie Sie.“",
            default: "„Vergangenheit. Ich lebe in der Gegenwart – sie zahlt besser.“",
          } },
      ],
      beweisReaktionen: {
        c3_stiefel: { text: "Er betrachtet das Abdruckfoto mit professionellem Interesse. „Taktisches Profil, Größe 46. Gute Spurensicherung.“ Er hebt den Blick. „M-Sec hat dreißig Mitarbeiter mit dieser Ausstattung, der Orden nochmal zwanzig, der Großhandel verkauft sie an jedermann. Sie halten eine Visitenkarte ohne Namen in der Hand.“ Er lächelt. „Aber behalten Sie sie. Sammeln macht Freude.“" },
        c3_olm_wahr: { text: "Du beschreibst, was Frau Olm jetzt wieder weiß: der leise Mann, ‚SIE sind das also‘, der brechende Ast. Aaron hört zu wie ein Gutachter. „Eine alte Dame, deren Erinnerung nachweislich magisch manipuliert wurde, erinnert sich nach einer… Broschen-Zertrümmerung… an einen leisen Mann.“ Er lehnt sich zurück. „Ich bin gespannt, wie das ein Staatsanwalt formuliert, ohne dass die Verteidigung Konfetti wirft. Sonst noch etwas?“ Er ist zu gut vorbereitet. Niemand ist auf DIESE Aussage vorbereitet – außer er wusste, dass es sie geben könnte.", tu: (api) => api.flag("f3_aaron_verraet_wissen") },
        c3_chimaera: { text: "Zum ersten Mal entsteht eine echte Pause.\n\n„Sie besitzen internes Eigentum der Stiftung“, sagt er dann, und die Freundlichkeit ist aus der Stimme wie Licht aus einem Raum. „Wie Sie daran gekommen sind, wird interessante juristische Fragen aufwerfen – für SIE. Mein Rat, kollegial und einmalig: Geben Sie es zurück, vergessen Sie das Wort auf diesem Papier, und gehen Sie zurück zu Ihren Werwölfen und Broschen.“ Er steht auf und öffnet dir die Tür. „Menschen, die dieses Wort aussprechen, haben eine bemerkenswert kurze Aufmerksamkeitsspanne der Stadt zur Folge. Fragen Sie die Journalistin. Ach nein – das geht ja nicht mehr.“",
          tu: (api) => { api.npc("aaron", { angst: 5 }); api.flag("f3_aaron_drohung"); api.log("Aaron hat dich unverhohlen gewarnt – und dabei fast zugegeben, dass Marlene Voss auf das Konto der Stiftung geht."); } },
      },
      widerspruchReaktionen: {
        i3_jaeger_spur: { text: "„Ordenstechnik plus Ordensstiefel“, fasst er zusammen, als würdest du ihm ein Projekt pitchen. „Schlüssig. Elegant sogar. Es fehlt nur eine Kleinigkeit: der Beweis, dass diese Stiefel an MEINEN Füßen waren.“ Er faltet die Hände. „Bringen Sie den, und ich gratuliere Ihnen persönlich in Handschellen. Bis dahin ist das eine Hypothese mit Stil. Ich mag Stil. Deshalb läuft dieses Gespräch noch.“" },
      },
      beweisStandard: "Er wirft exakt einen Blick darauf. „Interessant für jemanden. Nicht für mich.“",
    },
  },

  storylets: [
    { id: "f3_selene_st", wenn: (H) => H.flag("ort_betreten_bibliothek") && H.flagAlter("ort_betreten_bibliothek") >= 2, dann: () => Engine.spieleSequenz("f3_selene3") },

    { id: "f3_grimoire_st", wenn: (H) => H.flag("f3_grimoire_bekannt") && H.flag("f3_mira_gesprochen") && !H.flag("f3_raub_passiert"), dann: () => Engine.spieleSequenz("f3_grimoire_entscheidung") },

    { id: "f3_david_st", wenn: (H) => H.hat("c3_depot_log"), dann: () => Engine.spieleSequenz("f3_david_konfrontation") },
    { id: "f3_ivy_nachspiel_st", wenn: (H) => H.flag("f3_ivy_gestanden") && H.flagAlter("f3_ivy_gestanden") >= 3, dann: () => Engine.spieleSequenz("f3_ivy_nachspiel") },
    { id: "f3_aaron_chimaera_jaeger", wenn: (H) => H.flag("f3_wagen_verwehrt") && (H.npc("elias", "vertrauen") >= 40 || H.flag("f3_aaron_bekannt") || H.geheimnis("jaegerorden") || H.beruf("monsterjaeger")) && H.flagAlter("f3_wagen_verwehrt") >= 2, dann: (api) => {
        api.nachricht("elias", "elias", "Man erzählt, du beißt dir am Campus-Werkschutz die Zähne aus. Alte Jägerweisheit: Wo eine Schranke ist, ist eine Schichtübergabe. Heute, 22 Uhr, Anlieferung Nord – der Werkschutz wechselt, und für vier Minuten schaut niemand auf den Parkplatz. Ein alter Mann wird zufällig dort spazieren gehen und zufällig laut nach dem Weg fragen. Was du in diesen vier Minuten tust, ist deine Sache.");
        api.nachricht("elias", "system", "22:04 Uhr: Während Elias den Werkschutz in eine erstaunlich lautstarke Diskussion über Stadtgeschichte verwickelt, liegt der M-Sec-Dienstwagen vier Minuten lang im toten Winkel. Die Dokumentenmappe im Handschuhfach trägt ein Stiftungslogo – du fotografierst jede Seite: „Projekt CHIMÄRA, Phase 3 – Replikation der Stillen Schwelle. Voraussetzung: Originalritual (Grimoire GW).“");
        api.clue("c3_chimaera");
        api.log("Mit Elias' Ablenkung das CHIMÄRA-Dokument aus dem M-Sec-Wagen fotografiert.");
      } },
    { id: "f3_aaron_chimaera_pix", wenn: (H) => H.flag("f3_wagen_verwehrt") && !H.flag("pix_weg") && H.flag("pix_gefallen_eingeloest") && H.flagAlter("f3_wagen_verwehrt") >= 4 && !H.hat("c3_chimaera"), dann: (api) => {
        api.nachricht("pix", "pix", "Hör mal, Vögelchen haben gezwitschert, dass du was aus dem Morgenstern-Fuhrpark brauchst. Zufällig wartet deren Dienstwagen-Flotte freitags in der Werkstatt von 'nem... Geschäftsfreund. Zufällig hat der Geschäftsfreund Fotos vom Handschuhfach-Inhalt gemacht, rein versicherungstechnisch. Zufällig schulde ich dir noch was fürs Neffen-Ding. Check dein Postfach. Wir sind jetzt WIRKLICH quitt.");
        api.clue("c3_chimaera");
        api.log("Pix' Werkstatt-Kontakt hat das CHIMÄRA-Dokument fotografiert – der Gefallen für den Neffen zahlt sich aus.");
      } },
    { id: "f3_geheimnis_ritualmord_st", wenn: (H) => H.geheimnis("ritualmord") && H.flag("f3_mira_gesprochen") && H.kapitelAlter() >= 8, dann: () => Engine.spieleSequenz("f3_geheimnis_ritualmord") },
    { id: "f3_geheimnis_jaeger_st", wenn: (H) => H.geheimnis("jaegerorden") && H.flag("f3_elias_getroffen"), dann: () => Engine.spieleSequenz("f3_geheimnis_jaeger") },
    { id: "f3_geheimnis_blut_ivy", wenn: (H) => H.geheimnis("magisches_blut") && H.flag("f3_ivy_gestanden"), dann: (api) => {
        api.nachricht("mira", "mira", "Ivy hat mich etwas gefragt, das ich dir weitergeben muss, weil es mir keine Ruhe lässt. Sie sagt, als du ihr gegenübersaßest, hat ihre Blutmagie… reagiert. Auf DICH. Sie fragt, ob du weißt, was du bist. Ich habe gesagt: Er weiß es selbst nicht. Stimmt das noch, Detektiv? Wenn du Antworten suchst – die Bibliothek steht dir offen. Henrike hätte gewollt, dass du sie findest.");
        api.log("Ivys Blutmagie hat auf dein Blut reagiert – Mira bietet dir die Bibliothek für Antworten an.");
      } },
  ],

  hinweise(H) {
    return [
      "Prüfe das Ritual, bevor du an Dämonen glaubst: Das Regelbuch (Ritualspuren) sagt dir, wie ein ECHTER Kreis aussieht. Und sieh dir die Todesursache genau an – passt sie zu Magie?",
      "Frau Olms Aussage ist zu perfekt – lass sie die Geschichte zweimal erzählen und vergleiche. Das Regelbuch-Kapitel über Erinnerungsfälschung erklärt, wonach du suchen musst: ein Ankerobjekt, neu, nah am Körper.",
      "Drei Spuren zeigen in dieselbe Richtung: die Tötungstechnik (frag Elias!), der Stiefelabdruck am Fenster, und die Frage, wem das Grimoire nützt. Und behalte im Blick, WO das Grimoire wirklich liegt – und wer davon wissen könnte.",
      "Die Widersprüche: Der Kreis ist Kulisse (offen, falsche Runen, keine Brandzeichen) und Henrike starb durch einen Ordens-Genickbruch. Frau Olms Erinnerung ist gefälscht – zerstöre den Anker (die Brosche), dann kehrt die Wahrheit zurück: Ein leiser Mann tötete Henrike, Ivy inszenierte danach unter Erpressung den Kreis.",
      "Die Lösung: Aaron Vey (Ex-Ordensjäger, M-Sec/Morgenstern) tötete Henrike Stein beim gescheiterten Grimoire-Raub – CHIMÄRA Phase 3 braucht das Ritual der Stillen Schwelle. Ivy wurde zur Inszenierung erpresst, Frau Olms Erinnerung gefälscht, und das Depot wurde über Davids Code geleert. Für die Theorie: Täter = Aaron, Motiv = Grimoire/CHIMÄRA, Methode = Genickbruch + Ritual-Inszenierung. Beweise: Kreis-Analyse, Genickbruch + Jägertechnik, Stiefel, Olms wahre Erinnerung, Ivys Geständnis, Leihregister + CHIMÄRA-Dokument.",
    ];
  },

    frage: "Wer hat Henrike Stein getötet – und wofür musste sie sterben?",
    taeterOptionen: [

      { id: "elias", label: "Pater Elias (Jägerorden)" },
      { id: "daemon", label: "Ein Dämon – das Ritual ging schief" },

    ],
    motive: [
      { id: "zirkel_macht", label: "Machtkampf innerhalb des Zirkels" },
      { id: "hass", label: "Hexenhass des Ordens" },
      { id: "grimoire", label: "Der Raub des Grimoires für Projekt CHIMÄRA" },

          tu: (api) => {

   Morgenstern-Stiftung. Konstantin Morgenstern lädt den Spieler
   persönlich ein und bietet einen Deal an, zugeschnitten auf
   sein Geheimnis.
   Drei Wege: WAHRHEIT (alles öffentlich), GERECHTIGKEIT (stiller,
   sauberer Prozess), FRIEDEN (der Deal). Ein verdeckter vierter
   Ausgang: DER PREIS (Scheitern). Das Ende berechnet sich aus
   Beweisstärke, Verbündeten, Beziehungen und allen Entscheidungen.

    let p = 0;
    if (H.hat("c3_chimaera")) p += 2;                                  // das Schlüsseldokument
    if (H.flag("f2_story_veroeffentlicht")) p += 2;                     // öffentliche Faktenlage
    else if (H.flag("f2_usb_privat")) p += 2;                           // Original in deiner Hand
    else if (H.flag("f2_usb_beweis") && !H.flag("f3_usb_gestohlen")) p += 2;
    if (H.flag("f3_david_kronzeuge")) p += 2;                           // Innentäter-Aussage
    else if (H.flag("f3_david_verhaftet_fair")) p += 1;
    if (H.flag("f3_aaron_verhaftet")) p += 2;                           // der Hammer in U-Haft
    if (H.flag("f3_ivy_gerettet")) p += 1;                              // Ivys Aussage
    if (H.flag("f1_sasse_verhaftet")) p += 1;                           // Sasse als Zeugin
    if (H.flag("f1_morgenstern_hinweis")) p += 1;                       // ihr Teilgeständnis
    if (H.hat("c2_auftrag")) p += 1;                                    // Stiftungs-Zahlung im Basar

    if (H.flag("finale_verdeckt_info")) p += 1;                         // verdeckt gewonnene Details
    return p;
  }

  function verbuendete(H) {

          { von: "ada", text: "Setz dich, bevor du das liest. Ich habe die drei Akten nebeneinandergelegt – Brandt, Voss, Stein. Blutproben mit Markern. Eine Story, die das aufdecken wollte. Ein Ritual, das Verborgenheit kontrolliert. Das ist eine Versorgungskette, und am Ende sitzt genau einer." },
          { von: "ada", text: "Konstantin Morgenstern. Ich spreche den Namen jetzt aus, und weißt du was? Kein Blitz. Noch nicht." },
          { wenn: (H) => H.flag("f3_aaron_verhaftet"),
            dann: [{ von: "ada", text: "Vey sitzt und schweigt, aber sein Schweigen arbeitet für uns: Die Stiftung wird nervös. Nervöse Riesen machen Fehler. Jetzt entscheidet sich, wer schneller ist – ihre Anwälte oder wir." }],
            sonst: [{ von: "ada", text: "Und ich sag dir den bitteren Teil gleich dazu: Ohne Vey in Haft fehlt uns der Hammer. Wir gehen gegen einen Riesen mit dem an, was du in drei Fällen zusammengetragen hast. Hoffentlich hast du gut gesammelt." }] },
          { von: "ada", text: "Heute kam übrigens Post für dich. Handgeschöpftes Papier, geprägtes Logo. Der Riese lädt dich zum Abendessen ein. Geh hin – aber iss nichts, was du nicht selbst vom Buffet genommen hast, und unterschreib NICHTS." },
          { tu: (api) => api.clue("cf_einladung") },
          { gedanke: "Drei Tote haben dich hierher gebracht. Ein Logistiker, der nachzählte. Eine Journalistin, die nachfragte. Eine Hexe, die sich erinnerte. Jetzt bist du dran – mit Zählen, Fragen und Erinnern." },
        ],
      },

      fin_showdown: {
        chat: "morgenstern",
        schritte: [
          { system: "Westflügel der Galerie. Konstantin Morgenstern schenkt zwei Gläser Wasser ein – keines davon eine Geste, alles davon Kalkül – und beginnt zu sprechen, als würdet ihr ein altes Gespräch fortsetzen." },
          { von: "morgenstern", text: "Ich erspare uns die Phase, in der wir beide so tun, als wüssten wir nicht, warum Sie hier sind. Sie haben drei meiner… Unglücksfälle aufgeklärt. Gründlicher, als mir lieb ist. Respekt ist ein Wort, das ich selten benutze. Betrachten Sie es als verwendet." },
          { von: "morgenstern", text: "CHIMÄRA, da Sie das Wort ja kennen, ist kein Schurkenstück. Es ist eine Versicherung. Diese Stadt balanciert seit 1962 auf einem Ritual, das drei alte Frauen und ein Buch zusammenhalten. Ich mache daraus eine Infrastruktur. Verborgenheit als Dienstleistung – stabil, skalierbar, unabhängig von Sterblichen. Dass auf dem Weg dorthin Menschen starben, war nie Auftrag. Es war… Reibung. Dienstleister, die ihre Spielräume überdehnten." },
          { gedanke: "Reibung. Drei Leben. Er glaubt es vermutlich sogar – das ist das Furchtbarste an Männern wie ihm: Sie lügen nicht. Sie buchen um." },
          { wenn: (H) => H.geheimnis("unschuldiger"),
            dann: [{ von: "morgenstern", text: "Und nun zu Ihnen. Ich habe Ihre Akte gelesen – die echte, nicht die Personalakte. Der Mann, der damals unschuldig verurteilt wurde, durch Ihre Arbeit… Ich weiß, wo er heute lebt. Es geht ihm schlecht, falls Sie das nie nachgeprüft haben – Sie haben nie nachgeprüft, nicht wahr? Zu viel Angst vor der Antwort. Ich kann sein Leben reparieren: Entschädigung, Wohnung, Therapie, diskret. Sie könnten Ihre älteste Schuld bezahlen, ohne dass er je erfährt, von wem. Mein Preis ist bescheiden: Sie legen die drei Akten ins Archiv und nehmen einen Beraterposten an. Schuld gegen Schuld. Ein faires Geschäft unter Schuldigen." }],
            sonst: [] },
          { wenn: (H) => H.geheimnis("vampirschuld"),
            dann: [{ von: "morgenstern", text: "Und nun zu Ihnen. In den Annalen des Konvents existiert eine Notiz über eine Lebensschuld – Ihre. Der Vampir, der Sie damals rettete, brach dafür drei Clan-Regeln. Wussten Sie, dass er dafür bis heute büßt? Verbannung in die Tagdienste, seit Jahren. Ich sitze in Gremien, die so etwas… korrigieren können. Ihre Schuld wäre getilgt, Ihr Retter rehabilitiert. Der Preis: drei Akten, ein Archiv, Ihr Schweigen. Die Nacht vergisst keine Schulden, sagt man. Ich biete Ihnen an, Ihre zu löschen." }],
            sonst: [] },
          { wenn: (H) => H.geheimnis("jaegerorden"),
            dann: [{ von: "morgenstern", text: "Und nun zu Ihnen. Das Tribunal-Archiv des Ordens ist erstaunlich undicht, wenn man die richtigen Renovierungen finanziert. Ich besitze die Protokolle Ihrer aktiven Jahre – auch die zwei Nächte, über die Sie mit niemandem sprechen. Veröffentlicht, wären Sie nicht nur Ihre Lizenz los. Vernichtet – und ich vernichte gründlich –, wären Sie zum ersten Mal seit Jahren frei. Drei Akten gegen zwei Nächte. Sie tauschen Vergangenheit gegen Vergangenheit. Wer bekäme so ein Angebot nicht gern?" }],
            sonst: [] },
          { wenn: (H) => H.geheimnis("ritualmord"),
            dann: [{ von: "morgenstern", text: "Und nun zu Ihnen. Zwölf Jahre suchen Sie schon – Ihre Schwester, der Ritualmord, der nie aufgeklärt wurde. Ich werde Ihnen etwas sagen, das sonst niemand auf der Welt Ihnen sagen kann: Ich weiß, was in jener Nacht geschah. Nicht aus Akten – aus erster Hand. Die ‚Ritualmorde‘ jener Jahre waren Beschaffungsmaßnahmen eines Vorgänger-Programms. Vor meiner Zeit, aber in meinen Archiven. Name des Verantwortlichen, Ort, und – das wird Sie zerreißen – die Antwort auf die Frage, ob sie sofort tot war. Alles in einem Safe, zwanzig Meter von hier. Der Schlüssel kostet drei Akten. Sie ermitteln seit zwölf Jahren, Detektiv. Ich biete Ihnen den Abschluss." }],
            sonst: [] },
          { wenn: (H) => H.geheimnis("magisches_blut"),
            dann: [{ von: "morgenstern", text: "Und nun zu Ihnen. Sie wissen es nicht, oder? Was da in Ihren Adern flackert, warum Laternen zucken, wenn Sie wütend sind, warum manche Wesen Sie ansehen wie eine offene Flamme. ICH weiß es. CHIMÄRA katalogisiert Blutlinien seit Phase 1 – Ihre tauchte auf wie ein Komet in einem Vorgarten. Sie sind kein Zufall, Detektiv. Sie sind ein Erbe. Ich kann Ihnen sagen, wessen – Herkunft, Linie, was Sie werden können, was Sie meiden müssen. Niemand sonst auf diesem Kontinent kann das. Drei Akten gegen Ihre eigene Existenz. Die meisten Menschen würden dafür weit mehr verraten als ein bisschen Wahrheit." }],
            sonst: [] },
          { wenn: (H) => H.geheimnis("manipulierter_fall"),
            dann: [{ von: "morgenstern", text: "Und nun zu Ihnen. Es gibt eine Akte, die Sie nachts besuchen kommt: der Fall, den Sie damals… kuratiert haben, um einen geliebten Menschen zu schützen. Verstehen Sie mich nicht falsch – ich finde es war richtig. Es war menschlich. Es war auch, juristisch betrachtet, Strafvereitelung im Amt, und es ist dokumentiert. Ich besitze die Dokumentation. Heben Sie die Hand gegen mich, landet sie beim Generalstaatsanwalt – und der Mensch, den Sie schützten, verliert alles ein zweites Mal. Lassen Sie die Hand unten, vernichte ich sie. Sie haben einmal das Gesetz gebogen, um jemanden zu retten. Ich bitte Sie nur, es noch einmal zu tun. Für dieselbe Person." }],
            sonst: [] },
          { wenn: (H) => H.geheimnis("angegriffen"),
            dann: [{ von: "morgenstern", text: "Und nun zu Ihnen. Die Narbe, die bei Vollmond zieht. Der Angriff damals, den Sie überlebt haben – ‚überlebt‘ ist übrigens das falsche Wort, und das spüren Sie seit Jahren, nicht wahr? Etwas ist geblieben. Meine Labore haben Ihre alte Klinikprobe gefunden, Phase 1 war gründlich. Was in Ihnen schlummert, wird sich entwickeln – die Frage ist nur: kontrolliert oder unkontrolliert. Ich biete Ihnen Behandlung, die es sonst nirgends gibt. Ohne sie… nun. Fragen Sie sich, warum Ihr Misstrauen nie schläft. Es ist nicht Ihres. Drei Akten gegen Ihre Zukunft als Sie selbst." }],
            sonst: [] },
          { wenn: (H) => H.geheimnis("alte_schuld"),
            dann: [{ von: "morgenstern", text: "Und nun zu Ihnen. Ihre alte Schuld – Sie wissen, welche. Ich habe sie gekauft. Verstehen Sie? Die Fraktion, bei der Sie im Wort stehen, steht ihrerseits bei mir im Wort, und ich habe Ihre Schuld als… Aufmerksamkeit erworben. Sie gehört jetzt mir. Ich kann sie zerreißen – Sie wären frei, zum ersten Mal seit Jahren würden Sie eine Tür öffnen, ohne zu rechnen, wer dahinter steht. Oder ich kann sie einfordern. Heute. Hier. Drei Akten, Detektiv. Drei Akten gegen Ihre Freiheit. Ich habe schlechtere Geschäfte gemacht." }],
            sonst: [] },
          { tu: (api) => api.clue("cf_akte") },
          { wahl: [
            { label: "Nein. Drei Menschen sind tot. Es gibt keinen Preis, der das kauft.", kodexFuer: ["wahrheit", "unschuldige", "gesetz"],
              tu: (api) => { api.flag("finale_deal_abgelehnt"); api.npc("morgenstern", { respekt: 15 }); api.log("Du hast Morgensterns Deal abgelehnt – ins Gesicht, in seinem eigenen Haus."); },
              antwort: [
                { von: "morgenstern", text: "…Wissen Sie, wie selten mir jemand in diesem Raum Nein sagt? Ich sollte es konservieren lassen." },
                { von: "morgenstern", text: "Gut. Dann sind die Rollen verteilt. Ich werde Sie nicht bedrohen – Drohungen sind für Leute ohne Anwälte. Ich sage Ihnen nur, was Sie morgen ohnehin merken: Diese Stadt ist mit meinem Geld gebaut, geheizt und geimpft. Reißen Sie an mir, und Sie werden erstaunt sein, was alles mit umfällt. Einen schönen Abend noch. Das Streichquartett spielt gleich Schubert – bleiben Sie ruhig. Es ist bezahlt." } ] },
            { label: "[Zum Schein] Erzählen Sie mehr. Was genau würde mein ‚Beraterposten‘ umfassen?", kodexGegen: ["wahrheit"], kodexFuer: ["niemandem", "stadt"],
              tu: (api) => { api.flag("finale_verdeckt_info"); api.npc("morgenstern", { vertrauen: 10 }); api.log("Du bist zum Schein auf den Deal eingegangen – und hast dabei Details über Phase 3 erfahren (Beweisstärke +1)."); },
              antwort: [
                { von: "morgenstern", text: "Pragmatisch. Das gefällt mir – Idealisten ermüden mich, Pragmatiker bauen Städte. Also: Sie würden die ‚Übergangsphase‘ begleiten. Phase 3 aktiviert die replizierte Schwelle in den ersten zwei Bezirken – Pilotgebiete, vor der Wahl. Das Dezernat müsste gewisse… Kalibrierungsvorfälle als Routineereignisse einordnen. Sie hätten Budget, Personal und meine Dankbarkeit, die, wie Sie wissen, Kliniken baut." },
                { gedanke: "Pilotgebiete. Kalibrierungsvorfälle. Er hat dir gerade Ort, Zeit und Vokabular von Phase 3 geliefert – im Glauben, einen Komplizen zu briefen. Merken. Alles merken." },
                { von: "morgenstern", text: "Schlafen Sie darüber. Aber nicht zu lange – die Standuhr da drüben ist von 1962, und sie läuft erstaunlich genau." } ] },
            { label: "[Schweigen] Aufstehen. Gehen. Kein Wort.", kodexFuer: ["niemandem"],
              tu: (api) => { api.flag("finale_deal_offen"); api.npc("morgenstern", { respekt: 8 }); api.log("Du hast Morgenstern stehen gelassen – wortlos. Das Angebot bleibt im Raum, wie ein geladenes Gewehr."); },
              antwort: [
                { von: "morgenstern", text: "(ruft dir nach, ohne die Stimme zu heben) Kein Nein ist auch eine Antwort, Detektiv. Die zweitbeste, die ich heute bekommen konnte. Sie wissen, wo der Westflügel ist." },
                { gedanke: "Du gehst durch den Saal, vorbei an Schubert und Kanapees, und spürst seinen Blick zwischen den Schulterblättern. Das Angebot liegt weiter auf dem Tisch. Genau das macht es so gefährlich – für ihn oder für dich, das entscheidet sich jetzt." } ] },
          ] },
        ],
      },

      fin_ada_rueckhalt: {
        chat: "ada",
        schritte: [
          { von: "ada", text: "Bevor du den letzten Schritt machst, sollst du eines wissen, und ich sag's genau einmal: Egal, welchen Weg du wählst – Wahrheit, Prozess oder diesen verdammten Deal –, ich stehe dahinter. Du hast dir das Recht verdient, diese Entscheidung zu treffen. Drei Fälle lang." },
          { von: "ada", text: "Aber entscheide BALD. Phase 3 hat einen Stichtag, und Standuhren von 1962 laufen erstaunlich genau, hab ich mir sagen lassen. Wenn du bereit bist: Bau deine Anklage. Du weißt, wo das Theorie-Board ist." },
        ],
      },

    verhoere: {
      morgenstern: {
        name: "Konstantin Morgenstern", ort: "Westflügel der Galerie",
        intro: "Er empfängt dich, als wäre dein Wiederkommen Teil seines Kalenders gewesen. Vermutlich war es das. „Noch Fragen? Stellen Sie sie. Ich finde, wer gleich übereinander urteilt, sollte vorher miteinander geredet haben.“",
        tonarten: ["sachlich", "druck", "freundlich"],
        druckLimit: 6,
        beiBlock: "Er sieht zur Standuhr. „Ich fürchte, mein Wohlwollen hat Öffnungszeiten. Der Ausgang ist, wo er war. Bis bald – so oder so.“",
        themen: [
          { id: "chimaera_thema", label: "Projekt CHIMÄRA", worte: ["chimaera", "projekt", "phase"],
            antworten: {
              sachlich: "„Eine Infrastruktur für Verborgenheit. Wissen Sie, was passiert, wenn der Pakt von 1962 eines Tages reißt – durch Zufall, durch Fanatiker, durch schiere Zeit? Pogrome, Detektiv. Ich habe die Brandnächte studiert. CHIMÄRA macht den Schutz aller Wesen dieser Stadt unabhängig von drei alten Frauen und einem Buch. Dass man mich dafür hasst, ist eingepreist. Visionäre werden immer erst posthum bedankt.“",
              druck: "„Sie wollen ein Geständnis. Ich gebe Ihnen etwas Besseres: eine Rechnung. Drei Tote auf dem Weg zu CHIMÄRA – gegen einundvierzig Tote in den Brandnächten von 1962, die sich OHNE CHIMÄRA wiederholen werden. Rechnen Sie selbst. Ich kann warten, ich habe Anwälte und Sie haben ein Gewissen – raten Sie, was schneller ermüdet.“",
              freundlich: "„Sie fragen höflich, also antworte ich ehrlich: CHIMÄRA ist mein Lebenswerk. Alles andere – die Kliniken, die Galas, der Bischof da draußen – ist Verpackungsmaterial.“",
            } },
          { id: "tote_thema", label: "Jonas Brandt. Marlene Voss. Henrike Stein.", worte: ["tote", "jonas", "marlene", "henrike", "morde"],
            antworten: {
              sachlich: "Er nennt die Namen nicht. Nicht einen. „Es gab Vorfälle, die ich bedaure. Dienstleister mit überdehnten Spielräumen, ich sagte es bereits. Sie werden keinen Auftrag finden, kein Dokument, keine Mail – nicht, weil ich gründlich gelöscht hätte, sondern weil Männer wie ich nie etwas beauftragen müssen. Wir äußern Bedauern über Hindernisse. Den Rest erledigt die Gravitation des Geldes.“",
              druck: { text: "„Sprechen Sie die Namen ruhig aus, wenn es Ihnen hilft.“ Er hält deinem Blick stand, vollkommen ruhig. „Ich habe keinen von ihnen je getroffen. Das ist der Unterschied zwischen mir und einem Mörder, juristisch gesehen. Moralisch?“ Er zuckt minimal die Achseln. „Moral ist eine Währung, Detektiv. Ich halte beachtliche Reserven.“", tu: (api) => api.log("Morgenstern über die Toten: ‚Männer wie ich müssen nie etwas beauftragen.‘") },
              freundlich: "„Drei Menschen, ja. Ich habe ihren Familien anonym Fonds eingerichtet – prüfen Sie es ruhig, es ist das Einzige an mir, das Sie nett finden werden. Es ist keine Reue. Es ist Bilanzhygiene. Aber den Familien ist der Unterschied vermutlich egal, und das ist vielleicht der Sinn von Geld.“",
            } },
          { id: "warum_ich", label: "Warum lädt er ausgerechnet dich ein?", worte: ["warum", "einladung", "ich"],
            antworten: {
              sachlich: "„Weil Sie die letzte Variable sind. Alle anderen in dieser Stadt habe ich längst eingepreist – das Rathaus, die Presse, sogar die Fraktionen, mehr als denen lieb ist. Sie nicht. Sie sind drei Fälle lang jeder Abzweigung gefolgt, die ich verbaut hatte. So etwas kauft man, neutralisiert man oder…“ – er lächelt dünn – „…stellt es ein. Ich bevorzuge einstellen. Es ist das einzig Unberechenbare, das ich je gemocht habe.“",
              default: "„Weil man Probleme einlädt, bevor sie zu Gegnern werden. Und Gegner, bevor sie zu Legenden werden. Sie sind irgendwo dazwischen – der interessanteste Ort der Welt.“",
            } },
        ],
        beweisReaktionen: {
          c3_chimaera: { text: "Er wirft einen einzigen Blick auf das Dokument – seinen Briefkopf, sein Projekt, seine Phase 3. „Gestohlen, vermutlich. Verwertbar? Wir werden sehen.“ Zum ersten Mal sieht er dich an wie ein Problem statt wie ein Projekt. „Wissen Sie, was mich an Ihnen stört, Detektiv? Sie sind nicht käuflich, nicht erpressbar und nicht dumm. Eines davon hätte ich gebraucht.“", tu: (api) => api.npc("morgenstern", { angst: 8 }) },
          cf_phase3: { text: "„Pilotgebiete, Stichtage – Sie haben zugehört auf meiner Gala.“ Er klingt beinahe stolz. „Dann wissen Sie auch: Die Uhr läuft für uns beide. Nach Phase 3 ist Ihre Anklage Geschichte, vorher ist sie gefährlich. Sie haben ein Zeitfenster, Detektiv. Ich an Ihrer Stelle würde es nicht mit Gesprächen verbringen.“ Es ist eine Drohung, eine Auskunft und ein Kompliment zugleich. Bei ihm ist das dasselbe." },
        },
        widerspruchReaktionen: {},
        beweisStandard: "Er betrachtet es wie ein Gastgeschenk mittlerer Preisklasse. „Ablage rechts. Mein Archivar wird es würdigen.“",
      },

    hinweise(H) {
      const p = beweisStaerke(H);
      const v = verbuendete(H).length;
      return [
        "Es gibt hier keinen ‚Täter zum Ankreuzen‘ mehr – es gibt drei Wege: Wahrheit (alles öffentlich), Gerechtigkeit (sauberer Prozess), Frieden (der Deal). Prüfe in der Lagebesprechung, was du hast, bevor du wählst.",
        "Jeder Weg hat Bedingungen: Die Wahrheit braucht die Öffentlichkeit (Presse-Ruf oder Marlenes veröffentlichte Story). Die Gerechtigkeit braucht harte, gerichtsfeste Beweise UND Verbündete unter den Fraktionen. Der Frieden braucht nur deine Unterschrift – und dein Gewissen.",
        "Deine aktuelle Lage: Beweisstärke " + p + "/12, Verbündete: " + v + ". Für die Gerechtigkeit brauchst du etwa 7 Beweispunkte (als Ex-Staatsanwalt 6) und mindestens 2 Verbündete. Für die Wahrheit etwa 6 Punkte und die Presse an deiner Seite.",
        "Vergiss die Gala nicht: Dort liegen letzte Beweise (Phase-3-Termin, und wer zum Schein auf den Deal eingeht, erfährt Details). Kronzeugen zählen schwer: David, Ivy, Sasse – wen du gerettet hast, der redet jetzt für dich.",
        "Klare Ansage: Mit Beweisstärke unter 6 verlierst du Wahrheit UND Gerechtigkeit – dann gewinnt Morgenstern (es sei denn, eine Fraktion mit Ruf ≥ 30 schützt dich). Wenn du jetzt zu schwach bist, ist der Deal kein Verrat, sondern Triage. Oder du nimmst das Scheitern in Kauf – auch das ist ein Ende mit Würde.",
      ];
    },

    theorie: {
      frage: "Die Anklage gegen Konstantin Morgenstern – welchen Weg wählst du?",
