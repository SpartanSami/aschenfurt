            forensiker: { text: "Dir fällt der Bildwinkel auf: Die Kamera filmt nicht den Eingang – sie filmt den Treppenhausspiegel, der den Eingang zeigt. Und die ‚Lucian‘-Gestalt spiegelt sich darin. Vampire haben kein Spiegelbild. Dieses Bild entlastet den Mann, den es belasten soll.", clue: "c2_kamera_analyse" },
            monsterjaeger: { text: "Du hast Vampire durch Spiegelgänge gejagt – sie sind darin unsichtbar, das war immer das Problem. Diese Kamera filmt über den Treppenhausspiegel. Und ‚Lucian‘ ist zu sehen. Dein Jägerhirn zieht den Schluss von allein: Das da ist kein Vampir.", clue: "c2_kamera_analyse" },
          } },
        { id: "schliessfach", label: "Schließfach 312 öffnen (Hauptbahnhof)",
          frei: (H) => H.hat("c2_schluessel"),
          text: "Fach 312, der Schlüssel passt. Darin: ein Umschlag mit Ausdrucken, ein USB-Stick, beschriftet mit Klebeband: ‚Falls mir etwas zustößt – NICHT der Polizei geben, erst lesen.‘\n\nDu liest. Hämatek-Lieferlisten. Chargen mit übernatürlichen Markern. Empfänger: Morgenstern-Forschungscampus. Ein Projektkürzel: CHIMÄRA. Und eine Quellen-Notiz: ‚E.S. – will aussteigen.‘",
          clues: ["c2_usb"],
          tu: (api) => { api.log("Marlenes Backup gefunden: Lieferlisten, CHIMÄRA, Quelle ‚E.S.‘ – die Story, für die sie starb."); api.frage("f2_es", "‚Quelle E.S.‘ – Elif Sasse hat Marlene beliefert. Wer wusste davon?"); } },
      ],
    },
    {
      id: "nachbarn", name: "Gerberstraße 9 – Nachbarschaft", icon: "🏘️",
      frei: () => true,
      beschreibung: "Vier Stockwerke Nachbarschaft: Türspione, Fußmatten, Blumenkästen. Hier kennt jeder jeden. Denkt man.",
      aktionen: [
        { id: "albrecht_tuer", label: "Bei ‚Herrn Albrecht‘ (4B) klingeln",
          text: "Er öffnet freundlich, Strickjacke, Hausschuhe. „Schlimme Sache, schlimme Sache. Gehört hab ich nichts, ich schlafe früh.“ Auf dem Flurtisch hinter ihm: unberührte Post, drei Wochen hoch. Als du nach Marlenes Katze fragst, lächelt er: „Ach, die Minka. Füttere ich doch immer, wenn Frau Voss reist.“\n\nDie Katze heißt Frau Schnurr. Das weiß im Haus jedes Kind.",
          clues: ["c2_katze"],
          beruf: {
            medium: { text: "Du gibst ihm zum Abschied die Hand – und musst dich beherrschen, sie nicht zurückzureißen. Kalt. Nicht Alte-Leute-kalt: leer-kalt, wie ein Raum ohne Bewohner. Hinter dem freundlichen Gesicht ist… niemand, den du lesen kannst.", clue: "c2_kalt" },
            monsterjaeger: { text: "Alte Jägerregel: Gib der Zielperson die Hand. Sein Händedruck ist fest, geübt – und mindestens zwei Grad zu kalt. Du kennst genau eine Spezies mit diesem Symptom, und sie steht im Regelbuch unter G.", clue: "c2_kalt" },
          } },
        { id: "dudek", label: "Frau Dudek (3A) befragen",
          text: "Frau Dudek bittet dich auf ein Pflichtgebäck herein und redet wie ein Wasserfall – Gold wert: „Der Albrecht? Seit Wochen nicht mehr er selbst. Trinkt seinen Milchkaffee nicht mehr – jeden Tag, vierzig Jahre, und plötzlich ‚lieber Tee‘! Grüßt mich mit ‚Frau Dudeck‘, mit ck, ich höre das! Und nachts brennt bei ihm Licht. Der Mann hat nie nachts Licht gehabt.“",
          clues: ["c2_gewohnheiten"],
          tu: (api) => api.frage("f2_albrecht", "Was ist mit ‚Herrn Albrecht‘ vor drei Wochen passiert?") },
        { id: "hof", label: "Hinterhof und Nebeneingang prüfen",
          text: "Der Hof verbindet die Häuser 9 und 11. Eine Tür ohne Kamera, ein Schloss, das jeder im Haus mit der Schulter öffnet. Wer hier wohnt, kommt und geht unsichtbar – die Hauptkamera ist fürs Publikum.",
          tu: (api) => api.timeline("Do, ~00:30", 6030, "Vermutlicher Abgang des Täters über den kameralosen Hinterhof.", "Ortsbegehung") },
      ],
    },
    {
      id: "redaktion", name: "Redaktion: Aschenfurter Bote", icon: "🗞️",
      frei: () => true,
      beschreibung: "Großraumbüro mit zu wenig Leuten für zu viele Schreibtische. An Marlenes Platz: eine brennende Kerze und ihr gerahmter Presseausweis.",
      aktionen: [
        { id: "kollegen", label: "Mit den Kollegen sprechen",
          text: "Die Volontärin spricht leise: „Marlene hat zuletzt nur noch hinter verschlossener Tür telefoniert. Einmal hab ich was gehört – sie war laut: ‚Wenn ihr es nicht druckt, druckt es wer anderes. Die Quelle steigt aus, verstehst du? Sie hat ANGST.‘“ Sie wischt sich die Augen. „Zwei Tage später war sie tot.“",
          tu: (api) => api.frage("f2_quelle_angst", "Marlenes Quelle ‚wollte aussteigen‘ und ‚hatte Angst‘ – vor wem?") },
        { id: "archiv2", label: "Das Redaktionsarchiv durchsehen",
          text: (H) => H.beruf("journalist")
            ? "Der Archivar kennt dich, das Berufs-Du öffnet Schubladen: Marlenes Spesenabrechnungen. Auffällig: dreimal ‚Bahnhof – Schließfachgebühr‘. Eine Journalistin, die ihre Story im Bahnhof lagert, traut ihrer eigenen Redaktion nicht mehr."
            : "Das Archiv ist für Externe gesperrt – Redaktionsgeheimnis. Carla Iben könnte dich hineinlassen. Oder jemand, der hier zu Hause ist.",
          tu: (api) => { const H = Engine.H(); if (H.beruf("journalist")) { api.frage("f2_backup", "Wo ist Marlenes Backup? – Schließfach am Bahnhof?"); api.flag("f2_archiv_hinweis"); } } },
      ],
    },
    {
      id: "basar", name: "Der Basar", icon: "🎭",
      frei: (H) => H.flag("basar_zugang") && !H.flag("pix_weg"),
      beschreibung: "Die Gänge unter dem Schlachthof riechen nach Wachs, Metall und Geheimnissen. Nach dem Mord an einer Journalistin sind die Stimmen leiser als sonst.",
      aktionen: [
        { id: "pix2", label: "Pix nach der Gerberstraße fragen",
          text: "Pix zieht dich hinter den Stand, ungewohnt ernst. „Die tote Schreiberin? Hör zu, das erzähl ich nur dir: Vor vier Wochen hat hier jemand ihre Adresse gekauft. Tagesablauf, Hausplan, alles – das Rundum-Sorglos-Paket. Und jetzt halt dich fest: bezahlt per SCHECK. Unterkonto einer Stiftung. Wer zahlt im Basar mit nachverfolgbarem Papier? Leute, die glauben, dass Gesetze Deko sind.“",
          clues: ["c2_auftrag"],
          tu: (api) => { api.npc("pix", { vertrauen: 5 }); api.log("Pix: Marlenes Adresse wurde gekauft – bezahlt über ein Stiftungs-Unterkonto."); } },
      ],
    },
  ],

  verbindungen: [
    { id: "i2_kein_vampir", a: "c2_siegel", b: "c2_kamera_analyse", widerspruch: true,
      titel: "Der Vampir, der keiner sein kann",
      text: "Die Schwellenweihe ist intakt – kein Vampir hat die Wohnung betreten. Und die ‚Lucian‘-Gestalt auf dem Kamerabild hat ein Spiegelbild. Beides zusammen heißt: Der Vampir auf dem Bild ist eine Maske. Jemand wollte den Konvent am Galgen sehen." },
    { id: "i2_falscher_biss", a: "c2_wunden", b: "c2_blutleer", widerspruch: true,
      titel: "Kein Biss – eine Abfüllung",
      text: "Kanülenwunden im falschen Abstand, kein Speichel, kein Blut am Tatort: Marlene wurde nicht gebissen, sie wurde medizinisch ausgeblutet – und ihr Blut wurde mitgenommen. Wie eine Probe. Wie eine Lieferung." },
    { id: "i2_doppelgaenger", a: "c2_katze", b: "c2_gewohnheiten", widerspruch: true,
      titel: "Der Nachbar, der sich selbst vergessen hat",
      text: "‚Albrecht‘ kennt den Namen der Katze nicht, trinkt seinen Kaffee nicht mehr, grüßt falsch. Gestaltwandler kopieren Gesichter, keine Erinnerungen. Der Mann in 4B ist nicht Heinrich Albrecht." },
    { id: "i2_einladung", a: "c2_tuer", b: "c2_siegel",
      titel: "Die Schwelle hielt – und half dem Falschen",
      text: "Marlene öffnete um 22:50 Uhr ihrem ‚Nachbarn‘ – die Weihe hält Vampire auf, keine Menschen und nichts, das wie ein Mensch aussieht. Ihre Schutzmaßnahme funktionierte perfekt. Gegen den falschen Feind." },
    { id: "i2_albrecht_weg", a: "c2_heim", b: "c2_gewohnheiten",
      titel: "Ausgetauscht, nicht verändert",
      text: "Der echte Albrecht liegt seit exakt drei Wochen sediert in St. Hedwig – seit genau der Zeit, seit der der Mann in 4B ‚anders‘ ist. Kein Sinneswandel. Ein Austausch." },
    { id: "i2_motiv2", a: "c2_usb", b: "c2_auftrag",
      titel: "Die Story, die sterben sollte",
      text: "Marlene stand vor der Veröffentlichung der CHIMÄRA-Lieferlisten – und vier Wochen vorher kaufte jemand mit Stiftungsgeld ihre Adresse und ihren Tagesablauf. Das ist kein Zufall. Das ist Auftragsvorbereitung." },
    { id: "i2_sasse_quelle", a: "c2_usb", b: "c2_redaktion",
      titel: "Zwei Frauen, eine Geschichte",
      text: "Die Redaktion stoppte die Story auf Druck des Stiftungs-Anzeigenetats – und Marlenes Quelle ‚E.S.‘ wollte aussteigen. Elif Sasse lieferte die Listen. Der Mord an Jonas, der Mord an Marlene: dieselbe Geschichte, dieselben Profiteure." },
  ],

  timelineBasis: [
    { zeit: "Do, 21:00–02:00", sortier: 2100, text: "Konzil des Konvents – Lucian Adler durchgehend anwesend (versiegeltes Protokoll).", quelle: "Konvent", clue: "c2_lucian_alibi" },
    { zeit: "Do, 22:50", sortier: 2250, text: "Türklingel: ‚H. Albrecht‘ – Marlene öffnet sofort.", quelle: "Klingelprotokoll", clue: "c2_tuer" },
    { zeit: "Do, 23:00–23:40", sortier: 2300, text: "Todeszeitfenster laut Rechtsmedizin.", quelle: "Rechtsmedizin", clue: "c2_wunden" },
    { zeit: "Do, 23:10", sortier: 2310, text: "Hauskamera: ‚Lucian Adler‘ betritt das Haus (Aufnahme über Treppenhausspiegel).", quelle: "Hausverwaltung", clue: "c2_kamera" },
    { zeit: "Do, 23:30", sortier: 2330, text: "Frau Dudek hört ‚Möbelrücken‘ aus dem 5. Stock.", quelle: "Zeugin", clue: "c2_gewohnheiten" },
    { zeit: "Fr, 09:00", sortier: 6900, text: "Die Putzkraft findet Marlene Voss.", quelle: "Notruf" },
    { zeit: "vor 3 Wochen", sortier: 100, text: "‚Heinrich Albrecht‘ wird unter falschem Namen in St. Hedwig aufgenommen.", quelle: "Klinikregister", clue: "c2_heim" },
    { zeit: "vor 4 Wochen", sortier: 50, text: "Im Basar kauft jemand Marlenes Adresse und Tagesablauf – bezahlt über ein Stiftungs-Unterkonto.", quelle: "Pix", clue: "c2_auftrag" },
  ],

  beimStart(api) {
    api.log("Fall 2 angenommen: Marlene Voss, ausgeblutet hinter einer geweihten Schwelle – und ein Vampir auf dem Kamerabild.");
    api.frage("f2_schwelle", "Wie kam ein ‚Vampir‘ durch eine intakte Schwellenweihe?");
    Engine.spieleSequenz("f2_intro");
  },

  sequenzen: {
    f2_intro: {
      chat: "ada",
      schritte: [
        { von: "ada", text: "Es geht weiter, und es wird schlimmer. Marlene Voss, die Journalistin vom Boten – tot in ihrer Wohnung. Ausgeblutet. Zwei Löcher im Hals. Und auf der Hauskamera: Lucian Adler höchstpersönlich." },
        { von: "ada", text: "Das Rathaus will ihn heute noch festnehmen lassen. Wenn wir den Gesandten des Konvents auf ein Kamerabild hin verhaften und uns irren, haben wir 1962 zurück, nur mit besseren Waffen. Wenn er es WAR und wir zögern, auch. Du siehst das Problem." },
        { wenn: (H) => H.wert("f1_ergebnis") === "falsch_viktor",
          dann: [ { von: "ada", text: "Und nach der Calvera-Nummer beim letzten Mal ist der Konvent sowieso schon auf Krawall gebürstet. Diesmal, bitte: erst Beweise, dann Handschellen." } ],
          sonst: [] },
        { wahl: [
          { label: "Niemand wird verhaftet, bevor ich den Tatort gesehen habe.", antwort: [{ von: "ada", text: "Richtige Antwort. Ich halte dir das Rathaus zwei, drei Tage vom Hals. Mehr kriege ich nicht hin – die Schlagzeile schreibt sich schon von selbst." }] },
          { label: "Was wissen wir über Marlenes letzte Recherche?", antwort: [{ von: "ada", text: "‚Blutlogistik‘ – mehr wissen wir nicht, die Redaktion mauert. Die Story wurde gestoppt, von der eigenen Chefin. Carla Iben. Die beiden sollen sich am Vortag angeschrien haben, dass die Praktikanten rot wurden." }] },
        ] },
        { gedanke: "Eine Journalistin, die über Blut schrieb, stirbt durch Blutverlust. Manchmal ist die Stadt subtil. Heute nicht." },
      ],
    },

    f2_mira_siegel: {
      chat: "mira",
      schritte: [
        { von: "mira", text: "Ich habe die Schwelle in der Gerberstraße geprüft, wie erbeten. Die Weihe stammt von uns – ich habe sie vor zwei Jahren selbst gewirkt, Marlene war… vorsichtig geworden. Aus gutem Grund, wie sich zeigt." },
        { von: "mira", text: "Das Ergebnis, und ich lege dafür meine Hand ins Feuer: Das Siegel ist intakt. Unversehrt. Kein Vampir hat diese Schwelle übertreten – nicht eingeladen, nicht uneingeladen, gar nicht. Was auch immer in dieser Wohnung war: Es war kein Kind der Nacht.", anhang: { titel: "Gutachten: Schwellenweihe Gerberstraße 9" } },
        { clue: "c2_siegel" },
        { gedanke: "Das Kamerabild sagt Vampir. Die Schwelle sagt unmöglich. Eines von beiden lügt – und Schwellen lügen nicht." },
      ],
    },

    f2_selene2: {
      chat: "selene",
      schritte: [
        { von: "selene", text: "Marek hier. Ihr ‚Vampiropfer‘ – ich zitiere die Boulevardpresse – ist medizinisch das Ordentlichste, was ich je auf dem Tisch hatte. Und genau das ist das Problem." },
        { von: "selene", text: "Die Punktionen: 65 Millimeter Abstand, glatte Kanülenränder, 1,8 Millimeter Durchmesser. Ein Vampirbiss liegt bei 28 bis 34 Millimetern, mit Speichel-Antikoagulanzien und vitaler Reaktion. Hier: nichts davon. Das war eine Kanüle, gesetzt von jemandem mit Übung.", anhang: { titel: "Obduktionsbericht M. Voss" } },
        { clue: "c2_wunden" },
        { von: "selene", text: "Und: Ihr fehlen fast vier Liter Blut, aber der Tatort ist sauber. Das Blut wurde abgenommen und MITGENOMMEN. In Behältern. Wer trinkt schon vier Liter? Nicht mal meine Schwiegermutter beim Kaffeeklatsch." },
        { clue: "c2_blutleer" },
        { gedanke: "Jemand hat Marlene wie eine Blutspende behandelt. Ihr Blut ist irgendwo unterwegs – als Probe. Als Ware. Als Projekt." },
      ],
    },

    f2_lucian_kontakt: {
      chat: "lucian",
      schritte: [
        { von: "lucian", text: "Guten Abend. Lucian Adler. Man zeigt mir ein Kamerabild, auf dem ich ein Haus betrete, in dem ich nie war, um eine Frau zu töten, die ich nie traf. Sie werden verstehen, dass ich an dieser Stelle ein gewisses… berufliches Interesse an Ihrer Arbeit entwickle." },
        { von: "lucian", text: "Der Konvent hat dem Dezernat das versiegelte Konzil-Protokoll geöffnet – zum ersten Mal seit 1974, damit Sie das Gewicht ermessen. Ich saß von 21 Uhr bis 2 Uhr morgens fünf Älteren gegenüber. Es gibt langweiligere Alibis, aber keine besseren." },
        { clue: "c2_lucian_alibi" },
        { wahl: [
          { label: "Das Kamerabild entlastet Sie ohnehin – es zeigt ein Spiegelbild.", wenn: (H) => H.hat("c2_kamera_analyse"),
            tu: (api) => { api.flag("f2_lucian_entlastet_frueh"); api.npc("lucian", { vertrauen: 20, respekt: 10 }); api.ruf("vampire", 15); api.erinnert("lucian", "Du hast ihn entlastet, bevor er darum bitten musste."); api.log("Du hast Lucian früh entlastet – der Konvent vergisst so etwas nicht."); },
            antwort: [
              { von: "lucian", text: "…Sie haben den Spiegel gesehen. " },
              { von: "lucian", text: "Wissen Sie, wie selten das ist? Drei Behörden haben dieses Bild geprüft und nur die Schlagzeile gelesen. Sie haben hingesehen. Der Konvent merkt sich Schuldige sehr lange, Ermittler – aber Gerechte noch länger. Wenn Sie eines Tages eine Tür brauchen, die sich nicht öffnen will: Klopfen Sie bei uns." } ] },
          { label: "Ich prüfe Ihr Alibi wie jedes andere auch.", antwort: [{ von: "lucian", text: "Selbstverständlich. Ich erwarte nichts anderes – Gründlichkeit ist die einzige Höflichkeit, die in Ihrem Beruf zählt. Prüfen Sie. Und wenn Sie fertig sind, prüfen Sie bitte ebenso gründlich, wer mein Gesicht trug. Das interessiert mich nämlich brennend." }] },
          { label: "[Druck] Ein Kamerabild ist ein Kamerabild. Sie bleiben Verdächtiger Nummer eins.", kodexGegen: ["zweite_chance"],
            tu: (api) => { api.npc("lucian", { vertrauen: -10, respekt: -5 }); api.ruf("vampire", -10); },
            antwort: [{ von: "lucian", text: "Wie Sie wünschen. Dann lernen Sie eine Eigenschaft des Konvents kennen, die wir mit Gletschern teilen: Wir sind langsam, wir sind kalt, und wir geben keinen Millimeter nach. Guten Abend." }] },
        ] },
      ],
    },

    f2_david_kopierer: {
      chat: "david",
      schritte: [
        { system: "Spätabends im Dezernat: Durch die Glasscheibe siehst du David am Kopierer stehen – mit der Voss-Akte. Er kopiert. Sieht sich um. Kopiert weiter. Als er dich bemerkt, lächelt er eine Sekunde zu spät." },
        { wahl: [
          { label: "Ihn direkt ansprechen: „Für wen sind die Kopien, David?“",
            tu: (api) => { api.flag("f2_david_angesprochen"); api.npc("david", { angst: 15 }); api.erinnert("david", "Du hast ihn beim Kopieren erwischt und direkt gefragt."); api.log("David am Kopierer gestellt – seine Erklärung war dünn."); },
            antwort: [
              { von: "david", text: "Was? Die… die sind für Ada, Backup für die Fallmappe. Du weißt doch, wie sie ist mit Papier. 😅" },
              { system: "Ada führt keine Papier-Fallmappen. Das weißt du. Und David weiß, dass du es weißt – seine Ohren sind rot, als er geht." },
              { gedanke: "Vielleicht ist es nichts. Übereifer, ein privates Backup, ein Fehler. Aber die Uhr an seinem Handgelenk kostet drei Monatsgehälter, und sein Lächeln kam zu spät." } ] },
          { label: "Nichts sagen. Nur beobachten – und es dir merken.",
            tu: (api) => { api.flag("f2_david_beobachtet"); api.log("David heimlich beim Kopieren der Voss-Akte beobachtet – du hast es dir gemerkt."); },
            antwort: [
              { gedanke: "Du sagst nichts. Aber du vergisst auch nichts: die Akte, der Blick über die Schulter, die zu teure Uhr. Puzzleteile, die noch kein Bild ergeben. Noch nicht." } ] },
        ] },
      ],
    },

    f2_heim_fund: {
      chat: "david",
      schritte: [
        { von: "david", text: "Dein Auftrag mit dem Vermisstenabgleich – Treffer! Ich hab das Foto vom echten Heinrich Albrecht durch die Heimregister gejagt. Pflegehaus St. Hedwig, Zimmer 14, aufgenommen vor drei Wochen. Unter dem Namen ‚Herbert Adler‘. Sediert, ‚zur Beobachtung‘. Keine Einweisung, kein Arztbrief." },
        { von: "david", text: "Und jetzt der Teil, bei dem mir kalt wurde: Träger von St. Hedwig ist über zwei Zwischenfirmen… die Morgenstern-Stiftung. Soll ich das irgendwem melden, oder…?" },
        { clue: "c2_heim" },
        { tu: (api) => api.frageWeg("f2_albrecht") },
        { gedanke: "Der echte Albrecht wurde nicht getötet, sondern eingelagert – in einer Klinik mit dem richtigen Träger. Profis. Geduldige, gut bezahlte Profis." },
      ],
    },

    f2_carla_entscheidung: {
      chat: "carla",
      schritte: [
        { von: "carla", text: "Sie haben mir Marlenes Material gezeigt. Ich habe die ganze Nacht darübergesessen. Es ist alles da – die Listen, CHIMÄRA, die Quelle. Es ist die Story ihres Lebens, und sie ist tot, und ich habe sie gestoppt." },
        { von: "carla", text: "Ich kann sie drucken. Morgen, Seite eins, ihr Name drüber, nicht meiner. Oder Sie sagen mir, dass Sie das Material gerichtsfest brauchen und ich halte still, bis Sie so weit sind. Sie entscheiden. Ich schulde ihr beides – Wahrheit UND Gerechtigkeit. Aber ich kann ihr nur eines zuerst geben." },
        { wahl: [
          { label: "Druckt es. Die Stadt soll wissen, wofür Marlene starb.", kodexFuer: ["wahrheit"], kodexGegen: ["gesetz"],
            tu: (api) => { api.flag("f2_story_veroeffentlicht"); api.ruf("presse", 20); api.ruf("konzern", -20); api.ruf("stadt", -10); api.ruf("polizei", -5); api.npc("carla", { vertrauen: 20 }); api.erinnert("carla", "Du hast ihr geholfen, Marlenes letzte Story zu drucken."); api.log("Marlenes Story wurde posthum veröffentlicht – die Stadt kennt jetzt das Wort CHIMÄRA."); },
            antwort: [
              { von: "carla", text: "…Danke. Im Namen einer Toten: Danke." },
              { system: "Am nächsten Morgen titelt der Bote: „DAS BLUT DER STADT – Marlene Voss' letzte Recherche“. Die Morgenstern-Stiftung dementiert ‚haltlose Anwürfe‘ noch vor Mittag. Aber das Wort CHIMÄRA ist jetzt in der Welt, und Worte kann man nicht sedieren." } ] },
          { label: "Haltet still. Ich brauche das Material gerichtsfest – sonst stirbt die Story vor Gericht.", kodexFuer: ["gesetz"],
            tu: (api) => { api.flag("f2_usb_beweis"); api.npc("carla", { vertrauen: 8, respekt: 8 }); api.ruf("polizei", 8); api.log("Marlenes Material wurde als Beweismittel im Dezernat gesichert – die Veröffentlichung wartet."); },
            antwort: [
              { von: "carla", text: "Gerichtsfest. Gut. Aber ich sage Ihnen eines, und es ist keine Drohung, es ist Erfahrung: Beweise gegen mächtige Leute haben in dieser Stadt die Lebenserwartung eines Eintagsfliegen-Praktikanten. Passen Sie auf das Material auf. Schwören Sie mir, dass Sie aufpassen." },
              { gedanke: "Sie hat recht, und du weißt es. Das Material liegt jetzt in der Asservatenkammer des Dezernats. Sicherster Ort der Stadt. Hoffentlich." } ] },
          { label: "Ich behalte das Original. Ihr bekommt Kopien, wenn es so weit ist.", kodexFuer: ["niemandem"],
            tu: (api) => { api.flag("f2_usb_privat"); api.npc("carla", { vertrauen: 3 }); api.log("Du behältst Marlenes Original-Material persönlich – niemand sonst weiß, wo es ist."); },
            antwort: [
              { von: "carla", text: "Sie vertrauen nicht mal Ihrer eigenen Asservatenkammer. Wissen Sie was? Nach allem, was ich über diese Stadt gelernt habe… ist das vermutlich klug. Geben Sie auf sich acht." },
              { gedanke: "Das Original wandert in ein Versteck, das nur du kennst. Vor Gericht wird die Beweiskette dadurch nicht schöner. Aber eine Beweiskette nützt nichts, wenn die Beweise verschwinden." } ] },
        ] },
      ],
    },

    f2_bruno_skandal: {
      chat: "runa",
      schritte: [
        { von: "runa", text: "Na, Stadtmensch. Schon Zeitung gelesen? Dein ‚Werwolf-Mörder‘ Bruno saß die Kernnacht in einer Normalzelle. Weißt du, was passiert ist? NICHTS. Er hat sich verwandelt, sich in die Ecke gelegt und gewinselt, weil er Angst hatte. Acht Wärter haben's gesehen, einer hat's der Presse gesteckt." },
        { von: "runa", text: "Ein Monster, das in der Zelle weint, während der echte Mörder frei rumläuft. DAS ist deine Ermittlung gewesen. Sein Anwalt holt ihn diese Woche raus. Das Rudel vergisst dir das nicht. ICH vergesse dir das nicht." },
        { tu: (api) => { api.flag("f2_bruno_frei"); api.ruf("werwoelfe", -10); api.ruf("presse", 5); api.ruf("polizei", -8); api.timeline("Diese Woche", 9100, "Bruno Falk wird nach dem Zellen-Vollmond-Skandal entlastet und freigelassen.", "Presse"); api.log("Skandal: Bruno wurde im Gefängnis bei Vollmond beobachtet – harmlos. Er kommt frei, das Rudel ist wütend auf dich."); },
        },
        { gedanke: "Ein Unschuldiger im Käfig, weil deine Theorie bequem war. Die Stadt nennt es Justizirrtum. Die Heide nennt es Verrat." },
      ],
    },

    f2_sasse_anwalt: {
      chat: "ada",
      schritte: [
        { von: "ada", text: "Randnotiz, die keine ist: Sasse hat einen neuen Verteidiger. Star-Kanzlei, Stundensatz wie mein Monatsgehalt. Rat mal, wer laut Mandantenliste sonst noch bei denen einkauft. Kleiner Tipp: Es reimt sich auf ‚Morgenstern‘." },
        { von: "ada", text: "Eine Laborleiterin mit Beamtenpension leistet sich die nicht. Jemand bezahlt ihr Schweigen. Und Leute, die für Schweigen zahlen, haben meistens noch mehr zu verschweigen." },
        { tu: (api) => api.frage("f2_wer_zahlt", "Wer bezahlt Sasses Verteidigung – und warum?") },
      ],
    },

    f2_pix_gefallen: {
      chat: "pix",
      schritte: [
        { von: "pix", text: "Du erinnerst dich an unseren Deal? Ein Gefallen, ein echter. Ich lös ihn ein. Keine Panik, ich will keine Akte verschwinden lassen – ich bin Händler, kein Idiot." },
        { von: "pix", text: "Mein Neffe. Sechzehn, dumm, hat für 'nen Zwanziger Päckchen durch den Basar getragen, Inhalt unbekannt – ich schwör's, der Junge kann nicht mal lügen. Er steht auf eurer Liste für die nächste Razzia-Welle. Streich ihn runter. Er kriegt von mir den Anschiss seines Lebens und 'ne Lehrstelle, aber keine Akte. Eine Akte mit sechzehn, das ist hier unten 'ne Lebenslaufbahn." },
        { wahl: [
          { label: "Ich rede mit Ada. Ersteinsatz statt Akte – aber er ist dann raus aus dem Basar.", kodexFuer: ["zweite_chance"],
            tu: (api) => { api.flag("pix_gefallen_eingeloest"); api.flagWeg("pix_gefallen_offen"); api.npc("pix", { vertrauen: 20, zuneigung: 10 }); api.ruf("unterwelt", 10); api.erinnert("pix", "Du hast deinen Gefallen eingelöst und seinen Neffen geschützt – sauber, ohne Aktenfälschung."); api.log("Pix' Gefallen eingelöst: Sein Neffe bekommt eine zweite Chance statt einer Akte."); },
            antwort: [
              { von: "pix", text: "…Du machst es ÜBER Ada? Offiziell? Du bist der erste Mensch, der einen Basar-Gefallen einlöst, ohne dabei dreckig zu werden. Weißt du was, Schätzchen? Wir sind quitt. Und Pix vergisst nie, wer quitt mit ihm ist – das ist besser als jedes Guthaben." } ] },
          { label: "Nein. Ich manipuliere keine Einsatzlisten. Auch nicht für dich.", kodexFuer: ["gesetz"],
            tu: (api) => { api.flag("pix_gefallen_verweigert"); api.npc("pix", { vertrauen: -20 }); api.ruf("unterwelt", -10); api.erinnert("pix", "Du hast deinen geschuldeten Gefallen verweigert, als es um Familie ging."); api.log("Du hast Pix' Gefallen verweigert – im Basar gilt dein Wort jetzt weniger."); },
            antwort: [
              { von: "pix", text: "Verstehe. Dein Wort gilt also genau so lange, wie's dich nichts kostet." },
              { von: "pix", text: "Merk dir den Moment, Detektiv. Wenn du das nächste Mal hier unten Hilfe brauchst, werden die Preise… angepasst sein. Geh jetzt." } ] },
        ] },
      ],
    },

    f2_geheimnis_unschuldiger: {
      chat: "carla",
      schritte: [
        { von: "carla", text: "Übrigens – ich habe Sie eingeordnet, als Sie hier auftauchten. Ich vergesse keine Gesichter aus Gerichtssälen. Der Prozess damals. Der Mann, der verurteilt wurde und es nicht war." },
        { von: "carla", text: "Keine Sorge, das ist keine Drohung – ich habe damals selbst falsch berichtet, wir tragen den Fall beide mit uns rum. Ich erwähne es nur, damit Sie wissen: Ich weiß, dass Sie wissen, wie schnell aus einer ‚wasserdichten Story‘ ein zerstörtes Leben wird. Vielleicht macht Sie das zum Richtigen für diesen Fall." },
        { tu: (api) => api.log("Carla kennt deine Vergangenheit – den Unschuldigen, der verurteilt wurde.") },
      ],
    },
  },

  verhoere: {
    albrecht: {
      name: "„Herr Albrecht“", ort: "Wohnung 4B, Gerberstraße 9",
      intro: "Er bittet dich herein, bietet Tee an – ‚Kaffee vertrage ich nicht mehr, das Alter‘ – und setzt sich in einen Sessel, der aussieht, als gehöre er jemand anderem. Was er, wenn du recht hast, auch tut. Alles an diesem Mann ist freundlich. Nichts an diesem Mann ist echt.",
      tonarten: ["freundlich", "sachlich", "druck"],
      druckLimit: 3,
      beiBlock: "Das Lächeln bleibt stehen wie ein angehaltenes Video. „Ich bin ein alter Mann, und Sie ermüden mich. Kommen Sie wieder, wenn Sie einen Durchsuchungsbeschluss haben – oder bessere Manieren.“ Die Tür schließt weich. Zu weich.",
      themen: [
        { id: "tatnacht", label: "Die Nacht des Mordes", worte: ["nacht", "donnerstag", "gehoert", "tatnacht"],
          antworten: {
            sachlich: "„Nichts gehört, nichts gesehen. Ich schlafe um zehn, seit vierzig Jahren.“ Frau Dudek hat dir erzählt, dass bei ihm neuerdings nachts Licht brennt. Eines von beiden stimmt nicht – und Frau Dudek irrt sich nie bei Licht.",
            freundlich: "„Ach, wissen Sie, in meinem Alter schläft man tief. Ein schrecklicher Gedanke, dass ich vielleicht nebenan geschnarcht habe, während…“ Er lässt den Satz taktvoll sterben. Die Betroffenheit sitzt perfekt. Wie einstudiert.",
            druck: { text: "„Junger Mensch, ich habe den Häuserkampf im Fernsehen gesehen, mich schüchtern Sie nicht ein.“ Ein Alte-Leute-Witz, exakt an der richtigen Stelle. Wer auch immer das ist: Er ist gut. Sehr gut.", tu: (api) => api.npc("albrecht", { angst: 3 }) },
          } },
        { id: "marlene", label: "Sein Verhältnis zu Marlene Voss", worte: ["marlene", "voss", "nachbarin"],
          antworten: {
            sachlich: "„Ein herzliches Mädchen. Ich habe ihre Katze gefüttert, wenn sie reiste, sie hat mir dafür vom Bäcker mitgebracht.“ Welcher Bäcker, fragst du. „Na, der an der Ecke.“ Der Bäcker an der Ecke hat vor zwei Jahren zugemacht. Marlene holte ihr Brot seitdem am Markt – das steht in ihrem Haushaltsbuch.",
            freundlich: "„Wir Alten und die jungen Leute, wissen Sie – man nickt sich zu, man hilft mit der Katze, der Minka. Mehr war da nicht, aber in einer Stadt wie dieser ist das schon viel.“ Minka. Schon wieder. Die Katze heißt Frau Schnurr, und sie faucht ihn neuerdings an.",
            druck: "„Was wollen Sie denn hören? Dass ich mit über siebzig nachts Journalistinnen überfalle?“ Er kichert. Es klingt geübt. Alles an ihm klingt geübt.",
          } },
        { id: "alltag", label: "Sein Alltag: Kaffee, Katzen, Gewohnheiten", worte: ["kaffee", "gewohnheit", "alltag", "katze"],
          antworten: {
            sachlich: { text: "Du fragst beiläufig nach seinem Milchkaffee – jeden Morgen, vierzig Jahre, sagt Frau Dudek. „Kaffee vertrage ich nicht mehr“, wiederholt er. Seit wann? „Och… eine Weile schon.“ Drei Wochen vielleicht? Sein Blick wird einen Hauch zu still. „Mag sein. Man wird alt.“", tu: (api) => api.npc("albrecht", { angst: 5 }) },
            freundlich: "„Tee, Spaziergang, Kreuzworträtsel.“ Du fragst nach seinem legendären Rosenbeet im Hof, von dem Frau Dudek schwärmt. „Ach, die Rosen, ja, die machen Arbeit.“ Es gibt kein Rosenbeet. Es gab nie eines. Du hast es erfunden – und er hat es gegossen.",
            druck: "„Sie fragen einen alten Mann nach seinem KAFFEE?“ Zum ersten Mal eine Spur Schärfe – nicht die eines empörten Rentners. Die eines Profis, der merkt, dass die Fragen ein Muster haben.",
          },
          tu: (api, ton) => { if (ton === "freundlich") { api.flag("f2_rosen_falle"); api.log("Die Rosenbeet-Falle: ‚Albrecht‘ hat dir ein erfundenes Detail bestätigt."); } } },
      ],
      beweisReaktionen: {
        c2_katze: { text: "„Die Katze heißt Frau Schnurr“, sagst du. „Nicht Minka. Sie füttern sie seit Jahren – sagen Sie.“ Eine Pause, ein Wimpernschlag zu lang. „Man verwechselt Namen, in meinem Alter.“ – „Namen vielleicht. Aber die Katze faucht Sie an, Herr Albrecht. Tiere verwechseln niemanden.“ Sein Lächeln bleibt. Seine Augen nicht.", tu: (api) => api.npc("albrecht", { angst: 10 }) },
        c2_heim: { text: "Du legst den Aufnahmebogen von St. Hedwig auf den Tisch. Zimmer 14. ‚Herbert Adler‘. Das Foto des echten Heinrich Albrecht.\n\nDie Verwandlung ist lautlos: Die Schultern richten sich auf, die Altersflecken wirken plötzlich wie aufgemalt, und die Stimme, die jetzt kommt, ist zwanzig Jahre jünger. „Respekt. Drei Behörden, zwei Versicherungen und eine sehr gründliche Hausverwaltung haben das nicht gefunden.“ Er steht auf, ohne Eile. „Ich würde sagen: Sie wissen, was ich bin, ich weiß, was Sie sind, und wir beide wissen, dass Sie hier allein sind. Türen sind für mich Formsache. Auf Wiedersehen, Ermittler. Vielleicht als jemand, den Sie mögen.“\n\nEhe du am Treppenabsatz bist, ist die Wohnung 4B leer. Nur der Tee dampft noch.",
          tu: (api) => { api.flag("f2_echo_konfrontiert"); api.flag("f2_echo_geflohen"); api.npc("albrecht", { angst: 20 }); api.timeline("Heute", 9200, "‚Albrecht‘ (Gestaltwandler) nach Konfrontation aus der Wohnung 4B verschwunden.", "Eigene Beobachtung"); api.log("Du hast den Wandler direkt konfrontiert – er hat die Maske gelüftet und ist geflohen."); } },
        c2_kalt: { text: "„Ihre Hände“, sagst du. „Zwei Grad zu kalt. Seit drei Wochen trinkt ‚Albrecht‘ keinen Kaffee mehr, kennt seine Nachbarin nicht, seine Katze nicht, sein erfundenes Rosenbeet aber schon.“ Er sieht dich lange an. „Sie sind besser, als Ihre Akte sagt“, sagt er schließlich – und es ist nicht mehr die Stimme eines alten Mannes. „Gehen Sie jetzt. Aus professioneller Höflichkeit, einmalig.“", tu: (api) => { api.flag("f2_echo_gewarnt"); api.npc("albrecht", { angst: 12 }); } },
      },
      widerspruchReaktionen: {
        i2_doppelgaenger: { text: "Du zählst auf: der Kaffee, die Grüße, die Katze, das Licht. „Sie sind nicht Heinrich Albrecht. Sie tragen ihn nur.“ Er rührt seinen Tee, einmal, zweimal. „Wissen Sie, was das Schwerste an alten Männern ist?“, fragt er leise. „Die Langeweile. Vierzig Jahre dieselben sieben Sätze.“ Er sieht auf, und für einen Moment ist das Gesicht nur eine Oberfläche. „Beweisen Sie es. Vor einem Gericht. Mit Geschworenen. Viel Vergnügen.“", tu: (api) => api.npc("albrecht", { angst: 8 }) },
      },
      beweisStandard: "Er betrachtet es mit höflichem Rentner-Interesse. „Ach, was es alles gibt heutzutage.“",
    },

    carla: {
      name: "Carla Iben", ort: "Redaktion, Chefbüro",
      intro: "Carla Iben sieht aus, als hätte sie seit dem Mord nicht geschlafen, und der Aschenbecher gibt ihr recht. „Fragen Sie“, sagt sie, bevor du sitzt. „Alle anderen tun's auch. Die eigene Zunft ist die schlimmste.“",
      tonarten: ["freundlich", "empathisch", "sachlich", "druck"],
      druckLimit: 4,
      beiBlock: "Sie drückt die Zigarette aus, sehr langsam. „Wissen Sie was? Ich habe Verhöre geführt, da waren Sie noch im Volontariat des Lebens. Kommen Sie wieder, wenn Sie Fragen haben statt Urteile.“",
      themen: [
        { id: "streit", label: "Der Streit mit Marlene am Vortag", worte: ["streit", "auseinandersetzung", "vortag"],
          antworten: {
            sachlich: "„Ja, wir haben uns angeschrien. Sie hat mich Feigling genannt, ich habe sie naiv genannt. Beides stimmte.“ Sie zuckt nicht mal. „Das war unser Arbeitsverhältnis seit fünfzehn Jahren. Man schreit nur Leute an, die einem etwas bedeuten.“",
            empathisch: { text: "„Der Streit…“ Sie sieht zum leeren Schreibtisch hinüber. „Wissen Sie, was das Letzte ist, das ich ihr gesagt habe? ‚Deine Story erscheint über meine Leiche.‘“ Sie lacht, und es bricht in der Mitte durch. „Über MEINE Leiche, habe ich gesagt. Das Universum hat einen dreckigen Humor.“", tu: (api) => api.npc("carla", { vertrauen: 10 }) },
            druck: "„Ach, jetzt bin ich dran? Motiv: Karriere?“ Sie beugt sich vor. „Wenn ich jede Story morden würde, die mir Ärger macht, bräuchte ich ein Massengrab, keinen Rotstift. Nächste Frage.“",
          } },
        { id: "story_stopp", label: "Warum wurde die Story gestoppt?", worte: ["story", "gestoppt", "blutlogistik", "verleger"],
          antworten: {
            sachlich: { text: "Sie öffnet die Schreibtischschublade, nimmt einen Ausdruck heraus und schiebt ihn dir hin: eine Mail des Verlegers. ‚Anzeigenpartner M-Stiftung droht mit Totalrückzug. Voss-Recherche bis auf Weiteres on hold.‘ – „Da. Mein Mordmotiv. Ich habe es nicht mal gelöscht, so sehr schäme ich mich dafür.“", clue: "c2_redaktion", tu: (api) => api.npc("carla", { vertrauen: 5 }) },
            empathisch: { text: "„Weil ich schwach war.“ Sie sagt es ohne Wimpernzucken. „Die Stiftung hängt mit ihrem Anzeigenetat über diesem Haus wie ein Damoklesschwert, und der Verleger… Ich habe die Story gestoppt, um vierzig Arbeitsplätze zu retten, und dabei die eine Person verloren, die dieses Blatt je groß gemacht hat.“", clue: "c2_redaktion" },
            druck: "„Von wem der Druck kam, wollen Sie wissen? Folgen Sie dem Geld, Detektiv. Es führt immer zur selben Adresse in dieser Stadt. Mehr sage ich ohne Anwalt nicht – nicht weil ich schuldig bin, sondern weil ich weiß, wie die spielen.“",
          } },
        { id: "quelle", label: "Marlenes Quelle", braucht: "c2_usb", worte: ["quelle", "informant", "e.s.", "sasse"],
          antworten: {
            sachlich: "„‚E.S.‘ – ich habe den Namen nie erfahren, Marlene hat ihre Quellen geschützt wie eine Löwin. Ich weiß nur: eine Frau, aus dem Inneren der Lieferkette, und sie hatte panische Angst. Marlene sagte einmal: ‚Meine Quelle sagt, wer aussteigen will, steigt dort nicht aus. Der wird ausgestiegen.‘“",
            default: "„Ihre Quelle? Geschützt, versiegelt, Marlene-Standard. Ich weiß nur, dass es eine Frau war. Und dass sie Angst hatte.“",
          } },
      ],
      beweisReaktionen: {
        c2_usb: { text: "Du zeigst ihr das Material aus Fach 312. Carla liest. Raucht. Liest. Als sie aufsieht, sind ihre Augen nass und vollkommen klar zugleich. „Sie hatte alles. Sie hatte ALLES, und ich habe es gestoppt.“ Sie drückt die Zigarette aus. „Was auch immer Sie jetzt vorhaben, Detektiv – ich bin dabei. Sagen Sie mir nur, was der Wahrheit mehr nützt: Drucken oder Schweigen. Aber sagen Sie es bald.“",
          tu: (api) => { api.flag("f2_carla_bereit"); api.npc("carla", { vertrauen: 15 }); } },
        c2_tobias_nachrichten: { text: "Sie überfliegt Tobias' Nachrichten und gibt sie dir zurück. „Der Junge ist eine Tragödie, kein Täter. Marlene hat ihn verlassen, als die Story wichtiger wurde als alles andere. Das hier ist Liebeskummer in Großbuchstaben. Glauben Sie mir, ich erkenne Mörderprosa – das ist keine.“" },
      },
      widerspruchReaktionen: {},
      beweisStandard: "Sie wirft einen Berufsblick darauf. „Material. Und was ist die Geschichte dahinter? Es gibt immer eine Geschichte dahinter.“",
    },

    tobias: {
      name: "Tobias Wenger", ort: "Werkskantine, Frühschicht-Pause",
      intro: "Tobias Wenger sitzt vor einem Kaffee, den er nicht trinkt, in einer Arbeitsjacke, die nach Maschinenöl riecht. Seine Augen sind rot. „Sie sind wegen Marlene hier“, sagt er. Es ist keine Frage. „Ich hab's im Radio gehört. Im RADIO.“",
      tonarten: ["freundlich", "empathisch", "sachlich", "druck"],
      druckLimit: 2,
      beiBlock: "Er steht so abrupt auf, dass der Stuhl kippt. „Ich hab sie GELIEBT, Sie Apparat!“ Die halbe Kantine starrt. Er geht. So befragt man niemanden mehr.",
      themen: [
        { id: "nachrichten", label: "Seine Nachrichten an Marlene", worte: ["nachrichten", "sms", "vorwuerfe"],
          antworten: {
            empathisch: { text: "„Die Nachrichten. Ja.“ Er reibt sich das Gesicht. „Ich war verletzt und hab's sie spüren lassen, jede Woche ein bisschen kleinlicher. Wissen Sie, was das Schlimmste ist? Die letzte, die ich geschrieben hab. ‚Deine Story wird dich mal das Leben kosten.‘ Als Vorwurf. Als VORWURF, nicht als…“ Er kriegt den Satz nicht zu Ende. Muss er auch nicht.", tu: (api) => api.npc("tobias", { vertrauen: 12 }) },
            sachlich: "„23 Stück, ich weiß. Ihr habt das Handy.“ Er sieht dich direkt an. „Bitter? Ja. Peinlich? Auch. Aber gucken Sie auf die Zeitstempel – immer nach der Spätschicht, immer drei Bier zu spät. Das ist Liebeskummer-Telegrafie, kein Mordplan.“",
            druck: "„Ja, ich war wütend! Sie hat unser Leben für eine STORY gelöscht!“ Er knallt die Faust auf den Tisch, erschrickt vor sich selbst und wird leise. „…Und trotzdem hätte ich ihr nie ein Haar gekrümmt. Nie.“",
          } },
        { id: "schluessel2", label: "Sein Wohnungsschlüssel", worte: ["schluessel", "wohnung", "zugang"],
          antworten: {
            sachlich: "„Den Schlüssel hab ich noch, ja.“ Er kramt ihn aus der Jacke und legt ihn auf den Tisch, einfach so. „Nehmen Sie ihn. Ich hab ihn behalten, weil Wegwerfen sich so endgültig angefühlt hat. Benutzt hab ich ihn seit der Trennung kein einziges Mal – fragen Sie die Klingel-App, die loggt doch alles.“",
            default: "„Hab ich noch. Benutzt? Nie. Das Protokoll von ihrer smarten Klingel kann das beweisen – die Dinger vergessen nichts.“",
          } },
        { id: "schicht", label: "Sein Alibi: Die Nachtschicht", worte: ["alibi", "schicht", "nachtschicht", "arbeit"],
          antworten: {
            sachlich: { text: "„Donnerstagnacht? Halle 4, Band 2, 22 Uhr bis 6 Uhr 30. Stechkarte, Schichtleiter Demir, und die Kantinenkamera hat mich um Mitternacht beim Automaten – ich hol immer um Mitternacht den ekligen Tomaten-Snack, fragen Sie irgendwen.“ Es passt. Alles. Lückenlos.", clue: "c2_tobias_alibi" },
            default: { text: "„Nachtschicht, durchgehend, mit Stechkarte und Zeugen. Prüfen Sie's, bitte. Im Ernst: BITTE. Ich will von dieser Liste runter, ich will, dass ihr den echten… dass ihr den findet.“", clue: "c2_tobias_alibi" },
          } },
      ],
      beweisReaktionen: {},
      widerspruchReaktionen: {},
      beweisStandard: "Er sieht es an, hilflos. „Ich versteh das alles nicht. Ich versteh seit Tagen gar nichts mehr.“",
    },
  },

  storylets: [
    { id: "f2_mira_st", wenn: (H) => H.flag("f2_mira_anfrage") && H.flagAlter("f2_mira_anfrage") >= 2, dann: () => Engine.spieleSequenz("f2_mira_siegel") },
    { id: "f2_selene_st", wenn: (H) => H.flag("ort_betreten_tatort2") && H.flagAlter("ort_betreten_tatort2") >= 2, dann: () => Engine.spieleSequenz("f2_selene2") },
    { id: "f2_lucian_st", wenn: (H) => H.hat("c2_kamera") && H.flagAlter("clue_c2_kamera") >= 2, dann: () => Engine.spieleSequenz("f2_lucian_kontakt") },
    { id: "f2_kamera_analyse_st", wenn: (H) => H.hat("c2_kamera") && !H.hat("c2_kamera_analyse") && H.flagAlter("clue_c2_kamera") >= 3, dann: (api) => {
        api.nachricht("david", "david", "Hab das Kamera-Video nochmal durch die Videotechnik gejagt, weil mir der Blickwinkel komisch vorkam. Und jetzt halt dich fest: Die Kamera filmt gar nicht den Eingang direkt – sie filmt den TREPPENHAUSSPIEGEL, der den Eingang zeigt.");
        api.nachricht("david", "david", "Heißt: Der ‚Lucian‘ auf dem Bild ist eine SPIEGELUNG. Und Vampire haben kein Spiegelbild, steht in jedem Regelbuch. Wer auch immer da reinging – ein Vampir war's nicht. Das Bild entlastet ihn, statt ihn zu belasten! 🤯", { anhang: { titel: "Videoanalyse: Aufnahme über Spiegel" } });
        api.clue("c2_kamera_analyse");
        api.log("David hat die Kamera-Aufnahme analysiert: Sie läuft über den Treppenhausspiegel – die ‚Lucian‘-Gestalt hat ein Spiegelbild und kann kein Vampir sein.");
      } },

    { id: "f2_heim_st", wenn: (H) => (H.hat("c2_gewohnheiten") || H.hat("c2_katze")) && H.flag("db_albrecht_gefunden"), dann: () => Engine.spieleSequenz("f2_heim_fund") },
    { id: "f2_heim_st2", wenn: (H) => (H.hat("c2_gewohnheiten") && H.hat("c2_katze")) && H.flagAlter("clue_c2_katze") >= 5 && !H.flag("storylet_f2_heim_st"), dann: (api) => {
        api.nachricht("david", "david", "Hab auf eigene Faust was probiert: Foto vom echten Albrecht durch die Vermisstenregister gejagt – du hattest recht mit deinem Bauchgefühl. Schick dir gleich, was ich gefunden hab. Halt dich fest.");
        Engine.spieleSequenz("f2_heim_fund");

    { id: "f2_carla_st", wenn: (H) => H.flag("f2_carla_bereit"), dann: () => Engine.spieleSequenz("f2_carla_entscheidung") },

    { id: "f2_geheimnis_unschuldiger_st", wenn: (H) => H.geheimnis("unschuldiger") && H.flag("ort_betreten_redaktion"), dann: () => Engine.spieleSequenz("f2_geheimnis_unschuldiger") },
    { id: "f2_geheimnis_angegriffen", wenn: (H) => H.geheimnis("angegriffen") && H.flag("f2_echo_gewarnt"), dann: (api) => {
        api.nachricht("ada", "system", "Auf deinem Heimweg klingelt dein Telefon. Unterdrückte Nummer. Eine Stimme, die du heute schon gehört hast – nur jünger: „Ich habe Ihre Akte gelesen, Ermittler. Die Narbe, der Angriff damals. Sie wissen also, wie es ist, wenn etwas anderes die Kontrolle übernimmt. Dann wissen Sie auch: Man gewöhnt sich an alles. Sogar ans Gesichtertragen.“ Klick.");

        api.nachricht("ada", "ada", "Deine Wandler-Meldung ist raus, Ringfahndung läuft – aber ich sag dir gleich, wie das endet: Wie fahndet man nach jemandem, der JEDER sein kann? Wir brauchen ihn über seine Spuren: das Heim, die Zahlungen, der Auftraggeber. Bau die Kette, dann kriegen wir wenigstens die, die ihn geschickt haben.");

  hinweise(H) {
    return [
      "Zwei Dinge können nicht beide wahr sein: was die Kamera zeigt, und was die Schwelle sagt. Prüfe beides gründlich – das Regelbuch zu Vampiren (Einladung, Spiegelbild, Biss) ist dein Schlüssel.",
      "Sieh dir das Kamerabild genauer an (Blickwinkel!) und lass die Schwellenweihe prüfen – Mira Vogel hilft. Und die Rechtsmedizin wird dir etwas über die ‚Bisswunden‘ sagen, das alles ändert.",
      "Der Täter musste eingeladen werden – von jemandem, dem Marlene vertraute. Sprich mit der Nachbarschaft über ‚Herrn Albrecht‘: seinen Kaffee, seine Grüße, den Namen der Katze. Und frag dich, wo der ECHTE Albrecht ist (Datenbank: Albrecht, St. Hedwig).",
      "Der Widerspruch: Die Schwelle ist intakt (kein Vampir war drin) und die ‚Lucian‘-Gestalt hat ein Spiegelbild (also ist sie kein Vampir). Dazu Kanülenwunden statt Biss. Es ist ein Gestaltwandler, der als ‚Albrecht‘ eingeladen wurde und als ‚Lucian‘ den Konvent framen sollte.",
      "Die Lösung: Der Mann in 4B ist der Wandler ‚Echo‘ – der echte Albrecht liegt sediert in St. Hedwig (Morgenstern-Träger). Auftrag: Marlenes CHIMÄRA-Story stoppen (Backup: Schlüssel am Katzenhalsband → Schließfach 312). Für die Theorie: Täter = der falsche Albrecht, Motiv = Auftragsmord, Methode = Betäubung und Blutentzug. Beweise: Siegel + Spiegel-Analyse, Kanülenwunden, Katzen-/Gewohnheits-Lücken, St. Hedwig, Lieferlisten, Basar-Zahlung.",
    ];
  },

  theorie: {
    frage: "Wer hat Marlene Voss getötet – und in wessen Auftrag?",
    taeterOptionen: [
      { id: "lucian", label: "Lucian Adler (Vampir)" },
      { id: "carla", label: "Carla Iben (Redakteurin)" },
      { id: "tobias", label: "Tobias Wenger (Ex-Freund)" },
      { id: "albrecht", label: "Der Mann in 4B – ein Gestaltwandler" },
    ],
    motive: [
      { id: "eifersucht", label: "Eifersucht / verletzte Liebe" },
      { id: "karriere", label: "Vertuschung aus Karriereangst" },
      { id: "blutdurst", label: "Blutdurst eines Vampirs" },
      { id: "auftrag", label: "Auftragsmord – die CHIMÄRA-Story sollte sterben" },
    ],
    methoden: [
      { id: "vampirbiss", label: "Vampirbiss" },
      { id: "betaeubung_entzug", label: "Betäubung, dann medizinischer Blutentzug (inszenierter Biss)" },
      { id: "messer", label: "Messerangriff" },
      { id: "sturz", label: "Sturz / Unfall, danach arrangiert" },
    ],
    kernbeweise: ["i2_kein_vampir", "i2_falscher_biss", "i2_doppelgaenger", "c2_siegel", "c2_kamera_analyse", "c2_wunden", "c2_blutleer", "c2_heim", "c2_katze", "c2_gewohnheiten", "c2_tuer", "c2_usb", "c2_auftrag", "i2_einladung", "i2_albrecht_weg", "i2_motiv2", "c2_kalt"],
    fehlbeweise: ["c2_tobias_nachrichten", "c2_kamera"],

    bewerten(H, e) {
      const kern = this.kernbeweise.filter(b => e.beweise.includes(b)).length;
      const hatRegelWiderspruch = e.beweise.includes("i2_kein_vampir") || (e.beweise.includes("c2_siegel") && e.beweise.includes("c2_kamera_analyse"));
      const hatWandlerBeweis = e.beweise.includes("c2_heim") || e.beweise.includes("i2_doppelgaenger");
      const hatMotiv = e.beweise.includes("c2_usb") || e.beweise.includes("c2_auftrag") || e.beweise.includes("i2_motiv2");

      if (e.taeter === "albrecht") {
        if (e.motiv === "auftrag" && e.methode === "betaeubung_entzug" && kern >= 4 && hatRegelWiderspruch && hatWandlerBeweis) {
          const echoWeg = H.flag("f2_echo_geflohen");
          return { rang: "perfekt", rangName: "Die Maske fällt",
            text: (echoWeg
              ? "Deine Beweiskette steht wie eine Mauer: die intakte Schwelle, das unmögliche Spiegelbild, die Kanülenwunden, der verschwundene echte Albrecht in einer Morgenstern-Klinik, die bezahlte Adresse, Marlenes Story als Motiv.\n\nEcho selbst ist seit deiner Konfrontation untergetaucht – aber deine Kette braucht ihn nicht einmal: Ada lässt das Pflegeheim stürmen, der echte Heinrich Albrecht wird wach und WÜTEND, und die Zahlungswege werden beschlagnahmt."
              : "Deine Beweiskette steht wie eine Mauer – und diesmal hast du den Vogel im Käfig, bevor er fliegen kann: Zugriff in der Gerberstraße, drei Teams, Ada persönlich. Der Mann, der nicht Albrecht ist, lächelt, als man ihn abführt. „Sauber gearbeitet“, sagt er zu dir, fast kollegial.\n\nIm Verhör nennt er keinen Namen – ‚Berufsehre‘ – aber er bestätigt gegen Zusagen das Muster: Auftrag über Mittelsmänner, Honorar über drei Konten, ‚eine Stiftung, deren Namen Sie längst ahnen‘.\n\nZwei Tage später ist Echo tot. Herzstillstand in einer gesicherten Einzelzelle, sagt der Bericht. Niemand kam rein, niemand raus. Das Dezernat ist still an diesem Morgen. Sehr still.")
              + "\n\nLucian Adler ist vollständig entlastet. Der Konvent registriert, wer den Krieg verhindert hat: du. Und irgendwo in der Stadt weiß jetzt jemand sehr Mächtiges deinen Namen.",
            tu: (api) => {
              api.wert("f2_ergebnis", "perfekt"); api.flag("f2_geloest");
              if (!echoWeg) { api.flag("f2_echo_gefasst"); api.flag("f2_echo_tot"); }
              api.flag("f2_lucian_entlastet");
              api.ruf("vampire", 15); api.ruf("polizei", 12); api.ruf("presse", 8); api.ruf("konzern", -15);
              api.npc("lucian", { vertrauen: 15, respekt: 12 }); api.npc("ada", { vertrauen: 10 });
              api.log("Fall 2: Der Gestaltwandler wurde überführt" + (echoWeg ? " (flüchtig)" : ", gefasst – und starb in einer gesicherten Zelle") + ". Spur: Auftrag und Geld einer ‚Stiftung‘.");
            } };
        }
        if (kern >= 3 && hatWandlerBeweis) {
          return { rang: "gut", rangName: "Richtig – mit offenen Flanken",
            text: "Ein Gestaltwandler in 4B – deine Theorie trägt, das Pflegeheim wird geöffnet, der echte Albrecht gerettet. Aber " + (hatMotiv ? "ohne den sauberen Regel-Widerspruch (Schwelle + Spiegel) bleibt juristischer Spielraum" : "das Motiv bleibt unbewiesen – wer den Wandler schickte, kannst du nicht belegen") + ".\n\nDie Fahndung nach Echo verläuft, wie Fahndungen nach Gesichtslosen verlaufen: im Sand. Lucian ist entlastet, der Krieg abgewendet – aber die Hintermänner bleiben Schatten.",
            tu: (api) => {
              api.wert("f2_ergebnis", "gut"); api.flag("f2_geloest"); api.flag("f2_lucian_entlastet");
              api.ruf("vampire", 10); api.ruf("polizei", 8);
              api.npc("lucian", { vertrauen: 10 });
              api.log("Fall 2: Wandler-Theorie bestätigt, echter Albrecht gerettet – Echo und die Auftraggeber blieben im Schatten.");
            } };
        }
        return { rang: "wackelig", rangName: "Die richtige Witterung, zu wenig Biss",
          text: "‚Ein Gestaltwandler war es‘ – du sagst es, und der Haftrichter fragt: ‚Beweisen Sie es.‘ Und da wird es dünn.\n\nDie Wohnung 4B ist längst leer, das Heim mauert hinter Anwälten, und ohne die harten Widersprüche bleibt deine Theorie genau das: eine Theorie. Der Fall bleibt offen. Lucian bleibt angekratzt, der Konvent unruhig – und irgendwo trägt jemand ein neues Gesicht.",
          tu: (api) => {
            api.wert("f2_ergebnis", "wackelig"); api.flag("f2_echo_entkommen");
            api.ruf("polizei", -5); api.ruf("vampire", -5);
            api.log("Fall 2: Wandler-Verdacht richtig, aber unbewiesen – Echo entkam, der Fall blieb offen.");
          } };
      }

      if (e.taeter === "lucian") {
        return { rang: "falsch", rangName: "Der Krieg, den jemand wollte", endgueltig: H.hat("c2_siegel") && H.hat("c2_kamera_analyse"),
          text: "Du lieferst den Vampir.\n\nLucian Adler wird im Morgengrauen abgeführt – vor laufenden Kameras, die jemand rechtzeitig informiert hat. Der Konvent legt binnen Stunden das versiegelte Konzil-Protokoll vor, dazu ein Gutachten zur intakten Schwellenweihe. Die Anklage zerfällt wie nasses Papier" + (H.hat("c2_kamera_analyse") ? " – und du wusstest es. Das Spiegelbild lag in deiner eigenen Akte" : "") + ".\n\nLucian kommt frei. Der Konvent zieht sämtliche Kooperation zurück, die Blutverträge stehen auf der Kippe, und in den Nachrichten fällt zum ersten Mal seit Jahrzehnten das Wort ‚1962‘. Genau das wollte der wahre Täter erreichen. Du warst sein bester Mitarbeiter.",
          tu: (api) => {
            api.wert("f2_ergebnis", "falsch_lucian"); api.flag("f2_echo_entkommen"); api.flag("f2_konvent_krise");
            api.ruf("vampire", -40); api.ruf("polizei", -10); api.ruf("stadt", -10);
            api.npc("lucian", { vertrauen: -30, respekt: -20 });
            api.erinnert("lucian", "Du hast ihn trotz unmöglicher Beweislage ans Messer geliefert.");
            api.log("Fall 2: Lucian zu Unrecht verhaftet – Konvent-Krise, der wahre Täter entkam. Der Frame hat funktioniert.");
          } };
      }

      if (e.taeter === "carla") {
        return { rang: "falsch", rangName: "Die falsche Schuldige", endgueltig: false,
          text: "Carla Iben wird abgeführt, und sie wehrt sich nicht einmal – sie fühlt sich ja schuldig, nur eben an etwas anderem.\n\nDie Anklage hält keine Woche: Alibi, keine Tatortspuren, und vor allem – nichts erklärt die Schwelle, die Kanülen, das Spiegelbild. Sie kommt frei, schreibt einen vernichtenden Leitartikel über das Dezernat und hat damit leider recht.\n\nDer Bote ist dir ab sofort feindlich gesinnt. Und der wahre Täter trägt längst ein anderes Gesicht.",
          tu: (api) => {
            api.wert("f2_ergebnis", "falsch_carla"); api.flag("f2_echo_entkommen");
            api.ruf("presse", -30); api.ruf("polizei", -8);
            api.npc("carla", { vertrauen: -25 });
            api.erinnert("carla", "Du hast sie verhaften lassen, während sie um Marlene trauerte.");
            api.log("Fall 2: Carla zu Unrecht beschuldigt – die Presse ist verprellt, der Täter entkam.");
          } };
      }

      return { rang: "falsch", rangName: "Der einfachste Verdächtige", endgueltig: false,
        text: "Der bittere Ex-Freund mit dem Schlüssel – die älteste Geschichte im Buch. Sie ist auch diesmal falsch.\n\nTobias' Alibi ist aus Stahl: Stechkarte, Schichtleiter, Kantinenkamera. Er wird nach 30 Stunden entlassen, verliert aber den Job – ‚das Werk wünscht keine Schlagzeilen‘. Ein zweites Leben, das die Story von Marlene Voss zerlegt hat.\n\nUnd die Frage, wie ein ‚Vampir‘ durch eine geweihte Schwelle kam, hat immer noch niemand beantwortet.",
        tu: (api) => {
          api.wert("f2_ergebnis", "falsch_tobias"); api.flag("f2_echo_entkommen");
          api.ruf("polizei", -8);
          api.log("Fall 2: Tobias zu Unrecht verdächtigt – sein Leben beschädigt, der Täter entkam.");
        } };
    },
  },
};

      kurz: "‚Henrike zog den Kreis selbst, mit grauer Kreide, dreimal, gegen den Uhrzeigersinn. Dann sprach sie Worte, die ich nicht kannte, und dann fiel sie.‘ – Wort für Wort identisch, bei jeder Wiederholung.",
      lang: "Menschen, die sich wirklich erinnern, variieren: mal ein Detail mehr, mal eine andere Reihenfolge. Frau Olm sagt es auf wie ein Gedicht. Das Regelbuch hat dafür ein Kapitel – unter E wie Erinnerungsfälschung." },

      kurz: "‚Er hatte Fotos von meiner Blutmagie. Er sagte: Zieh den Kreis, leg die Erinnerung, und niemand stirbt. NIEMAND STIRBT, hat er gesagt. Als ich kam, war sie schon… ich hab nur noch den Kreis gezogen, weil ich solche Angst hatte.‘",

      lang: "Da ist es, schwarz auf weiß: Die Stiftung repliziert übernatürliche Eigenschaften aus Blut (Phase 1–2: Hämatek, Marlene) – und Phase 3 braucht das Ritual, das den Pakt von 1962 trägt. Wer die Stille Schwelle kontrolliert, kontrolliert die Verborgenheit aller Wesen dieser Stadt. Und damit die Wesen." },

  orte: [
    {
      id: "bibliothek", name: "Tatort: Weidenbibliothek", icon: "📚",
      frei: () => true,
      beschreibung: "Regale bis unter die Rippen des Gewölbes, der Geruch von Papier und Wachs. Im Lesesaal: der Kreidekreis, das Flatterband, und eine Stille, die selbst für eine Bibliothek zu still ist.",
      aktionen: [
        { id: "kreis", label: "Den Beschwörungskreis analysieren",
          text: "Der Kreis umspannt drei Meter, gefüllt mit Runen, in der Mitte der Umriss der Toten. Es sieht aus wie aus einem Lehrbuch über dunkle Rituale. Vielleicht ein bisschen zu sehr wie aus einem Lehrbuch.",
          clues: ["c3_kreis"],
          beruf: {
            okkultist: { text: "Du brauchst keine zehn Sekunden: Der Kreis ist an ZWEI Stellen offen – damit wirkt gar nichts. Die ‚Runen‘ sind Zierschrift aus einem Fantasyroman, dazwischen echte Zeichen in falscher Reihenfolge. Keine Brandzeichen, kein Ozon, keine verglaste Kreide. Hier wurde nie Magie gewirkt. Das ist Bühnenbild.", clue: "c3_kreis_falsch" },
            medium: { text: "Du stellst dich an den Kreisrand und horchst. Echte Rituale hinterlassen ein Summen im Raum, tagelang. Hier: nichts. Nur Angst – zwei Sorten Angst. Eine alte, würdevolle, die endete. Und eine junge, panische, die Kreide hielt und weinte." },
          } },
        { id: "henrike", label: "Die Tote untersuchen",
          text: "Henrike Stein liegt, als hätte jemand sie hingelegt – ordentlich, beinahe respektvoll. Keine Wunden, kein Blut, keine verbrannten Hände, wie man sie bei Ritualunfällen findet. Nur der Kopf liegt in einem Winkel, der nicht stimmt.",
          beruf: {
            forensiker: { text: "Du tastest die Halswirbelsäule: C2-Fraktur, sauber, ohne Begleitverletzungen. Das ist kein Sturz und erst recht kein Dämon – das ist ein einziger, perfekt gesetzter Griff. Du kennst genau eine Berufsgruppe, die so etwas trainiert, und sie trägt keine Laborkittel.", clue: "c3_genick" },
            monsterjaeger: { text: "Du erkennst es, bevor du dich bücken musst, und dir wird kalt: Genickbruch, einhändig angesetzt, Drehung gegen die Halsachse. ‚Stille Neutralisierung‘. Ordenstechnik. DEINE alte Welt. Es gibt vielleicht drei Menschen, die diesen Griff noch beherrschen.", clue: "c3_genick", },
          } },
        { id: "fenster", label: "Fenster und Zugänge prüfen",
          text: "Die Haupttür war verschlossen, sagt Frau Olm. Aber das Hoffenster im Westflügel ist nur angelehnt – und auf dem Sims, im Staub von hundert Jahren: ein halber Stiefelabdruck. Größe 46, grobes taktisches Profil.",
          clues: ["c3_stiefel"] },
        { id: "register", label: "Das Leihregister und den Schrein prüfen",
          text: "Im Herzen der Bibliothek: der Schrein des Grimoires der Grauen Weide. Er ist leer. Kein Aufbruch, keine Gewalt – und im Leihregister, in Henrikes eigener Handschrift, fünf Tage alt: „GGW – zur sicheren Verwahrung übergeben. D13.“\n\nSie hat es weggebracht. Zur Polizei. Ins Depot deines eigenen Dezernats.",
          clues: ["c3_leihregister"],
          tu: (api) => { api.frage("f3_grimoire", "Das Grimoire liegt im Depot des Dezernats – wusste der Mörder das?"); api.flag("f3_grimoire_bekannt"); } },
        { id: "olm_befragen", label: "Frau Olm befragen",
          text: "Frau Olm sitzt zwischen den Regalen wie ein Teil des Inventars, die Hände im Schoß. Ihre Aussage kommt flüssig, präzise, vollständig: „Henrike zog den Kreis selbst, mit grauer Kreide, dreimal, gegen den Uhrzeigersinn. Dann sprach sie Worte, die ich nicht kannte, und dann fiel sie.“\n\nDu bittest sie, es noch einmal zu erzählen. Sie tut es. Wort. Für. Wort. Identisch.",
          clues: ["c3_olm_aussage"],
          beruf: {
            medium: { text: "Während sie spricht, siehst du es: Ihre Erinnerung fühlt sich an wie eine Fotografie, die man ihr in den Kopf geklebt hat – randscharf, geruchlos, tot. Und darunter, ganz tief, wimmert etwas Echtes. Dein Blick fällt auf die silberne Brosche an ihrem Kragen. Sie ist neu. Sie ist falsch. Sie ist der Nagel, der das Foto hält.", clue: "c3_brosche" },
            okkultist: { text: "Wortgleiche Wiederholung, keine Sinnesdetails, keine Abschweifungen – aus dem Lehrbuch: gefälschte Erinnerung. Und gefälschte Erinnerungen brauchen einen Anker am Körper. Dein Blick wandert über die alte Dame: Da. Die Brosche. Silbern, neu, und Frau Olm weiß nicht mehr, von wem sie ist.", clue: "c3_brosche" },
          } },
      ],
    },
    {
      id: "zirkelhaus", name: "Haus des Zirkels", icon: "🌿",
      frei: () => true,
      beschreibung: "Ein Fachwerkhaus hinter der Bibliothek, voller Kräuterbünde und leiser Trauer. Der Zirkel hat seine Älteste verloren – und behandelt dich höflicher, als du erwartet hast. Henrike hätte das so gewollt, sagt Mira.",
      aktionen: [

          tu: (api) => { api.flag("f3_mira_gesprochen"); if (!Engine.H().beruf("okkultist")) api.flag("f3_mira_gutachten_anfrage"); } },

    {
      id: "depot", name: "Dezernat 13 – Asservaten-Depot", icon: "🔐",
      frei: (H) => H.flag("f3_raub_passiert"),
      beschreibung: "Der Keller des Dezernats: Gitter, Regale, Asservatenkisten. Normalerweise der sicherste Ort der Stadt. Normalerweise.",
      aktionen: [
        { id: "depot_log", label: "Zugangslogs und Kameras auswerten",
          text: "Keine aufgebrochene Tür, kein zerschnittenes Gitter. Der ‚Einbruch‘ kam mit einem gültigen Code durch den Haupteingang, um 03:12 Uhr, exakt in der Lücke zwischen zwei Streifen, exakt im toten Winkel der einen defekten Kamera.\n\nDu öffnest das Log, und da steht es, schwarz auf grau:\nZUGANG GEWÄHRT – KENNUNG: D. ROTH.",
          clues: ["c3_depot_log"],

        { id: "depot_fehlt", label: "Prüfen, was fehlt",
          text: (H) => {
            let t = "Die Inventarliste ist schnell abgeglichen, und sie tut weh: Das Grimoire der Grauen Weide – fort.";

            else if (H.flag("f2_usb_privat")) t += "\n\nDein erster Gedanke rast zu Marlenes Material – dann atmest du aus: Das Original liegt nicht hier. Es liegt da, wo nur du es findest. Deine Paranoia war keine. Sie war Weitsicht.";
            else if (H.flag("f2_story_veroeffentlicht")) t += "\n\nMarlenes Material suchten sie vermutlich auch – vergebens: Es steht längst gedruckt in hunderttausend Briefkästen. Manche Beweise kann man nicht mehr stehlen. Nur noch dementieren.";

    {

  beimStart(api) {
    api.log("Fall 3 angenommen: Henrike Stein tot in der Weidenbibliothek – inmitten eines Dämonenkreises, der zu perfekt aussieht.");
