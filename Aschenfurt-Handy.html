        { id: "offenbarung", label: "Die Stadt erfährt von ihrer Nachtseite – kontrolliert, aber unumkehrbar" },
      ],
      kernbeweise: ["c3_chimaera", "cf_phase3", "cf_akte", "c2_usb", "c2_auftrag", "c2_heim", "if_drei_faelle"],
      fehlbeweise: [],

      bewerten(H, e) {
        const p = beweisStaerke(H);
        const verb = verbuendete(H);
        const v = verb.length;
        const istAnwalt = H.beruf("anwalt");
        const gerSchwelle = istAnwalt ? 6 : 7;

        // ---------- WEG 1: WAHRHEIT ----------
        if (e.taeter === "wahrheit") {
          const presseOk = H.ruf("presse") >= 15 || H.flag("f2_story_veroeffentlicht");
          if (p >= 6 && presseOk) {
            const ohneKrieg = v >= 3;
            return { rang: "perfekt", rangName: ohneKrieg ? "Die Wahrheit – und die Stadt hält stand" : "Die Wahrheit – um jeden Preis",
              text: "Du gibst Carla Iben alles. ALLES.\n\nDer Bote druckt sieben Tage in Folge: die Lieferlisten, St. Hedwig, die Basar-Schecks, CHIMÄRA Phase 1 bis 3" + (H.flag("f3_david_kronzeuge") ? ", Davids Aussage" : "") + (H.flag("fin_sasse_aussage") ? ", Sasses Geständnis aus der JVA" : "") + ". Andere Medien ziehen nach, dann die internationalen. Am vierten Tag platzen die ersten Förderverträge, am fünften durchsucht die Staatsanwaltschaft den Campus, am sechsten tritt der halbe Stadtrat zurück.\n\nAm siebten Tag wird Konstantin Morgenstern beim Versuch, die Stadt im Privatjet zu verlassen, festgenommen. Das Foto – der Mäzen zwischen zwei Beamten, im Hintergrund sein eigenes Klinik-Logo – wird das Bild des Jahrzehnts.\n\n"
                + (ohneKrieg
                  ? "Und die Stadt? Die Stadt taumelt – und fängt sich. Weil DU vorgearbeitet hast: Konvent, Rudel, Zirkel und Orden treten gemeinsam vor die Kameras, dein Werk aus drei Fällen Vertrauensarbeit. Der Pakt der Stillen Stadt wird nicht zerrissen – er wird zum ersten Mal seit 1962 NEU verhandelt, mit allen am Tisch. Es ist chaotisch, es ist laut, es ist demokratisch. Es ist ein Anfang."
                  : "Und die Stadt? Die Stadt brennt – nicht aus Feuer, aus Angst. Die Enthüllung reißt auch den Pakt mit ans Licht, und du hattest zu wenige Verbündete, um den Sturz abzufedern. Hamsterkäufe, Demos, zwei Brandsätze gegen hexennahe Läden, der Konvent riegelt seine Häuser ab. Es wird Monate dauern, vielleicht Jahre, bis aus der Panik ein neues Gleichgewicht wächst. Du hast der Stadt die Wahrheit gegeben – und ihr den Schlaf genommen. Beides war deine Entscheidung."),
              tu: (api) => {
                api.wert("finale_ausgang", ohneKrieg ? "wahrheit_stabil" : "wahrheit_chaos");
                api.flag("morgenstern_gestuerzt");
                api.log("FINALE: Die Wahrheit wurde veröffentlicht – Morgenstern ist gestürzt. " + (ohneKrieg ? "Die Fraktionen tragen die Stadt durch den Sturm." : "Die Stadt zahlt einen hohen Preis an Angst und Unruhe."));
              } };
          }
          return { rang: "falsch", rangName: "Die verbrannte Wahrheit", endgueltig: true,
            text: "Du gehst an die Öffentlichkeit – mit dem, was du hast. Es ist nicht genug.\n\n" + (presseOk ? "Die Story erscheint, aber die Beweisdecke ist zu dünn: " : "Keine Redaktion mit Reichweite traut sich an das Material, und die Beweisdecke ist zu dünn: ") + "Die Stiftung antwortet noch am selben Tag – mit vierzig Anwälten, drei Gegengutachten und einer Kampagne, die dich zerlegt: der Ermittler mit der Vergangenheit, die fragwürdigen Methoden, die ‚okkulten Verschwörungstheorien‘. Einstweilige Verfügungen fallen wie Hagel.\n\nNach zwei Wochen bist du suspendiert und die Geschichte ist tot – schlimmer: Sie ist IMMUNISIERT. Jeder künftige Vorwurf gegen Morgenstern wird jetzt als ‚die alte Verschwörungstheorie‘ abgewunken. Phase 3 startet pünktlich vor der Wahl.\n\nManchmal ist die Wahrheit nicht genug. Manchmal braucht sie Munition. Du hattest sie nicht.",
            tu: (api) => {
              api.wert("finale_ausgang", "preis");
              api.flag("morgenstern_gewonnen");
              api.log("FINALE: Die Veröffentlichung scheiterte an der dünnen Beweislage – Morgenstern hat gewonnen.");
            } };
        }

        // ---------- WEG 2: GERECHTIGKEIT ----------
        if (e.taeter === "gerechtigkeit") {
          const zeugenOk = H.flag("f3_david_kronzeuge") || H.flag("f3_aaron_verhaftet") || H.flag("fin_sasse_aussage") || H.flag("f3_ivy_gerettet");
          if (p >= gerSchwelle && v >= 2 && zeugenOk) {
            return { rang: "perfekt", rangName: "Die saubere Klinge",
              text: "Kein Blitzlicht. Keine Schlagzeile. Nur Akten – und sie sind makellos" + (istAnwalt ? " (du hast jedes Blatt selbst auf Gerichtsfestigkeit geprüft – die alte Staatsanwalts-Schule)" : "") + ".\n\nDie Staatsanwaltschaft übernimmt deine Kette: " + [
                  H.hat("c3_chimaera") ? "das CHIMÄRA-Dokument" : null,
                  H.flag("f3_david_kronzeuge") ? "Davids Kronzeugen-Aussage" : null,
                  H.flag("fin_sasse_aussage") ? "Sasses Geständnis" : null,
                  H.flag("f3_ivy_gerettet") ? "Ivys Protokoll" : null,
                  H.flag("f3_aaron_verhaftet") ? "Veys Auftragskette" : null,
                  H.hat("c2_auftrag") ? "die Geldspur aus dem Basar" : null,
                ].filter(Boolean).join(", ") + ". Parallel machen deine Verbündeten still Druck: " + verb.slice(0, 3).map(f => ({ polizei: "Ada hält das Dezernat geschlossen", vampire: "der Konvent friert Stiftungskonten in seinen Banken ein", werwoelfe: "das Rudel sichert Zeugen", hexen: "der Zirkel versiegelt die Labore magisch", jaeger: "der Orden öffnet seine Archive", unterwelt: "der Basar liefert die letzten Geldspuren", presse: "der Bote hält die Geschichte zurück – als Damoklesschwert" }[f])).join("; ") + ".\n\nDer Prozess dauert vierzehn Monate und endet mit dem Satz, auf den drei Tote gewartet haben: ‚Der Angeklagte wird zu lebenslanger Freiheitsstrafe verurteilt.‘ Anstiftung in drei Fällen. CHIMÄRA wird abgewickelt, die Stiftung zerschlagen, die Kliniken in eine öffentliche Trägerschaft überführt – sie heilen jetzt einfach nur noch.\n\nDie Stadt hat nie erfahren, wie nah sie am Abgrund stand. Vielleicht ist das die höchste Form von Gerechtigkeit: die, die niemand bemerkt.",
              tu: (api) => {
                api.wert("finale_ausgang", "gerechtigkeit");
                api.flag("morgenstern_gestuerzt"); api.flag("morgenstern_verurteilt");
                api.log("FINALE: Morgenstern wurde in einem sauberen Prozess verurteilt – die Stadt blieb ruhig, die Gerechtigkeit hat gesiegt.");
              } };
          }
          return { rang: "falsch", rangName: "Der Prozess, der keiner wurde", endgueltig: true,
            text: "Du gehst den Rechtsweg – und der Rechtsweg gehört ihm.\n\n" + (p < gerSchwelle ? "Deine Beweiskette hat Lücken, und die Verteidigung findet jede einzelne: " : "") + (v < 2 ? "Dir fehlen die Verbündeten, die Zeugen schützen und Druck aufbauen könnten. " : "") + (zeugenOk ? "" : "Und dir fehlt der eine Mensch, der vor Gericht aussagt – Papier klagt nicht an, Menschen tun es. ") + "Das Hauptverfahren wird gar nicht erst eröffnet: ‚kein hinreichender Tatverdacht‘. Drei Monate später bekommt der zuständige Oberstaatsanwalt einen Lehrstuhl – gestiftet, natürlich.\n\nDann beginnt die Gegenrechnung: Dienstaufsichtsbeschwerden gegen dich, eine Razzia im Dezernat, Adas Versetzung ‚aus strukturellen Gründen‘" + (v >= 1 && Math.max(H.ruf("vampire"), H.ruf("werwoelfe"), H.ruf("hexen"), H.ruf("jaeger"), H.ruf("unterwelt")) >= 30 ? " – und dann, eines Nachts, steht ein Bote vor deiner Tür: Eine Fraktion, bei der dein Name etwas gilt, bietet dir Schutz an. Du verschwindest aus den Registern der Stadt und tauchst in ihren Schatten wieder auf. Die Polizei hat dich fallen gelassen. Die Nachtseite nicht" : ". Am Ende sitzt du vor einem leeren Schreibtisch und einem Karton mit deinen Sachen") + ".\n\nPhase 3 startet pünktlich. Mit Genehmigung.",
            tu: (api) => {
              api.wert("finale_ausgang", "preis");
              api.flag("morgenstern_gewonnen");
              if (Math.max(H.ruf("vampire"), H.ruf("werwoelfe"), H.ruf("hexen"), H.ruf("jaeger"), H.ruf("unterwelt")) >= 30) api.flag("fraktion_schutz");
              api.log("FINALE: Der Prozess scheiterte – Morgenstern hat gewonnen" + (H.flag("fraktion_schutz") ? ", aber eine Fraktion hat dich unter ihren Schutz gestellt." : "."));
            } };
        }

        // ---------- WEG 3: FRIEDEN ----------
        return { rang: "gut", rangName: "Der Pakt der zwei Übel",
          text: "Du gehst zurück in den Westflügel. Morgenstern wartet, als hätte die Standuhr es ihm gesagt.\n\nDie Verhandlung dauert vier Stunden, und du holst heraus, was herauszuholen ist" + (p >= 6 ? " – und mit deiner Beweisstärke im Rücken ist das VIEL. Er weiß genau, was du in der Hinterhand hast, und es macht ihn nachgiebig" : ", auch wenn deine dünne Beweislage dir wenig Hebel lässt") + ":\n\n• CHIMÄRA wird eingestellt – verifizierbar: Mira Vogel und Pater Elias erhalten Inspektionsrechte in den Laboren, auf Lebenszeit.\n• Das Grimoire " + (H.flag("f3_grimoire_gesichert") ? "bleibt beim Zirkel – er bestätigt den Verzicht schriftlich" : "wird dem Zirkel zurückgegeben, vollständig, mit allen Kopien") + ".\n• Die Familien von Jonas Brandt, Marlene Voss und Henrike Stein werden versorgt – großzügig, dauerhaft, ohne dass sie je erfahren, von wem.\n• Hanna Roths Behandlung wird bedingungslos: kein ‚widerruflich‘ mehr, in keinem Vertrag.\n• Und niemand – NIEMAND – rührt je wieder einen Zeugen an. Du hast eine Kopie von allem hinterlegt, an Orten, die er nicht findet. Er glaubt dir. Männer wie er erkennen eine echte Versicherung.\n\nDafür: dein Schweigen. Die Akten wandern ins Archiv, die Wahrheit in deinen Nacken, wo sie wohnen bleibt.\n\nAls du gehst, sagt er: „Sie hätten ein hervorragender Geschäftsmann werden können.“ Es ist das Grausamste, was er hätte sagen können. Er weiß das.\n\nDie Stadt schläft weiter. Die Morde bleiben offiziell, was sie waren: ein Tierangriff, ein Vampirgerücht, ein Ritualunfall. Nur du weißt es besser – jeden Morgen beim Aufwachen ein bisschen lauter.",
          tu: (api) => {
            const istKodexBruch = ["wahrheit", "gesetz"].includes(H.kodex());
            api.wert("finale_ausgang", "frieden");
            api.flag("morgenstern_deal");
            if (istKodexBruch) Engine.kodexCheck([H.kodex()], null);
            api.log("FINALE: Der Deal – CHIMÄRA eingestellt, die Opferfamilien versorgt, die Wahrheit begraben. Die Stadt schläft weiter.");
          } };
      },
    },

    /* ---------------- Epilog: dynamisch aus allen Entscheidungen ---------------- */
    epilog(H) {
      const s = H.s;
      const ausgang = H.wert("finale_ausgang") || "preis";
      const teile = [];

      // ----- Menschen -----
      const m = [];
      // Ada
      if (ausgang === "preis" && !H.flag("fraktion_schutz")) m.push("<b>Ada Krieger</b> wird ‚aus strukturellen Gründen‘ in die Verkehrsbehörde versetzt. Sie nimmt drei Kartons und keinen einzigen Abschiedskaffee mit. Bei eurem letzten Gespräch sagt sie nur: „Wir hatten recht. Merk dir das. Irgendwann zählt es wieder.“");
      else if (H.npc("ada", "vertrauen") >= 75) m.push("<b>Ada Krieger</b> übernimmt die neu geschaffene Stabsstelle für übernatürliche Ermittlungen – mit echtem Budget. Ihr erster Personalvorschlag trägt deinen Namen. ‚Der Kaffeeautomat bleibt‘, sagt sie. ‚Er hat als Einziger nie gelogen.‘");
      else m.push("<b>Ada Krieger</b> leitet das Dezernat 13 weiter – müde, unbestechlich, unkaputtbar. Ihr Verhältnis zu dir bleibt, was es war: Arbeitsbeziehung mit Narben.");
      // David
      if (H.flag("f3_david_kronzeuge")) m.push("<b>David Roth</b> verlässt den Polizeidienst – freiwillig. Er arbeitet heute im Opferschutz und besucht Hanna jeden Sonntag in der Uniklinik; die Behandlung schlägt an. Einmal im Monat liegt ein Brief in deinem Fach: kein Absender, immer derselbe erste Satz. ‚Danke, dass du gefragt hast, warum.‘");
      else if (H.flag("f3_david_verhaftet_fair")) m.push("<b>David Roth</b> bekommt zwei Jahre auf Bewährung – das Gericht erkennt die Erpressung an. Hanna wird in der Uniklinik weiterbehandelt. Er grüßt dich auf der Straße, und es ist kompliziert, aber es ist ein Gruß.");
      else if (H.flag("f3_david_sofort_gemeldet")) m.push("<b>David Roth</b> sitzt seine Strafe ab, ohne je ausgesagt zu haben. Hanna wurde aus dem Morgenstern-Programm ‚entlassen‘; eine Stiftungsklausel, gegen die niemand klagte, weil niemand fragte. Manchmal, nachts, rechnest du nach, was fünf Minuten Zuhören gekostet hätten.");
      else m.push("<b>David Roth</b> – der Maulwurf im Dezernat wurde nie restlos aufgearbeitet. Er hat den Dienst still quittiert und die Stadt verlassen. Manche Akten schließen sich nie, sie werden nur leiser.");
      // Pix
      if (H.flag("pix_weg")) m.push("<b>Pix</b> ist verschwunden geblieben. Der Stand im Basar gehört jetzt einem Schweigsamen, der bei deinem Namen die Ware wegräumt. Im Basar verjähren Schulden nicht – deine an Pix auch nicht.");
      else if (H.flag("pix_gefallen_eingeloest")) m.push("<b>Pix</b> führt den Stand weiter, der Neffe macht eine Lehre als Elektriker (‚LEGALE Leitungen, Schätzchen, stell dir vor‘). Über dich sagt Pix unten nur einen Satz, und er ist im Basar mehr wert als Gold: ‚Der hält Wort.‘");
      else if (H.flag("pix_gefallen_verweigert")) m.push("<b>Pix</b> macht weiter Geschäfte – nur nicht mit dir. Dein Name steht unten auf der Liste der Leute, deren Wort nichts wiegt. Es ist eine kurze Liste. Man arbeitet hart, um draufzukommen.");
      else m.push("<b>Pix</b> handelt weiter mit allem, was leise ist. Ab und zu landet ein nützlicher Zettel in deiner Tasche, von dem niemand weiß, wie er da hinkam. Der Basar vergisst nichts – auch das Gute nicht.");
      // Lucian / Konvent
      if (H.flag("f2_konvent_krise")) m.push("<b>Lucian Adler</b> spricht nicht mehr mit dir. Der Konvent hat die Zusammenarbeit mit der Stadt auf das vertragliche Minimum reduziert – höflich, kalt, gletschergleich. Du hast erlebt, wie lange Vampire brauchen, um zu verzeihen: länger.");
      else if (H.flag("f2_lucian_entlastet_frueh") || H.npc("lucian", "vertrauen") >= 60) m.push("<b>Lucian Adler</b> lässt dir zweimal im Jahr eine Einladung zukommen – Konzilsempfang, Ehrenplatz. Du bist der erste Sterbliche seit 1974 mit stehender Einladung. ‚Der Konvent vergisst Gerechte nicht‘, steht jedes Mal darunter. Du beginnst zu glauben, dass es stimmt.");
      else m.push("<b>Lucian Adler</b> und der Konvent halten die Verträge – nicht mehr, nicht weniger. Die Nacht bleibt höflich. Höflichkeit, hast du gelernt, ist bei Vampiren eine Temperaturangabe.");
      // Runa / Bruno
      if (H.flag("f1_bruno_verhaftet")) m.push("<b>Bruno Falk</b> wurde entlastet, aber die Zelle bei Vollmond hat etwas in ihm verschoben. Er und <b>Lena</b> haben die Stadt verlassen – das Rudel hat ihn ziehen lassen, was bei Wölfen das traurigste aller Geschenke ist. <b>Runa</b> nickt dir nicht mehr zu.");
      else if (H.flag("f1_lena_versprechen")) m.push("<b>Bruno Falk</b> hat dem Rudel von Lena erzählt – selbst, aufrecht, an einem Vollmondabend. Es gab Geheul, im Wortsinn, und dann gab es ein Rudel, das eine Menschin zum Essen einlud (zum ESSEN, nicht ALS Essen, wie Runa präzisierte). Dein gehaltenes Versprechen hat ihm den Mut geliehen. <b>Runa</b> nennt dich seither ‚Stadtmensch‘ in einem Ton, der fast ein Kompliment ist.");
      else if (H.ruf("werwoelfe") >= 20) m.push("<b>Runa</b> und das Rudel halten die Heide – und halten zu dir. An deinem Briefkasten hängt manchmal Wildschinken. Du fragst nicht, du bedankst dich bei der Heide insgesamt. So will es die Form.");
      else m.push("Das <b>Rudel</b> bleibt, was es immer war: wachsam, wortkarg, mit langem Gedächtnis. Die Heide grüßt dich nicht. Sie beißt dich aber auch nicht. In Aschenfurt nennt man das Frieden.");
      // Mira / Ivy / Zirkel
      if (H.flag("f3_ivy_geopfert")) m.push("<b>Ivy</b> sitzt ihre Strafe ab. <b>Mira Vogel</b> hat die Bibliothek übernommen und dir Hausverbot erteilt – das erste seit 1953, wie sie dir schriftlich mitteilte. Der Zirkel hat ein neues Sprichwort: ‚Der Stadt vertrauen heißt der Kreide im Regen vertrauen.‘");
      else if (H.flag("f3_ivy_gerettet")) m.push("<b>Ivy</b> ist heute registrierte Blutmagierin unter Miras Aufsicht – und das jüngste Mitglied, das je in den Rat des Zirkels gewählt wurde. Ihre Antrittsrede bestand aus einem Satz: ‚Henrike hat mich aufgenommen, als keiner mich wollte – das ist jetzt mein Job.‘ <b>Mira Vogel</b> führt die Bibliothek" + (H.flag("f3_grimoire_gesichert") ? ", das Grimoire liegt wieder im Schrein, bewacht von sieben Schwestern" : "") + ". Dein Platz am Lesetisch ist dauerhaft reserviert.");
      else m.push("<b>Mira Vogel</b> führt die Weidenbibliothek in Henrikes Geist weiter. <b>Ivy</b> lebt mit den Folgen ihrer Nacht – wie alle in dieser Geschichte. Der Zirkel und du: Es bleibt ein vorsichtiges Nebeneinander.");
      // Elias
      if (H.npc("elias", "respekt") >= 50 || H.flag("f3_aaron_verhaftet")) m.push("<b>Pater Elias</b> hat die Waffenkammer ein letztes Mal katalogisiert und abgeschlossen. ‚Die Stadt hat jetzt einen besseren Jäger‘, hat er dabei gesagt, ‚er jagt mit Akten.‘ Sonntags spielt er Schach gegen Mira Vogel. Es steht 34:34, und beide schummeln.");
      else m.push("<b>Pater Elias</b> hält weiter Wache über Dinge, die offiziell nicht existieren. Der Orden bleibt, was er war: leise. Du weißt jetzt, dass leise nicht harmlos heißt.");
      // Selene
      if (H.flag("selene_freundin")) m.push("<b>Dr. Selene Marek</b> schreibt ihre Berichte für dich weiterhin ‚in verständlichem Deutsch‘ und hat dir zum Abschluss des Falls ein Geschenk gemacht: einen Briefbeschwerer in Broschenform. ‚Für den Schreibtisch. Als Erinnerung daran, dass man manchmal Dinge zerschlagen muss, damit Wahrheit rauskommt.‘");
      else m.push("<b>Dr. Selene Marek</b> seziert weiter die ehrlichsten Zeugen der Stadt und kommentiert die Lebenden mit trockenem Latein. Manche Konstanten braucht eine Stadt.");
      // Carla
      if (H.wert("f2_ergebnis") === "falsch_carla") m.push("<b>Carla Iben</b> hat eine fünfteilige Serie über Ermittlungsfehler des Dezernats geschrieben. Sie ist fair, gründlich und vernichtend. Du kommst in Teil zwei vor. Und drei. Und fünf.");
      else if (H.flag("f2_story_veroeffentlicht")) m.push("<b>Carla Iben</b> nimmt den großen Journalistenpreis des Jahres entgegen – im Namen von Marlene Voss, deren Foto sie aufs Podium stellt. Ihre Dankesrede: ‚Diese Geschichte hat zwei Autorinnen. Eine konnte heute nicht kommen.‘ Es gibt keine trockenen Augen im Saal, und der Bote ist zum ersten Mal seit Jahren schuldenfrei.");
      else m.push("<b>Carla Iben</b> führt den Boten weiter – kritischer, wacher, ohne Stiftungsanzeigen. Auf Marlenes altem Schreibtisch steht frischer Kaffee. Jeden Tag. Niemand stellt die Tasse weg.");
      // Sasse
      if (H.flag("fin_sasse_aussage")) m.push("<b>Elif Sasse</b> sagte aus und bekam acht Jahre statt lebenslang. In ihrer letzten Vernehmung sagte sie einen Satz, der dir bleibt: ‚Jonas hat nachgezählt, und ich habe nachgegeben. Zwischen diesen beiden Wörtern liegt mein ganzes Leben.‘");
      else if (H.flag("f1_sasse_verhaftet")) m.push("<b>Elif Sasse</b> verbüßt lebenslang und schweigt bis heute – wessen Schweigen sie hütet und was es sie kostet, bleibt ihr Geheimnis.");
      else if (H.flag("f1_sasse_frei")) m.push("<b>Elif Sasse</b> wurde nie gefasst. Vor einem Jahr kam eine Postkarte ohne Absender aus Lissabon: ‚Manche Schulden zahlt man, indem man verschwindet.‘ Du hast sie nicht weitergeleitet. Du weißt selbst nicht genau, warum.");

      // ----- Hauptausgang / Stadt -----
      let stadt = "";
      if (ausgang === "gerechtigkeit") stadt = "Die Stadt hat nie erfahren, wie nah sie am Abgrund stand. Der Pakt der Stillen Stadt hält – geflickt, aber er hält. In den Statistiken war es ein Jahr wie jedes andere. Nur du und eine Handvoll Leute wissen, dass genau das der Sieg war.";
      else if (ausgang === "wahrheit_stabil") stadt = "Aschenfurt ist jetzt die erste Stadt Europas, die offiziell mit ihrer Nachtseite lebt. Es ist laut, chaotisch und voller Ausschüsse – Vampire in Bürgerversammlungen, ein Werwolf im Stadtrat, Talkshows über Schwellenweihen. Aber die Brandnächte, vor denen alle warnten, kamen nie. Weil die Wahrheit ein Fundament hatte: deines.";
      else if (ausgang === "wahrheit_chaos") stadt = "Aschenfurt lernt seine Nachtseite kennen – auf die harte Art. Die ersten Monate: Angst, Auszüge, zerbrochene Scheiben. Dann, langsam, das Gewöhnen. Die Wahrheit hat die Stadt teuer zu stehen kommen lassen, aber sie war nie wieder käuflich. Vielleicht war das der Punkt.";
      else if (ausgang === "frieden") stadt = "Die Stadt schläft weiter, und ihr Schlaf ist jetzt tatsächlich sicherer – CHIMÄRA ist tot, die Inspektionen greifen, die Familien sind versorgt. Es ist objektiv das friedlichste aller Enden. Du wiederholst dir das manchmal vor, nachts, wenn die Akten im Archiv zu atmen scheinen. Frieden, hast du gelernt, ist nicht das Gegenteil von Krieg. Es ist das Gegenteil von Antwort.";
      else if (H.flag("fraktion_schutz")) stadt = "Morgenstern hat gewonnen – die Stadt gehört ihm, höflicher und gründlicher als je zuvor. Dich gibt es offiziell nicht mehr: Du lebst und arbeitest in den Schatten der Fraktion, die dich aufnahm, und löst Fälle, die nie eine Akte bekommen. Die Nachtseite hat dich adoptiert. Es ist nicht das Leben, das du geplant hast. Es ist trotzdem eines, in dem du morgens in den Spiegel sehen kannst – du, im Gegensatz zu manch anderem darin.";
      else stadt = "Morgenstern hat gewonnen. Phase 3 läuft, die Wahl ist entschieden, die Stadt dankt ihrem größten Wohltäter. Du bist raus – suspendiert, diskreditiert, katalogisiert. Aber du lebst, du erinnerst dich, und in einem Versteck, das niemand kennt, liegt eine Kopie von allem. Standuhren laufen genau, hast du gelernt. Aber sie laufen nicht ewig. Niemand weiß das besser als ihre Besitzer.";

      // ----- Geheimnis-Auflösung -----
      const g = H.geheimnis();
      let geheimnis = "";
      const gewonnen = (ausgang === "gerechtigkeit" || ausgang === "wahrheit_stabil" || ausgang === "wahrheit_chaos");

      else if (s.kodexVerstoesse <= 1) kodex += "hat Beulen, aber er trägt noch. Einmal" + (s.kodexVerstoesse === 1 ? " hast du ihn gebogen" : "") + ", und du weißt noch genau, wann. Vielleicht ist das die ehrlichste Form von Prinzipien: welche, an deren Bruchstellen man sich erinnert.";
      else kodex += "liegt in Scherben, und du weißt es. " + s.kodexVerstoesse + " Mal hast du gegen das gehandelt, was du am Anfang über dich geglaubt hast. Die Frage, die bleibt: War der Kodex falsch – oder warst du es? Die Stadt hat dir die Antwort nicht gegeben. Städte tun das nie. Sie stellen nur die Rechnung aus.";

      const bilanz = "Hinweise gefunden: " + s.statistik.clues + " · Schlussfolgerungen: " + s.statistik.insights + " · Verhörfragen: " + s.statistik.verhoere + " · Ermittlungsschritte: " + s.schritte
        + "<br>Fall 1: " + ({ perfekt: "lückenlos gelöst", gut: "gelöst", wackelig: "richtig geraten, schwach belegt", falsch_bruno: "Fehlurteil (Bruno)", falsch_viktor: "Fehlurteil (Viktor)", falsch_jaeger: "ungelöst" }[H.wert("f1_ergebnis")] || "–")
        + " · Fall 2: " + ({ perfekt: "lückenlos gelöst", gut: "gelöst", wackelig: "richtig geraten, unbewiesen", falsch_lucian: "Fehlurteil (Lucian)", falsch_carla: "Fehlurteil (Carla)", falsch_tobias: "Fehlurteil (Tobias)" }[H.wert("f2_ergebnis")] || "–")
        + " · Fall 3: " + ({ perfekt: "lückenlos gelöst", gut: "gelöst, mit Lücken", wackelig: "Täter entkam", falsch_ivy: "Fehlurteil (Ivy)", falsch_elias: "Fehlurteil (Elias)", falsch_daemon: "‚Dämon‘ – Fall vertuscht" }[H.wert("f3_ergebnis")] || "–");

/* ===== js/engine.js ===== */
/* ============================================================
   engine.js – State-Layer, Storylets, Konsequenzen, Speicherstände
   ------------------------------------------------------------
   Architektur:
   - Canon-Layer  : feste Fallwahrheiten in den data_*.js-Dateien
   - State-Layer  : Engine.s (serialisierbar, Speicherstände)
   - Drama-Layer  : Storylets (wenn/dann), vorbereitete Konsequenzen
   - Validation   : Inhalte sind ausschließlich autorisiert (keine
                    erfundenen Beweise möglich); Bedingungen prüfen,
                    dass NPCs nur sagen, was sie wissen können.
   ============================================================ */
"use strict";

const Engine = {
  s: null,            // aktueller Spielzustand
  _toastFn: null,     // von UI gesetzt
  _renderFn: null,

  /* ---------------- Neues Spiel ---------------- */
  neuesSpiel(charakter) {
    const s = {
      version: 1,
      erstellt: Date.now(),
      charakter,                 // {name, beruf, geheimnis, kodex, schwierigkeit}
      kapitel: "fall1",
      phase: "ermittlung",       // ermittlung | abgeschlossen | spielende
      schritte: 0,
      flags: {},                 // name -> schritt (wann gesetzt)
      werte: {},                 // name -> beliebiger serialisierbarer Wert
      clues: {},                 // clueId -> schritt
      insights: {},              // insightId -> schritt
      verbindungenVersucht: 0,
      ruf: { polizei: 10, vampire: 0, werwoelfe: 0, hexen: 0, jaeger: 0, unterwelt: 0, presse: 0, stadt: 0, konzern: 0 },
      npc: {},                   // id -> {vertrauen, angst, respekt, zuneigung, memory:[], druck, blockiert}
      chats: {},                 // chatId -> {nachrichten:[], ungelesen, pending:{seq,idx}|null}
      verhoerLog: {},            // npcId -> {log:[], gefragt:{}, gezeigt:{}, druck}
      timelineExtra: [],         // dynamische Timeline-Einträge
      theorien: {},              // fallId -> {versuche, ergebnis, rang}
      fragen: {},                // id -> {text, offen, schritt}
      log: [],                   // [{kapitel, text, schritt}]
      kodexVerstoesse: 0,
      kodexTreue: 0,
      hinweiseGenutzt: {},       // fallId -> stufe (0-5)
      ortAktionen: {},           // "fallId/ortId/aktionId" -> true
      statistik: { clues: 0, insights: 0, verhoere: 0, suchen: 0 },
    };
    this.s = s;
    // NPC-Grundwerte aus Daten
    for (const [id, n] of Object.entries(GameData.npcs.personen)) {
      s.npc[id] = Object.assign({ vertrauen: 50, angst: 10, respekt: 30, zuneigung: 20, memory: [], druck: 0, blockiert: false },
        U.kopie(n.startwerte || {}));
    }
    // Berufs-/Geheimnis-Startfolgen
    const beruf = GameData.welt.berufe.find(b => b.id === charakter.beruf);
    if (beruf && beruf.startRuf) for (const [f, v] of Object.entries(beruf.startRuf)) s.ruf[f] += v;
    this.starteKapitel("fall1", true);
  },

  fall() { return GameData.cases[this.s.kapitel]; },

  starteKapitel(id, ohneSnapshotLaden) {
    const s = this.s;
    s.kapitel = id;
    s.phase = "ermittlung";
    s.flags["kap_" + id] = s.schritte;
    // Snapshot für „Kapitel neu starten“
    try { localStorage.setItem("af_snap_" + id, JSON.stringify(s)); } catch (e) {}
    const fall = GameData.cases[id];
    if (fall && fall.beimStart) fall.beimStart(this.api());
    this.tick();
    this.autosave();
  },

  kapitelNeustart() {
    const raw = localStorage.getItem("af_snap_" + this.s.kapitel);
    if (raw) { this.s = JSON.parse(raw); this.autosave(); return true; }
    return false;
  },

  /* ---------------- Hilfen / Bedingungs-Kontext ---------------- */
  H() {
    const s = this.s;
    return {
      s,
      hat: (c) => !!s.clues[c],
      insight: (i) => !!s.insights[i],
      flag: (f) => s.flags[f] !== undefined,
      flagAlter: (f) => (s.flags[f] === undefined ? -1 : s.schritte - s.flags[f]),
      wert: (k) => s.werte[k],
      ruf: (f) => s.ruf[f] ?? 0,
      npc: (id, feld) => (s.npc[id] ? s.npc[id][feld] : 0),
      kapitel: () => s.kapitel,
      kapitelAlter: () => s.schritte - (s.flags["kap_" + s.kapitel] ?? 0),
      phase: () => s.phase,
      beruf: (b) => (b ? s.charakter.beruf === b : s.charakter.beruf),
      geheimnis: (g) => (g ? s.charakter.geheimnis === g : s.charakter.geheimnis),
      kodex: (k) => (k ? s.charakter.kodex === k : s.charakter.kodex),
      schwierigkeit: () => s.charakter.schwierigkeit,
      theorie: (fallId) => s.theorien[fallId],
    };
  },

  /* ---------------- Wirkungs-API (für Storylets & Inhalte) ---------------- */
  api() {
    const s = this.s;
    const eng = this;
    return {
      s,
      flag(name, wert) { if (s.flags[name] === undefined) s.flags[name] = s.schritte; if (wert !== undefined) s.werte[name] = wert; },
      flagWeg(name) { delete s.flags[name]; },
      wert(name, v) { s.werte[name] = v; },
      clue(id, leise) {
        if (s.clues[id]) return false;
        s.clues[id] = s.schritte; s.statistik.clues++;
        if (s.flags["clue_" + id] === undefined) s.flags["clue_" + id] = s.schritte;
        const c = eng.findeClue(id);
        if (!leise) eng.toast("🔍 Neuer Hinweis: <b>" + U.esc(c ? c.name : id) + "</b>");
        eng.autoScan();
        return true;
      },
      insight(id, leise) {
        if (s.insights[id]) return false;
        s.insights[id] = s.schritte; s.statistik.insights++;
        if (!leise) {
          const v = eng.findeInsight(id);
          eng.toast("🧩 Schlussfolgerung: <b>" + U.esc(v ? v.titel : id) + "</b>", "blau");
        }
        return true;
      },
      ruf(f, delta, leise) {
        s.ruf[f] = U.klemm((s.ruf[f] ?? 0) + delta, -100, 100);
        if (!leise && Math.abs(delta) >= 3) {
          const fr = GameData.welt.fraktionen.find(x => x.id === f);
          eng.toast((delta > 0 ? "▲ " : "▼ ") + U.esc(fr ? fr.name : f) + (delta > 0 ? " +" : " ") + delta, delta > 0 ? "blau" : "rot");
        }
      },
      npc(id, aenderungen) {
        const n = s.npc[id]; if (!n) return;
        for (const [feld, delta] of Object.entries(aenderungen)) {
          if (typeof n[feld] === "number") n[feld] = U.klemm(n[feld] + delta, 0, 100);
          else n[feld] = delta;
        }
      },
      erinnert(id, text) { if (s.npc[id]) s.npc[id].memory.push({ text, schritt: s.schritte, kapitel: s.kapitel }); },
      nachricht(chatId, von, text, extra) { eng.pushNachricht(chatId, von, text, extra); },
      sequenz(seqId) { eng.spieleSequenz(seqId); },
      timeline(zeit, sortier, text, quelle) { s.timelineExtra.push({ fall: s.kapitel, zeit, sortier, text, quelle }); },
      frage(id, text) { if (!s.fragen[id]) { s.fragen[id] = { text, offen: true, schritt: s.schritte }; } },
      frageWeg(id) { if (s.fragen[id]) s.fragen[id].offen = false; },
      log(text) { s.log.push({ kapitel: s.kapitel, text, schritt: s.schritte }); },
      toast(text, art) { eng.toast(text, art); },
      ortFrei(ortId) { s.flags["ort_" + s.kapitel + "_" + ortId] = s.schritte; },
      kodexCheck(gegen, fuer) { eng.kodexCheck(gegen, fuer); },
    };
  },

  kodexCheck(gegen, fuer) {
    const s = this.s, k = s.charakter.kodex;
    if (gegen && gegen.includes(k)) {
      s.kodexVerstoesse++;
      const kx = GameData.welt.kodizes.find(x => x.id === k);
      this.toast("⚖️ Das widerspricht deinem Kodex: <i>" + U.esc(kx.name) + "</i>", "rot");
    }
    if (fuer && fuer.includes(k)) s.kodexTreue++;
  },

  findeClue(id) {
    for (const f of Object.values(GameData.cases)) if (f.clues && f.clues[id]) return f.clues[id];
    return null;
  },
  findeInsight(id) {
    for (const f of Object.values(GameData.cases)) {
      for (const v of (f.verbindungen || [])) if (v.id === id) return v;
    }
    return null;
  },
  findeSequenz(id) {
    const fall = this.fall();
    if (fall && fall.sequenzen && fall.sequenzen[id]) return fall.sequenzen[id];
    for (const f of Object.values(GameData.cases)) if (f.sequenzen && f.sequenzen[id]) return f.sequenzen[id];
    if (GameData.npcs.sequenzen && GameData.npcs.sequenzen[id]) return GameData.npcs.sequenzen[id];
    return null;
  },

  /* ---------------- Chats / Sequenzen ---------------- */
  chat(chatId) {
    const s = this.s;
    if (!s.chats[chatId]) s.chats[chatId] = { nachrichten: [], ungelesen: 0, pendingSeq: null, warteschlange: [] };
    if (!s.chats[chatId].warteschlange) s.chats[chatId].warteschlange = [];
    return s.chats[chatId];
  },

  pushNachricht(chatId, von, text, extra) {
    const c = this.chat(chatId);
    const n = Object.assign({ von, text, schritt: this.s.schritte, zeit: U.zeitStempel(), markiert: false }, extra || {});
    c.nachrichten.push(n);
    if (von !== "ich") c.ungelesen++;
    if (this._renderFn) this._renderFn("nachricht", chatId);
  },

  spieleSequenz(seqId, abIndex) {
    const seq = this.findeSequenz(seqId);
    if (!seq) { console.warn("Sequenz fehlt:", seqId); return; }
    const chatId = seq.chat;
    const c = this.chat(chatId);
    // Wartet der Chat noch auf eine Spieler-Antwort, neue Sequenz in die Warteschlange
    if (abIndex === undefined && c.pendingSeq) { c.warteschlange.push(seqId); return; }
    let i = abIndex || 0;
    const H = this.H(), api = this.api();
    while (i < seq.schritte.length) {
      let st = seq.schritte[i];
      if (st.wenn) { st = st.wenn(H) ? { gruppe: st.dann || [] } : { gruppe: st.sonst || [] }; }
      if (st.gruppe) {
        for (const sub of st.gruppe) this._seqSchritt(chatId, sub, api);
        i++; continue;
      }
      if (st.wahl) { c.pendingSeq = { seq: seqId, idx: i }; break; }
      if (st.weiter) { this.spieleSequenz(st.weiter); return; }
      this._seqSchritt(chatId, st, api);
      i++;
    }
    // Sequenz beendet ohne offene Wahl → nächste wartende Sequenz abspielen
    if (!c.pendingSeq && c.warteschlange.length) {
      const naechste = c.warteschlange.shift();
      this.spieleSequenz(naechste);
    }
    if (this._renderFn) this._renderFn("nachricht", chatId);
    this.autosave();
  },

  _seqSchritt(chatId, st, api) {
    if (st.von) this.pushNachricht(chatId, st.von, st.text, st.anhang ? { anhang: st.anhang } : null);
    else if (st.system) this.pushNachricht(chatId, "system", st.system);
    else if (st.gedanke) this.pushNachricht(chatId, "gedanke", st.gedanke);
    else if (st.tu) st.tu(api);
    if (st.clue) api.clue(st.clue);
  },

  pendingWahl(chatId) {
    const c = this.chat(chatId);
    if (!c.pendingSeq) return null;
    const seq = this.findeSequenz(c.pendingSeq.seq);
    if (!seq) return null;
    const st = seq.schritte[c.pendingSeq.idx];
    if (!st || !st.wahl) return null;
    const H = this.H();
    const optionen = st.wahl.filter(o => !o.wenn || o.wenn(H));
    return { optionen, seqId: c.pendingSeq.seq, idx: c.pendingSeq.idx };
  },

  waehleOption(chatId, optIndex) {
    const p = this.pendingWahl(chatId);
    if (!p) return;
    const opt = p.optionen[optIndex];
    if (!opt) return;
    const c = this.chat(chatId);
    c.pendingSeq = null;
    this.pushNachricht(chatId, "ich", opt.label);
    if (opt.kodexGegen || opt.kodexFuer) this.kodexCheck(opt.kodexGegen, opt.kodexFuer);
    const api = this.api();
    if (opt.antwort) for (const st of opt.antwort) this._seqSchritt(chatId, st, api);
    if (opt.tu) opt.tu(api);
    this.aktion();
    if (opt.weiter) this.spieleSequenz(opt.weiter);
    else this.spieleSequenz(p.seqId, p.idx + 1);
  },

  /* ---------------- Orte / Tatort-Aktionen ---------------- */
  ortAktion(ortId, aktionId) {
    const fall = this.fall();
    const ort = (fall.orte || []).find(o => o.id === ortId);
    const akt = ort && ort.aktionen.find(a => a.id === aktionId);
    if (!akt) return null;
    const key = fall.id + "/" + ortId + "/" + aktionId;
    const schonGemacht = !!this.s.ortAktionen[key];
    this.s.ortAktionen[key] = true;
    const api = this.api(), H = this.H();
    let text = typeof akt.text === "function" ? akt.text(H) : akt.text;
    let extra = null;
    if (akt.beruf && akt.beruf[this.s.charakter.beruf]) {
      const b = akt.beruf[this.s.charakter.beruf];
      extra = typeof b === "function" ? b(H) : (b.text || b);
      if (b.clue && !schonGemacht) api.clue(b.clue);
    }
    if (!schonGemacht) {
      (akt.clues || []).forEach(cid => api.clue(cid));
      if (akt.tu) akt.tu(api);
      this.aktion();
    }
    return { text, extra, schonGemacht };
  },

  /* ---------------- Verhöre ---------------- */
  verhoer(npcId) {
    const s = this.s;
    if (!s.verhoerLog[npcId]) s.verhoerLog[npcId] = { log: [], gefragt: {}, gezeigt: {}, druck: 0 };
    return s.verhoerLog[npcId];
  },

  verhoerDef(npcId) {
    const fall = this.fall();
    return fall.verhoere ? fall.verhoere[npcId] : null;
  },

  vLog(npcId, von, text, ton) {
    this.verhoer(npcId).log.push({ von, text, ton: ton || null, schritt: this.s.schritte });
  },

  druckLimit(npcId) {
    const def = this.verhoerDef(npcId);
    let limit = (def && def.druckLimit) || 3;
    if (this.s.charakter.schwierigkeit === "story") limit += 2;
    if (this.s.charakter.schwierigkeit === "meister") limit -= 1;
    return Math.max(1, limit);
  },

  frageThema(npcId, themaId, ton) {
    const def = this.verhoerDef(npcId);
    const v = this.verhoer(npcId);
    const thema = def.themen.find(t => t.id === themaId);
    if (!thema) return;
    const H = this.H(), api = this.api();
    api.flag("verhoer_" + npcId + "_gefragt");
    this.vLog(npcId, "ich", "[" + (GameData.welt.tonNamen[ton] || ton) + "] " + thema.label, ton);
    let antwort = thema.antworten[ton] || thema.antworten.default;
    if (typeof antwort === "function") antwort = antwort(H);
    const text = typeof antwort === "string" ? antwort : antwort.text;
    this.vLog(npcId, npcId, typeof text === "function" ? text(H) : text);
    v.gefragt[themaId] = (v.gefragt[themaId] || 0) + 1;
    s_effekte: {
      const eff = (typeof antwort === "object" && antwort) ? antwort : null;
      if (eff) {
        if (eff.clue) api.clue(eff.clue);
        if (eff.insight) api.insight(eff.insight);
        if (eff.tu) eff.tu(api);
      }
    }
    // Tonwirkung auf NPC
    const n = this.s.npc[npcId];
    if (n) {
      if (ton === "druck") { n.angst = U.klemm(n.angst + 8, 0, 100); n.vertrauen = U.klemm(n.vertrauen - 5, 0, 100); v.druck++; }
      if (ton === "freundlich") { n.vertrauen = U.klemm(n.vertrauen + 3, 0, 100); }
      if (ton === "empathisch") { n.vertrauen = U.klemm(n.vertrauen + 4, 0, 100); n.zuneigung = U.klemm(n.zuneigung + 2, 0, 100); }
    }
    if (thema.tu) thema.tu(api, ton);
    if (v.druck >= this.druckLimit(npcId) && !v.blockiertGemeldet) {
      v.blockiertGemeldet = true;
      this.s.npc[npcId].blockiert = true;
      this.vLog(npcId, "system", (def.beiBlock || "Dein Gegenüber verschränkt die Arme. „Wir sind hier fertig.“ Das Gespräch ist vorerst beendet."));
      this.api().erinnert(npcId, "Du hast im Verhör massiv Druck gemacht.");
    }
    this.s.statistik.verhoere++;
    this.aktion();
  },

  zeigeBeweis(npcId, clueId) {
    const def = this.verhoerDef(npcId);
    const v = this.verhoer(npcId);
    const c = this.findeClue(clueId);
    this.vLog(npcId, "ich", "[Beweis vorgelegt] " + (c ? c.name : clueId));
    const H = this.H(), api = this.api();
    let r = def.beweisReaktionen && def.beweisReaktionen[clueId];
    if (r && r.braucht && !r.braucht.every(x => H.hat(x) || H.insight(x))) r = null;
    if (r) {
      let text = typeof r.text === "function" ? r.text(H) : r.text;
      this.vLog(npcId, npcId, text);
      v.gezeigt[clueId] = true;
      if (r.clue) api.clue(r.clue);
      if (r.insight) api.insight(r.insight);
      if (r.tu) r.tu(api);
    } else {
      const std = def.beweisStandard || "Ein Schulterzucken. „Und was soll mir das sagen?“";
      this.vLog(npcId, npcId, typeof std === "function" ? std(H) : std);
    }
    this.aktion();
  },

  konfrontiere(npcId, insightId) {
    const def = this.verhoerDef(npcId);
    const v = this.verhoer(npcId);
    const ins = this.findeInsight(insightId);
    this.vLog(npcId, "ich", "[Widerspruch vorgehalten] " + (ins ? ins.titel : insightId));
    const H = this.H(), api = this.api();
    const r = def.widerspruchReaktionen && def.widerspruchReaktionen[insightId];
    if (r) {
      let text = typeof r.text === "function" ? r.text(H) : r.text;
      this.vLog(npcId, npcId, text);
      if (r.clue) api.clue(r.clue);
      if (r.insight) api.insight(r.insight);
      if (r.tu) r.tu(api);
    } else {
      this.vLog(npcId, npcId, def.widerspruchStandard || "„Ich weiß nicht, wovon Sie reden.“ Aber der Blick flackert kurz.");
    }
    this.aktion();
  },

  /* ---------------- Freitext → Absicht ---------------- */
  freitextVerhoer(npcId, input) {
    const def = this.verhoerDef(npcId);
    const H = this.H();
    // Ton erkennen
    let ton = "sachlich";
    if (U.enthaeltWort(input, ["sofort", "luege", "luegst", "schluss damit", "verhaften", "drohe", "warnung", "zwinge"])) ton = "druck";
    else if (U.enthaeltWort(input, ["bitte", "danke", "vertraue", "helfen", "hilf", "verstehe", "leid", "gemeinsam", "schutz", "schuetze"])) ton = "freundlich";
    // Thema finden
    let best = null;
    for (const t of def.themen) {
      if (t.braucht && !(H.hat(t.braucht) || H.flag(t.braucht) || H.insight(t.braucht))) continue;
      const woerter = (t.worte || []).concat(t.label.split(" "));
      if (U.enthaeltWort(input, woerter.filter(w => w.length > 3))) { best = t; break; }
    }
    if (best) {
      const tonGenutzt = best.antworten[ton] ? ton : (best.antworten.sachlich ? "sachlich" : "default");
      this.frageThema(npcId, best.id, tonGenutzt);
      return true;
    }
    this.vLog(npcId, "ich", input);
    const aus = def.freitextAusweich || "„Darauf habe ich keine Antwort für Sie.“ Vielleicht solltest du konkreter nach den Themen fragen, die unten vorgeschlagen werden – oder einen Beweis vorlegen.";
    this.vLog(npcId, "system", typeof aus === "function" ? aus(H) : aus);
    return false;
  },

  /* ---------------- Beweiswand ---------------- */
  verbinde(a, b) {
    const fall = this.fall();
    const s = this.s;
    const hatTeil = (x) => s.clues[x] !== undefined || s.insights[x] !== undefined;
    if (!hatTeil(a) || !hatTeil(b)) return { nichts: true };
    s.verbindungenVersucht++;
    for (const v of (fall.verbindungen || [])) {
      if ((v.a === a && v.b === b) || (v.a === b && v.b === a)) {
        if (s.insights[v.id]) return { schon: true, v };
        const api = this.api();
        api.insight(v.id);
        if (v.tu) v.tu(api);
        this.aktion();
        return { neu: true, v };
      }
    }
    this.aktion();
    return { nichts: true };
  },

  // Widerspruchs-Scanner: automatik je nach Schwierigkeit
  autoScan() {
    const s = this.s, fall = this.fall();
    if (!fall || !fall.verbindungen) return;
    const modus = s.charakter.schwierigkeit;
    if (modus === "meister") return;
    for (const v of fall.verbindungen) {
      if (!v.widerspruch || s.insights[v.id]) continue;
      if (s.clues[v.a] && s.clues[v.b]) {
        if (modus === "story") {
          this.api().insight(v.id);
          this.toast("⚠️ Widerspruchs-Scanner: <b>" + U.esc(v.titel) + "</b>", "rot");
        } else if (!s.flags["scanhint_" + v.id]) {
          s.flags["scanhint_" + v.id] = s.schritte;
          this.toast("⚠️ Der Widerspruchs-Scanner schlägt an – zwei deiner Hinweise könnten sich widersprechen. Prüfe die Beweiswand.", "rot");
        }
      }
    }
  },

  /* ---------------- Datenbank ---------------- */
  suche(begriff) {
    this.s.statistik.suchen++;
    const q = U.norm(begriff);
    if (!q) return [];
    const H = this.H();
    const treffer = [];
    for (const e of GameData.welt.datenbank) {
      if (e.wenn && !e.wenn(H)) continue;
      const woerter = (e.schlagworte || []).map(U.norm).concat(U.norm(e.titel));
      if (woerter.some(w => w.includes(q) || q.includes(w) || q.split(" ").some(t => t.length > 2 && w.includes(t)))) {
        treffer.push(e);
      }
    }
    if (treffer.length) {
      const api = this.api();
      treffer.forEach(e => { if (e.clue) api.clue(e.clue); if (e.flagBeiFund) api.flag(e.flagBeiFund); });
    }
    return treffer;
  },

  /* ---------------- Theorie ---------------- */
  theorieEinreichen(einreichung) {
    const fall = this.fall();
    const s = this.s;
    if (!s.theorien[fall.id]) s.theorien[fall.id] = { versuche: 0 };
    const t = s.theorien[fall.id];
    t.versuche++;
    const ergebnis = fall.theorie.bewerten(this.H(), einreichung);
    t.rang = ergebnis.rang;
    t.einreichung = einreichung;
    const maxVersuche = s.charakter.schwierigkeit === "story" ? 99 : s.charakter.schwierigkeit === "detektiv" ? 2 : 1;
    if (ergebnis.rang === "falsch" && t.versuche < maxVersuche && !ergebnis.endgueltig) {
      return { nochmal: true, text: ergebnis.text, verbleibend: maxVersuche - t.versuche };
    }
    // Theorie wird Kanon der Spielwelt
    const api = this.api();
    if (ergebnis.tu) ergebnis.tu(api);
    s.phase = "abgeschlossen";
    s.flags["abgeschlossen_" + fall.id] = s.schritte;
    api.log("Fall „" + fall.titel + "“ abgeschlossen – Ergebnis: " + (ergebnis.rangName || ergebnis.rang));
    this.autosave();
    return { fertig: true, text: ergebnis.text, rang: ergebnis.rang };
  },

  naechstesKapitel() {
    const reihenfolge = ["fall1", "fall2", "fall3", "finale"];
    const i = reihenfolge.indexOf(this.s.kapitel);
    if (i >= 0 && i < reihenfolge.length - 1) {
      this.starteKapitel(reihenfolge[i + 1]);
      return reihenfolge[i + 1];
    }
    this.s.phase = "spielende";
    this.autosave();
    return null;
  },

  /* ---------------- Hinweise (spoilerfrei, 5 Stufen) ---------------- */
  hinweis(stufe) {
    const fall = this.fall();
    const s = this.s;
    const genutzt = s.hinweiseGenutzt[fall.id] || 0;
    if (stufe > genutzt) s.hinweiseGenutzt[fall.id] = stufe;
    const h = fall.hinweise(this.H());
    return h[stufe - 1] || "Für diesen Abschnitt gibt es keinen weiteren Hinweis.";
  },

  /* ---------------- Aktion & Storylet-Tick ---------------- */
  aktion() {
    this.s.schritte++;
    this.tick();
    this.autosave();
  },

  tick() {
    const s = this.s;
    const H = this.H(), api = this.api();
    const quellen = [];
    const fall = this.fall();
    if (fall && fall.storylets) quellen.push(...fall.storylets);
    if (GameData.npcs.storylets) quellen.push(...GameData.npcs.storylets);
    for (const st of quellen) {
      const key = "storylet_" + st.id;
      if (st.einmalig !== false && s.flags[key] !== undefined) continue;
      let ok = false;
      try { ok = st.wenn(H); } catch (e) { console.warn("Storylet-Fehler", st.id, e); }
      if (ok) {
        s.flags[key] = s.schritte;
        try { st.dann(api); } catch (e) { console.warn("Storylet-Wirkung-Fehler", st.id, e); }
      }
    }
  },

  /* ---------------- Speicherstände ---------------- */
  autosave() {
    try { localStorage.setItem("af_autosave", JSON.stringify({ meta: this.saveMeta(), s: this.s })); } catch (e) {}
  },
  saveMeta() {
    const fall = this.fall();
    return {
      name: this.s.charakter.name,
      kapitel: fall ? fall.titel : this.s.kapitel,
      schritte: this.s.schritte,
      zeit: Date.now(),
    };
  },
  speichern(slot) {
    localStorage.setItem("af_slot_" + slot, JSON.stringify({ meta: this.saveMeta(), s: this.s }));
  },
  laden(slotKey) {
    const raw = localStorage.getItem(slotKey);
    if (!raw) return false;
    try {
      const d = JSON.parse(raw);
      this.s = d.s;
      return true;
    } catch (e) { return false; }
  },
  slotInfo(slotKey) {
    const raw = localStorage.getItem(slotKey);
    if (!raw) return null;
    try { return JSON.parse(raw).meta; } catch (e) { return null; }
  },
  exportieren() { return JSON.stringify({ meta: this.saveMeta(), s: this.s }); },
  importieren(text) {
    try {
      const d = JSON.parse(text);
      if (!d.s || !d.s.charakter) return false;
      this.s = d.s; this.autosave(); return true;
    } catch (e) { return false; }
  },

  toast(html, art) { if (this._toastFn) this._toastFn(html, art); },
};

/* ===== js/ui.js ===== */
/* ============================================================
   ui.js – komplette Spieloberfläche
   ============================================================ */
"use strict";

const UI = {
  zustand: { tab: "uebersicht", chatId: null, ortId: null, verhoerId: null, ermittelnSub: "orte", wissenSub: "regeln", selChips: [], theorie: { taeter: "", motiv: "", methode: "", beweise: [] }, dbErgebnis: null, dbBegriff: "" },

  tabs: [
    { id: "uebersicht", icon: "🏠", label: "Übersicht" },
    { id: "chats", icon: "💬", label: "Chats" },
    { id: "ermitteln", icon: "🔍", label: "Ermitteln" },
    { id: "akte", icon: "📁", label: "Fallakte" },
    { id: "wand", icon: "🧵", label: "Beweiswand" },
    { id: "timeline", icon: "🕒", label: "Timeline" },
    { id: "theorie", icon: "🧠", label: "Theorie" },
    { id: "wissen", icon: "📖", label: "Wissen" },
  ],

  /* ---------------- Boot & Grundgerüst ---------------- */
  init() {
    Engine._toastFn = (html, art) => UI.toast(html, art);
    Engine._renderFn = (typ, chatId) => {
      UI.updateBadges();
      if (UI.zustand.tab === "chats" && UI.zustand.chatId === chatId) UI.render();
    };
    document.getElementById("btn-hinweis").onclick = () => UI.hinweisModal();
    document.getElementById("btn-menu").onclick = () => UI.menueModal();
    document.getElementById("modal-back").onclick = () => UI.schliesseModal();
  },

  starteSpiel() {
    document.getElementById("screen-title").classList.remove("aktiv");
    document.getElementById("screen-create").classList.remove("aktiv");
    document.getElementById("screen-game").classList.add("aktiv");
    this.baueTabbar();
    this.zustand.tab = "uebersicht";
    this.render();
  },

  baueTabbar() {
    const bar = document.getElementById("tabbar");
    bar.innerHTML = "";
    for (const t of this.tabs) {
      const b = U.el("button", "tab" + (this.zustand.tab === t.id ? " aktiv" : ""));
      b.dataset.tab = t.id;
      b.innerHTML = `<span class="t-icon">${t.icon}</span><span>${t.label}</span>`;
      b.onclick = () => { this.zustand.tab = t.id; this.zustand.chatId = null; this.zustand.ortId = null; this.zustand.verhoerId = null; this.render(); };
      bar.appendChild(b);
    }
    this.updateBadges();
  },

  updateBadges() {
    if (!Engine.s) return;
    let ungelesen = 0;
    for (const c of Object.values(Engine.s.chats)) ungelesen += c.ungelesen || 0;
    const tab = document.querySelector('.tab[data-tab="chats"]');
    if (tab) {
      let badge = tab.querySelector(".badge");
      if (ungelesen > 0) {
        if (!badge) { badge = U.el("span", "badge"); tab.appendChild(badge); }
        badge.textContent = ungelesen;
      } else if (badge) badge.remove();
    }
  },

  toast(html, art) {
    const box = document.getElementById("toasts");
    const t = U.el("div", "toast" + (art ? " " + art : ""), html);
    box.appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .4s"; setTimeout(() => t.remove(), 450); }, 3600);
  },

  modal(html) {
    const wrap = document.getElementById("modal-wrap");
    const m = document.getElementById("modal");
    m.innerHTML = `<button class="modal-x" onclick="UI.schliesseModal()">✕</button>` + html;
    wrap.classList.remove("versteckt");
    return m;
  },
  schliesseModal() { document.getElementById("modal-wrap").classList.add("versteckt"); },

  /* ---------------- Haupt-Render ---------------- */
  render() {
    const s = Engine.s;
    if (!s) return;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("aktiv", t.dataset.tab === this.zustand.tab));
    const fall = Engine.fall();
    document.getElementById("topbar-fall").textContent = s.phase === "spielende" ? "Epilog – Aschenfurt" : ("Fall " + fall.nummer + ": " + fall.titel);
    const view = document.getElementById("view");
    view.innerHTML = "";
    const inner = U.el("div", "view-inner");
    view.appendChild(inner);
    if (s.phase === "spielende") { this.rEpilog(inner); return; }
    const fn = {
      uebersicht: this.rUebersicht, chats: this.rChats, ermitteln: this.rErmitteln, akte: this.rAkte,
      wand: this.rWand, timeline: this.rTimeline, theorie: this.rTheorie, wissen: this.rWissen,
    }[this.zustand.tab];
    if (fn) fn.call(this, inner);
    this.updateBadges();
  },

  /* ---------------- Übersicht ---------------- */
  rUebersicht(el) {
    const s = Engine.s, fall = Engine.fall(), H = Engine.H();
    el.appendChild(U.el("div", "abschnitt", `
      <div class="leise">FALL ${fall.nummer} · ${U.esc(s.charakter.name)} · ${U.esc(GameData.welt.berufe.find(b => b.id === s.charakter.beruf).name)} · ${U.esc({ story: "Story-Modus", detektiv: "Detektiv-Modus", meister: "Meisterdetektiv" }[s.charakter.schwierigkeit])}</div>
      <h2 class="serif" style="font-size:1.5em;border:none">${U.esc(fall.titel)}</h2>
      <p class="muted">${U.esc(fall.untertitel)}</p>
      <div class="kasten" style="margin-top:12px"><b>🎯 Auftrag:</b> ${U.esc(fall.ziel)}</div>
    `));

    // offene Fragen
    const fragen = Object.values(s.fragen);
    const offene = fragen.filter(f => f.offen);
    const sect = U.el("div", "abschnitt", `<h2>❓ Offene Fragen</h2>`);
    if (!fragen.length) sect.appendChild(U.el("p", "leise", "Noch keine offenen Fragen – die Ermittlung beginnt gerade erst."));
    fragen.slice().reverse().forEach(f => {
      sect.appendChild(U.el("div", "kasten", f.offen ? "• " + U.esc(f.text) : "<s class='leise'>• " + U.esc(f.text) + "</s> <span class='tag gruen'>geklärt</span>"));
    });
    el.appendChild(sect);

    // Zusammenfassung
    const logs = s.log.filter(l => l.kapitel === s.kapitel);
    const z = U.el("div", "abschnitt", `<h2>📋 Bisher in diesem Fall</h2>`);
    if (!logs.length) z.appendChild(U.el("p", "leise", "Noch nichts protokolliert."));
    else {
      const kurz = logs.slice(-5);
      kurz.forEach(l => z.appendChild(U.el("div", "kasten", U.esc(l.text))));
      if (logs.length > 5) {
        const mehr = U.el("button", "btn btn-klein", "Vollständige Zusammenfassung (" + logs.length + " Einträge)");
        mehr.onclick = () => UI.modal("<h2>Zusammenfassung: " + U.esc(fall.titel) + "</h2>" + logs.map(l => "<div class='kasten'>" + U.esc(l.text) + "</div>").join(""));
        z.appendChild(mehr);
      }
    }
    el.appendChild(z);

    // Vorschläge (Fallakte schlägt vor, Spieler entscheidet) – nicht im Meister-Modus
    if (s.charakter.schwierigkeit !== "meister" && s.phase === "ermittlung") {
      const tipps = [];
      (fall.orte || []).forEach(o => { if ((!o.frei || o.frei(H)) && !s.flags["ort_betreten_" + o.id]) tipps.push("📍 Ort noch nicht aufgesucht: <b>" + U.esc(o.name) + "</b>"); });
      Object.keys(fall.verhoere || {}).forEach(v => { if (!s.flags["verhoer_" + v + "_gefragt"]) tipps.push("🗣️ Noch nicht befragt: <b>" + U.esc(fall.verhoere[v].name) + "</b>"); });
      const offeneVerb = (fall.verbindungen || []).filter(v => !s.insights[v.id] && s.clues[v.a] !== undefined && s.clues[v.b] !== undefined && (s.insights[v.a] !== undefined || s.clues[v.a] !== undefined) ).length;
      if (offeneVerb > 0) tipps.push("🧵 Auf der Beweiswand warten <b>" + offeneVerb + "</b> mögliche Verbindung(en) auf dich.");
      if (tipps.length) {
        const v = U.el("div", "abschnitt", "<h2>💼 Die Akte schlägt vor</h2>");
        tipps.slice(0, 4).forEach(t => v.appendChild(U.el("div", "kasten", t)));
        el.appendChild(v);
      }
    }

    if (s.phase === "abgeschlossen") {
      const k = U.el("div", "abschnitt");
      const btn = U.el("button", "btn btn-primary", "Weiter zum nächsten Kapitel →");
      btn.onclick = () => { Engine.naechstesKapitel(); UI.zustand.tab = "uebersicht"; UI.render(); };
      k.appendChild(U.el("div", "kasten", "✅ Dieser Fall ist abgeschlossen. Du kannst noch alles nachlesen – oder weiterziehen."));
      k.appendChild(btn);
      el.appendChild(k);
    }
  },

  /* ---------------- Chats ---------------- */
  rChats(el) {
    const s = Engine.s;
    if (this.zustand.chatId) return this.rChatThread(el, this.zustand.chatId);
    el.appendChild(U.el("h2", "serif", "Nachrichten"));
    const such = U.el("div", "suchzeile");
    const inp = U.el("input"); inp.placeholder = "Chats durchsuchen…";
    inp.oninput = () => this.chatSuche(inp.value, liste);
    such.appendChild(inp); el.appendChild(such);
    const liste = U.el("div", "chatliste");
    el.appendChild(liste);
    this.chatSuche("", liste);
  },

  chatSuche(begriff, liste) {
    const s = Engine.s;
    liste.innerHTML = "";
    const q = U.norm(begriff);
    const ids = Object.keys(s.chats).sort((a, b) => {
      const la = s.chats[a].nachrichten.slice(-1)[0], lb = s.chats[b].nachrichten.slice(-1)[0];
      return (lb ? lb.schritt : 0) - (la ? la.schritt : 0);
    });
    let any = false;
    for (const id of ids) {
      const c = s.chats[id];
      if (!c.nachrichten.length) continue;
      const npc = GameData.npcs.personen[id] || { name: id, icon: "💬" };
      const letzte = c.nachrichten.slice(-1)[0];
      if (q && !U.norm(npc.name).includes(q) && !c.nachrichten.some(n => U.norm(n.text).includes(q))) continue;
      any = true;
      const k = U.el("button", "kasten klick");
      k.innerHTML = `<div style="display:flex;align-items:center;gap:12px;width:100%">
        <div class="chat-avatar">${npc.icon}</div>
        <div class="chat-mitte">
          <div class="chat-z1"><span class="chat-name">${U.esc(npc.name)}</span><span class="leise">${U.esc(letzte.zeit || "")}</span></div>
          <div class="chat-vorschau">${U.esc(letzte.text.slice(0, 90))}</div>
        </div>${c.ungelesen ? `<span class="chat-ungelesen">${c.ungelesen}</span>` : ""}</div>`;
      k.onclick = () => { this.zustand.chatId = id; c.ungelesen = 0; this.render(); };
      liste.appendChild(k);
    }
    if (!any) liste.appendChild(U.el("p", "leise", begriff ? "Keine Treffer." : "Noch keine Nachrichten. Sie werden kommen – diese Stadt schweigt nie lange."));
  },

  rChatThread(el, chatId) {
    const s = Engine.s;
    const c = Engine.chat(chatId);
    c.ungelesen = 0;
    const npc = GameData.npcs.personen[chatId] || { name: chatId, icon: "💬", rolle: "" };
    const kopf = U.el("div", "chat-kopf");
    const zurueck = U.el("button", "zurueck", "←");
    zurueck.onclick = () => { this.zustand.chatId = null; this.render(); };
    kopf.appendChild(zurueck);
    kopf.appendChild(U.el("div", "", `<div class="ck-name">${npc.icon} ${U.esc(npc.name)}</div><div class="ck-info">${U.esc(npc.rolle || "")}</div>`));
    el.appendChild(kopf);

    const thread = U.el("div", "thread");
    for (let i = 0; i < c.nachrichten.length; i++) {
      const n = c.nachrichten[i];
      thread.appendChild(this.nachrichtEl(chatId, n, i));
    }
    el.appendChild(thread);

    // Antwortoptionen
    const pending = Engine.pendingWahl(chatId);
    if (pending) {
      const box = U.el("div", "optionen");
      pending.optionen.forEach((o, idx) => {
        const b = U.el("button", "option");
        b.innerHTML = (o.ton ? `<span class="o-ton">${U.esc(GameData.welt.tonNamen[o.ton] || o.ton)}</span>` : "") + U.esc(o.label);
        b.onclick = () => { Engine.waehleOption(chatId, idx); this.render(); };
        box.appendChild(b);
      });
      el.appendChild(box);
      // Freitext: wird auf die passende Option abgebildet
      const fz = U.el("div", "freitext-zeile");
      const inp = U.el("input"); inp.placeholder = "Oder in eigenen Worten antworten…";
      const send = U.el("button", "btn btn-klein", "Senden");
      const senden = () => {
        const txt = inp.value.trim(); if (!txt) return;
        let best = -1, bestScore = 0;
        pending.optionen.forEach((o, idx) => {
          const w = U.norm(o.label).split(" ").filter(x => x.length > 3);
          const score = w.filter(x => U.norm(txt).includes(x)).length;
          if (score > bestScore) { bestScore = score; best = idx; }
        });
        if (best >= 0 && bestScore > 0) { Engine.waehleOption(chatId, best); this.render(); }
        else this.toast("Deine Absicht ist unklar – wähle eine der Optionen oder formuliere näher an einer davon.", "blau");
      };
      send.onclick = senden; inp.onkeydown = (e) => { if (e.key === "Enter") senden(); };
      fz.appendChild(inp); fz.appendChild(send); el.appendChild(fz);
    }
    setTimeout(() => { const v = document.getElementById("view"); v.scrollTop = v.scrollHeight; }, 30);
  },

  nachrichtEl(chatId, n, idx) {
    const npc = GameData.npcs.personen[n.von];
    let cls = "msg npc", von = npc ? npc.name : n.von;
    if (n.von === "ich") { cls = "msg ich"; von = null; }
    else if (n.von === "system") { cls = "msg system"; von = null; }
    else if (n.von === "gedanke") { cls = "msg gedanke"; von = null; }
    const d = U.el("div", cls + (n.markiert ? " markiert" : ""));
    d.innerHTML = (von ? `<div class="m-von">${U.esc(von)}</div>` : "") + U.esc(n.text)
      + (n.anhang ? `<div class="msg-anhang">📎 ${U.esc(n.anhang.titel)}</div>` : "")
      + (n.zeit && n.von !== "gedanke" ? `<div class="m-zeit">${U.esc(n.zeit)}</div>` : "")
      + (n.markiert ? `<span class="m-stern">⭐</span>` : "");
    if (n.von !== "system" && n.von !== "gedanke") {
      d.style.cursor = "pointer";
      d.title = "Antippen: als wichtigen Hinweis markieren";
      d.onclick = () => { n.markiert = !n.markiert; Engine.autosave(); UI.render(); };
    }
    return d;
  },

  /* ---------------- Ermitteln (Orte / Verhöre / Datenbank) ---------------- */
  rErmitteln(el) {
    const subs = [["orte", "📍 Orte"], ["verhoere", "🗣️ Verhöre"], ["datenbank", "🗄️ Datenbank"]];
    const leiste = U.el("div", "ton-leiste");
    subs.forEach(([id, label]) => {
      const b = U.el("button", "ton-btn" + (this.zustand.ermittelnSub === id ? " aktiv" : ""), label);

      leiste.appendChild(b);
    });
    el.appendChild(leiste);
    if (this.zustand.ermittelnSub === "orte") this.rOrte(el);
    else if (this.zustand.ermittelnSub === "verhoere") this.rVerhoere(el);
    else this.rDatenbank(el);

  rVerhoer(el, npcId) {
    const fall = Engine.fall(), s = Engine.s, H = Engine.H();
    const def = fall.verhoere[npcId];
    const v = Engine.verhoer(npcId);
    const npc = GameData.npcs.personen[npcId] || {};
    const n = s.npc[npcId] || {};

    const kopf = U.el("div", "chat-kopf");
    const zurueck = U.el("button", "zurueck", "←");
    zurueck.onclick = () => { this.zustand.verhoerId = null; this.render(); };
    kopf.appendChild(zurueck);
    kopf.appendChild(U.el("div", "", `<div class="ck-name">${npc.icon || ""} ${U.esc(def.name)}</div><div class="ck-info">${U.esc(def.ort)}</div>`));
    el.appendChild(kopf);

    const vk = U.el("div", "verhoer-kopf");
    vk.innerHTML = `<div class="chat-avatar">${npc.icon || "🗣️"}</div>
      <div style="flex:1"><div class="leise">${U.esc(GameData.npcs.beziehungsTyp(n))}</div></div>
      <div class="druck-anzeige">Druck<br><span class="druck-punkte">${"●".repeat(v.druck)}${"○".repeat(Math.max(0, Engine.druckLimit(npcId) - v.druck))}</span></div>`;
    el.appendChild(vk);

    if (!v.log.length) el.appendChild(U.el("div", "szene-text", U.esc(def.intro)));

    const thread = U.el("div", "thread");
    v.log.forEach(z => {
      let cls = "msg npc", von = def.name;
      if (z.von === "ich") { cls = "msg ich"; von = null; }
      if (z.von === "system") { cls = "msg system"; von = null; }
      const d = U.el("div", cls);
      d.innerHTML = (von ? `<div class="m-von">${U.esc(von)}</div>` : "") + U.esc(z.text).replace(/\n/g, "<br>");
      thread.appendChild(d);
    });
    el.appendChild(thread);

    if (n.blockiert) {
      el.appendChild(U.el("div", "kasten", "🚫 " + U.esc(def.name) + " verweigert dir derzeit das Gespräch. Manche Türen öffnen sich wieder – mit Zeit, Beweisen oder über andere Wege."));
      return;
    }

    // Tonwahl
    if (!this.zustand.ton) this.zustand.ton = "sachlich";
    const toene = def.tonarten || ["freundlich", "sachlich", "druck"];
    const extraToene = [];
    if (H.beruf("anwalt") && !toene.includes("juristisch")) extraToene.push("juristisch");
    const tl = U.el("div", "ton-leiste");
    tl.appendChild(U.el("span", "leise", "Ton: "));
    toene.concat(extraToene).forEach(t => {
      const b = U.el("button", "ton-btn" + (this.zustand.ton === t ? " aktiv" : ""), GameData.welt.tonNamen[t] || t);
      b.onclick = () => { this.zustand.ton = t; this.render(); };
      tl.appendChild(b);
    });
    el.appendChild(tl);

    // Themen
    const themenBox = U.el("div", "optionen");
    def.themen.forEach(t => {
      if (t.braucht && !(H.hat(t.braucht) || H.flag(t.braucht) || H.insight(t.braucht))) return;
      const oft = v.gefragt[t.id] || 0;
      const b = U.el("button", "option" + (oft ? " aktion-gemacht" : ""), (oft ? "✓ " : "") + U.esc(t.label));
      b.onclick = () => {
        let ton = this.zustand.ton;
        if (ton === "juristisch" && !t.antworten.juristisch) ton = "sachlich";
        if (!t.antworten[ton] && !t.antworten.default) ton = Object.keys(t.antworten)[0];
        Engine.frageThema(npcId, t.id, ton);
        this.render();
      };
      themenBox.appendChild(b);
    });
    el.appendChild(themenBox);

    // Beweis vorlegen / Widerspruch vorhalten
    const werkzeug = U.el("div", "ton-leiste");
    const bBtn = U.el("button", "btn btn-klein", "📄 Beweis vorlegen");
    bBtn.onclick = () => this.beweisWahlModal(npcId);
    const wBtn = U.el("button", "btn btn-klein", "⚡ Widerspruch vorhalten");
    wBtn.onclick = () => this.widerspruchWahlModal(npcId);
    werkzeug.appendChild(bBtn); werkzeug.appendChild(wBtn);
    el.appendChild(werkzeug);

    // Freitext
    const fz = U.el("div", "freitext-zeile");
    const inp = U.el("input"); inp.placeholder = "Eigene Frage stellen (freie Eingabe)…";
    const send = U.el("button", "btn btn-klein", "Fragen");
    const senden = () => { const txt = inp.value.trim(); if (!txt) return; Engine.freitextVerhoer(npcId, txt); inp.value = ""; this.render(); };
    send.onclick = senden; inp.onkeydown = (e) => { if (e.key === "Enter") senden(); };
    fz.appendChild(inp); fz.appendChild(send);
    el.appendChild(fz);
    setTimeout(() => { const vv = document.getElementById("view"); vv.scrollTop = vv.scrollHeight; }, 30);
  },

    such.appendChild(inp); bw.appendChild(such);
    const liste = U.el("div");
    const typNamen = { spur: "Spur", dokument: "Dokument", aussage: "Aussage", forensik: "Forensik", okkult: "Okkult" };
    const zeichne = () => {
      liste.innerHTML = "";
      const q = U.norm(inp.value);
      const clues = Object.keys(s.clues).map(id => ({ id, c: Engine.findeClue(id) })).filter(x => x.c)
        .filter(x => !q || U.norm(x.c.name + " " + x.c.kurz + " " + x.c.lang).includes(q))
        .sort((a, b) => (s.werte["mark_" + b.id] ? 1 : 0) - (s.werte["mark_" + a.id] ? 1 : 0));
      if (!clues.length) liste.appendChild(U.el("p", "leise", q ? "Keine Treffer." : "Noch keine Beweise gesammelt. Untersuch Tatorte, führe Verhöre, durchsuche die Datenbank."));

      });

  /* ---------------- Theorie ---------------- */
  rTheorie(el) {
    const s = Engine.s, fall = Engine.fall(), H = Engine.H();
    const th = fall.theorie;
    el.appendChild(U.el("h2", "serif", "Theorie-Board"));

    if (s.phase === "abgeschlossen") {
      const t = s.theorien[fall.id];
      el.appendChild(U.el("div", "kasten", "<b>Abgegeben.</b> Ergebnis: <b>" + U.esc(t && t.rang || "") + "</b>"));

      const btn = U.el("button", "btn btn-primary", "Weiter →");
      btn.onclick = () => { Engine.naechstesKapitel(); UI.zustand.tab = "uebersicht"; UI.zustand.letztesErgebnis = null; UI.render(); };
      el.appendChild(btn);
      return;
    }

    el.appendChild(U.el("p", "muted", U.esc(th.frage)));
    const versuche = (s.theorien[fall.id] || {}).versuche || 0;
    const max = s.charakter.schwierigkeit === "story" ? "∞" : s.charakter.schwierigkeit === "detektiv" ? 2 : 1;
    el.appendChild(U.el("p", "leise", "Je besser deine Theorie belegt ist, desto besser das Ergebnis. Versuche: " + versuche + " / " + max + (s.charakter.schwierigkeit === "meister" ? " – im Meisterdetektiv-Modus zählt nur der erste Schuss." : "")));

    const labels = th.labels || { taeter: "Täter / Täterin", motiv: "Motiv", methode: "Methode" };
    const t = this.zustand.theorie;

    const mkSelect = (label, optionen, key) => {
      const feld = U.el("div", "theorie-feld");
      feld.appendChild(U.el("label", "", U.esc(label)));
      const sel = U.el("select");
      sel.appendChild(U.el("option", "", "– wählen –"));
      optionen.forEach(o => {
        const opt = U.el("option", "", U.esc(o.label));
        opt.value = o.id;
        if (t[key] === o.id) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.onchange = () => { t[key] = sel.value; };
      feld.appendChild(sel);
      return feld;
    };
    el.appendChild(mkSelect(labels.taeter, th.taeterOptionen, "taeter"));
    el.appendChild(mkSelect(labels.motiv, th.motive, "motiv"));
    el.appendChild(mkSelect(labels.methode, th.methoden, "methode"));

    // Beweisauswahl
    const feld = U.el("div", "theorie-feld");
    feld.appendChild(U.el("label", "", "Belege deiner Theorie (wähle die tragenden Beweise & Schlussfolgerungen)"));
    const pool = [];
    const allKern = (th.kernbeweise || []).concat(th.fehlbeweise || []);
    Object.keys(s.clues).forEach(id => { const c = Engine.findeClue(id); if (c && (id.startsWith("c" + fall.nummer) || id.startsWith("cf") || allKern.includes(id))) pool.push({ id, name: c.name }); });
    Object.keys(s.insights).forEach(id => { const v = Engine.findeInsight(id); if (v && (id.startsWith("i" + fall.nummer) || id.startsWith("if") || allKern.includes(id))) pool.push({ id, name: "🧩 " + v.titel }); });
    const wahl = U.el("div", "beweis-wahl");
    pool.forEach(x => {
      const c = U.el("button", "chip" + (t.beweise.includes(x.id) ? " gewaehlt" : ""), U.esc(x.name));
      c.onclick = () => {
        const i = t.beweise.indexOf(x.id);
        if (i >= 0) t.beweise.splice(i, 1); else t.beweise.push(x.id);
        c.classList.toggle("gewaehlt");
      };
      wahl.appendChild(c);
    });
    if (!pool.length) wahl.appendChild(U.el("p", "leise", "Du hast noch keine Beweise – eine Theorie ohne Belege ist nur eine Anschuldigung."));
    feld.appendChild(wahl);
    el.appendChild(feld);

    const abgeben = U.el("button", "btn btn-primary", "⚖️ Theorie abgeben");
    abgeben.onclick = () => {
      if (!t.taeter || !t.motiv || !t.methode) { this.toast("Wähle " + labels.taeter + ", " + labels.motiv + " und " + labels.methode + ".", "rot"); return; }
      const m = this.modal(`<h2>Theorie abgeben?</h2><p class="muted">Deine Anklage wird offiziell. ${s.charakter.schwierigkeit === "meister" ? "<b>Es gibt keinen zweiten Versuch.</b>" : ""}</p>`);
      const ja = U.el("button", "btn btn-primary", "Ja, abgeben");
      ja.onclick = () => {
        this.schliesseModal();
        const r = Engine.theorieEinreichen({ taeter: t.taeter, motiv: t.motiv, methode: t.methode, beweise: t.beweise.slice() });
        if (r.nochmal) {
          this.modal(`<h2>Die Theorie trägt nicht</h2><div class="szene-text">${U.esc(r.text).replace(/\n/g, "<br>")}</div><p class="leise">Du hast noch ${r.verbleibend} Versuch(e). Sammle mehr Beweise oder überdenke die Kette.</p>`);
        } else {
          this.zustand.letztesErgebnis = r.text;
          this.zustand.theorie = { taeter: "", motiv: "", methode: "", beweise: [] };
          this.modal(`<h2>${U.esc({ perfekt: "✅ Lückenlos", gut: "✔️ Überzeugend", wackelig: "⚠️ Wackelig", falsch: "❌ Ein Irrtum" }[r.rang] || "Ergebnis")}</h2><div class="szene-text">${U.esc(r.text).replace(/\n/g, "<br>")}</div>`);
          this.render();
        }
      };
      const nein = U.el("button", "btn", "Noch nicht");
      nein.onclick = () => this.schliesseModal();
      const reihe = U.el("div", "create-nav"); reihe.appendChild(nein); reihe.appendChild(ja);
      m.appendChild(reihe);
    };
    el.appendChild(abgeben);
  },

  rWissen(el) {

      GameData.welt.fraktionen.forEach(f => {

        el.appendChild(k);

      Object.entries(GameData.npcs.personen).forEach(([id, p]) => {

        if (!n) return;

          <div class="wertzeile"><span class="wz-name">Angst</span><div class="balken"><div style="width:${n.angst}%;background:var(--rot)"></div></div><span class="wz-wert">${n.angst}</span></div>`
