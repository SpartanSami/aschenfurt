    const speichere = () => { localStorage.setItem("af_settings", JSON.stringify(set)); UI.wendeEinstellungenAn(); };

    const theme = U.el("div", "kasten", "<h4>🌗 Modus</h4>");
    [["dunkel", "Dunkel (Noir)"], ["hell", "Hell"]].forEach(([v, label]) => {
      const b = U.el("button", "ton-btn" + ((set.theme || "dunkel") === v ? " aktiv" : ""), label);
      b.onclick = () => { set.theme = v; speichere(); this.einstellungenModal(); };
      theme.appendChild(b);
    });
    m.appendChild(theme);

    const ts = U.el("div", "kasten", "<h4>🔠 Textgröße</h4>");
    [["s", "Klein"], ["m", "Normal"], ["l", "Groß"], ["xl", "Sehr groß"]].forEach(([v, label]) => {
      const b = U.el("button", "ton-btn" + ((set.textsize || "m") === v ? " aktiv" : ""), label);
      b.onclick = () => { set.textsize = v; speichere(); this.einstellungenModal(); };
      ts.appendChild(b);
    });
    m.appendChild(ts);

    const anim = U.el("div", "kasten", "<h4>🎬 Animationen</h4><p class='leise'>Lesemodus ohne Bewegung für ruhiges Ermitteln.</p>");
    [["an", "Animationen an"], ["aus", "Lesemodus (aus)"]].forEach(([v, label]) => {
      const b = U.el("button", "ton-btn" + ((set.anim || "an") === v ? " aktiv" : ""), label);
      b.onclick = () => { set.anim = v; speichere(); this.einstellungenModal(); };
      anim.appendChild(b);
    });
    m.appendChild(anim);
  },

  wendeEinstellungenAn() {
    const set = JSON.parse(localStorage.getItem("af_settings") || "{}");
    document.body.dataset.theme = set.theme || "dunkel";
    document.body.dataset.textsize = set.textsize || "m";
    document.body.dataset.anim = set.anim || "an";
  },

  /* ---------------- Epilog ---------------- */
  rEpilog(el) {
    const H = Engine.H();
    const fin = GameData.cases.finale;
    const t = Engine.s.theorien.finale || {};
    const ep = fin.epilog(H);
    el.appendChild(U.el("div", "abschnitt epilog", `
      <div class="leise" style="letter-spacing:3px;text-transform:uppercase">Epilog</div>
      <h2 class="serif" style="font-size:1.6em;border:none">Aschenfurt, ein Jahr später</h2>`));
    const teil = (titel, html) => { const d = U.el("div", "abschnitt epilog"); d.innerHTML = `<h3>${titel}</h3>` + html; el.appendChild(d); };
    if (this.zustand.letztesErgebnis) teil("Wie es endete", "<div class='szene-text'>" + U.esc(this.zustand.letztesErgebnis).replace(/\n/g, "<br>") + "</div>");
    teil("Die Stadt", "<p>" + ep.stadt + "</p>");
    teil("Die Menschen", ep.menschen.map(x => "<div class='kasten'>" + x + "</div>").join(""));
    if (ep.geheimnis) teil("Dein Geheimnis", "<div class='szene-text'>" + ep.geheimnis.replace(/\n/g, "<br>") + "</div>");
    teil("Dein Kodex", "<p>" + ep.kodex + "</p>");
    teil("Bilanz", "<p class='leise'>" + ep.bilanz + "</p>");
    const schluss = U.el("div", "abschnitt epilog");
    schluss.innerHTML = "<p class='muted serif' style='font-style:italic'>Diese Geschichte ist so passiert, weil du so entschieden hast. Eine andere Vergangenheit, ein anderer Kodex, ein anderer Weg – und Aschenfurt hätte dir eine andere Wahrheit gezeigt.</p>";
    const neu = U.el("button", "btn btn-primary", "🌒 Neue Geschichte beginnen");
    neu.onclick = () => location.reload();
    schluss.appendChild(neu);
    el.appendChild(schluss);
  },
};

/* ===== js/main.js ===== */
/* ============================================================
   main.js – Titelbildschirm, Charaktererstellung, Boot
   ============================================================ */
"use strict";

const Main = {
  wahl: { name: "", beruf: null, geheimnis: null, kodex: null, schwierigkeit: "detektiv" },

  init() {
    UI.wendeEinstellungenAn();
    UI.init();
    this.titel();
  },

  titel() {
    const box = document.getElementById("title-buttons");
    box.innerHTML = "";
    const auto = Engine.slotInfo("af_autosave");
    if (auto) {
      const weiter = U.el("button", "btn btn-primary", "▶ Weiterspielen<br><span class='leise'>" + U.esc(auto.name) + " · " + U.esc(auto.kapitel) + "</span>");
      weiter.onclick = () => {
        if (Engine.laden("af_autosave")) {
          UI.starteSpiel();
          // spoilerfreie Zusammenfassung nach Pause
          const s = Engine.s;
          const logs = s.log.filter(l => l.kapitel === s.kapitel).slice(-5);
          if (logs.length && s.phase !== "spielende") {
            UI.modal("<h2>Willkommen zurück, Detektiv</h2><p class='leise'>Wo du stehst – ohne Spoiler:</p>" +
              logs.map(l => "<div class='kasten'>" + U.esc(l.text) + "</div>").join("") +
              "<p class='leise'>Die vollständige Zusammenfassung findest du jederzeit in der Übersicht.</p>");
          }
        }
      };
      box.appendChild(weiter);
    }
    const neu = U.el("button", "btn" + (auto ? "" : " btn-primary"), "🌒 Neues Spiel");
    neu.onclick = () => this.erstellung(0);
    box.appendChild(neu);
    const laden = U.el("button", "btn", "💾 Spielstand laden");
    laden.onclick = () => UI.speichernModal();
    box.appendChild(laden);
    const einst = U.el("button", "btn", "⚙️ Einstellungen");
    einst.onclick = () => UI.einstellungenModal();
    box.appendChild(einst);
  },

  /* ---------------- Charaktererstellung (5 Schritte) ---------------- */
  erstellung(schritt) {
    document.getElementById("screen-title").classList.remove("aktiv");
    document.getElementById("screen-game").classList.remove("aktiv");
    document.getElementById("screen-create").classList.add("aktiv");
    const el = document.getElementById("create-inner");
    el.innerHTML = "";
    const schritte = ["Name", "Alter Beruf", "Dein Geheimnis", "Dein Kodex", "Schwierigkeit", "Bereit"];
    el.appendChild(U.el("div", "create-schritt", "Schritt " + (schritt + 1) + " von 6 · " + schritte[schritt]));

    const nav = (zurueckFn, weiterFn, weiterLabel) => {
      const n = U.el("div", "create-nav");
      const z = U.el("button", "btn", "← Zurück");
      z.onclick = zurueckFn || (() => { document.getElementById("screen-create").classList.remove("aktiv"); document.getElementById("screen-title").classList.add("aktiv"); });
      const w = U.el("button", "btn btn-primary", weiterLabel || "Weiter →");
      w.onclick = weiterFn;
      n.appendChild(z); n.appendChild(w);
      el.appendChild(n);
      return w;
    };

    if (schritt === 0) {
      el.appendChild(U.el("h1", "create-titel serif", "Wer bist du, Detektiv?"));
      el.appendChild(U.el("p", "create-sub", "Aschenfurt kennt viele Namen. Die meisten flüstert man. Wie lautet deiner?"));
      const inp = U.el("input"); inp.placeholder = "Dein Name…"; inp.maxLength = 30; inp.value = this.wahl.name;
      inp.style.fontSize = "1.2em";
      el.appendChild(inp);
      const w = nav(null, () => {
        const name = inp.value.trim();
        if (!name) { UI.toast("Ein Detektiv ohne Namen ist nur ein Schatten – gib dir einen.", "rot"); return; }
        this.wahl.name = name;
        this.erstellung(1);
      });
      inp.onkeydown = (e) => { if (e.key === "Enter") w.click(); };
      setTimeout(() => inp.focus(), 50);
    }

    if (schritt === 1) {
      el.appendChild(U.el("h1", "create-titel serif", "Was warst du, bevor du Ermittler wurdest?"));
      el.appendChild(U.el("p", "create-sub", "Dein alter Beruf prägt, was du am Tatort siehst, wem du vertraust – und wer dir."));
      const grid = U.el("div", "karten");
      GameData.welt.berufe.forEach(b => {
        const k = U.el("button", "karte" + (this.wahl.beruf === b.id ? " gewaehlt" : ""));
        k.innerHTML = `<span class="k-icon">${b.icon}</span><h3>${U.esc(b.name)}</h3><p><i>${U.esc(b.kurz)}</i></p>
          <ul>${b.plus.map(p => `<li class="plus">+ ${U.esc(p)}</li>`).join("")}${b.minus.map(p => `<li class="minus">− ${U.esc(p)}</li>`).join("")}</ul>`;
        k.onclick = () => { this.wahl.beruf = b.id; this.erstellung(1); };
        grid.appendChild(k);
      });
      el.appendChild(grid);
      nav(() => this.erstellung(0), () => {
        if (!this.wahl.beruf) { UI.toast("Wähle deinen alten Beruf.", "rot"); return; }
        this.erstellung(2);
      });
    }

    if (schritt === 2) {
      el.appendChild(U.el("h1", "create-titel serif", "Welches Geheimnis trägst du?"));
      el.appendChild(U.el("p", "create-sub", "Jeder in Aschenfurt trägt eines. Deines wird dich einholen – die Frage ist nur, wann und zu welchem Preis."));
      const grid = U.el("div", "karten");
      GameData.welt.geheimnisse.forEach(g => {
        const k = U.el("button", "karte" + (this.wahl.geheimnis === g.id ? " gewaehlt" : ""));
        k.innerHTML = `<span class="k-icon">${g.icon}</span><h3>${U.esc(g.name)}</h3><p>${U.esc(g.kurz)}</p>`;
        k.onclick = () => { this.wahl.geheimnis = g.id; this.erstellung(2); };
        grid.appendChild(k);
      });
      el.appendChild(grid);
      nav(() => this.erstellung(1), () => {
        if (!this.wahl.geheimnis) { UI.toast("Wähle dein Geheimnis.", "rot"); return; }
        this.erstellung(3);
      });
    }

    if (schritt === 3) {
      el.appendChild(U.el("h1", "create-titel serif", "Woran glaubst du – noch?"));
      el.appendChild(U.el("p", "create-sub", "Dein Kodex ist dein innerer Kompass. Handle dagegen, und du wirst es spüren – und andere auch."));
      const grid = U.el("div", "karten");
      GameData.welt.kodizes.forEach(kx => {
        const k = U.el("button", "karte" + (this.wahl.kodex === kx.id ? " gewaehlt" : ""));
        k.innerHTML = `<span class="k-icon">${kx.icon}</span><h3>${U.esc(kx.name)}</h3><p><i>„${U.esc(kx.kurz)}“</i></p>`;
        k.onclick = () => { this.wahl.kodex = kx.id; this.erstellung(3); };
        grid.appendChild(k);
      });
      el.appendChild(grid);
      nav(() => this.erstellung(2), () => {
        if (!this.wahl.kodex) { UI.toast("Wähle deinen Kodex.", "rot"); return; }
        this.erstellung(4);
      });
    }

    if (schritt === 4) {
      el.appendChild(U.el("h1", "create-titel serif", "Wie hart soll die Stadt zu dir sein?"));
      el.appendChild(U.el("p", "create-sub", "Alle Modi sind vollständig und kostenlos – sie unterscheiden sich nur darin, wie viel die Stadt dir verzeiht."));
      const modi = [
        { id: "story", icon: "📖", name: "Story-Modus", info: ["Widerspruchs-Scanner deckt Widersprüche automatisch auf", "Unbegrenzte Theorie-Versuche", "Mehr Nachsicht in Verhören"] },
        { id: "detektiv", icon: "🔍", name: "Detektiv-Modus", info: ["Der Scanner warnt nur – kombinieren musst du selbst", "Zwei Theorie-Versuche", "Empfohlen für das volle Erlebnis"] },
        { id: "meister", icon: "🌑", name: "Meisterdetektiv", info: ["Kein Scanner – nur deine Beweiswand", "Ein einziger Theorie-Versuch, Konsequenzen inklusive", "Verhöre kippen schneller"] },
      ];
      const grid = U.el("div", "karten");
      modi.forEach(mo => {
        const k = U.el("button", "karte" + (this.wahl.schwierigkeit === mo.id ? " gewaehlt" : ""));
        k.innerHTML = `<span class="k-icon">${mo.icon}</span><h3>${U.esc(mo.name)}</h3><ul>${mo.info.map(i => `<li>${U.esc(i)}</li>`).join("")}</ul>`;
        k.onclick = () => { this.wahl.schwierigkeit = mo.id; this.erstellung(4); };
        grid.appendChild(k);
      });
      el.appendChild(grid);
      nav(() => this.erstellung(3), () => this.erstellung(5));
    }

    if (schritt === 5) {
      const b = GameData.welt.berufe.find(x => x.id === this.wahl.beruf);
      const g = GameData.welt.geheimnisse.find(x => x.id === this.wahl.geheimnis);
      const kx = GameData.welt.kodizes.find(x => x.id === this.wahl.kodex);
      el.appendChild(U.el("h1", "create-titel serif", "Die Akte ist angelegt."));
      el.appendChild(U.el("p", "create-sub", "Aschenfurt wartet. Es regnet, natürlich."));
      el.appendChild(U.el("div", "zusammenfassung", `
        <dl>
          <dt>Name</dt><dd><b>${U.esc(this.wahl.name)}</b></dd>
          <dt>Früheres Leben</dt><dd>${b.icon} ${U.esc(b.name)} — <i>${U.esc(b.kurz)}</i></dd>
          <dt>Geheimnis</dt><dd>${g.icon} ${U.esc(g.name)}</dd>
          <dt>Kodex</dt><dd>${kx.icon} ${U.esc(kx.name)}</dd>
          <dt>Modus</dt><dd>${U.esc({ story: "Story", detektiv: "Detektiv", meister: "Meisterdetektiv" }[this.wahl.schwierigkeit])}</dd>
        </dl>`));
      nav(() => this.erstellung(4), () => {
        Engine.neuesSpiel({
          name: this.wahl.name, beruf: this.wahl.beruf,
          geheimnis: this.wahl.geheimnis, kodex: this.wahl.kodex,
          schwierigkeit: this.wahl.schwierigkeit,
        });
        UI.starteSpiel();
        UI.zustand.tab = "chats";
        UI.render();
      }, "🌒 Ermittlung aufnehmen");
    }
  },
};

window.addEventListener("DOMContentLoaded", () => Main.init());

</script>
</body>
</html>
